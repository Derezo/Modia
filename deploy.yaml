schema_version: 1
name: modia
plugin: npm-workspace
version_scheme: semver
target: vps

remote:
  host: mittonvillage.com
  user: modia
  ssh_user: root
  app_dir: /var/www/modia
  releases_kept: 5

runtime:
  port: 3110

# npm workspaces: frontend builds first, then both workspaces ship. The plugin
# runs a hoisted `npm ci --omit=dev --workspaces --include-workspace-root` in
# the stage dir.
build:
  commands:
    - npm run build -w frontend
  artifact_dir: "."
  include:
    - api/src
    - api/package.json
    - frontend/dist
    - frontend/package.json
    - shared
    - package.json
    - package-lock.json
  env: {}

secrets:
  provider: lsd-vault
  lsd_vault:
    keys:
      - DB_HOST
      - DB_NAME
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - JWT_SECRET
      - JWT_REFRESH_SECRET
      - WORLD_SEED
      - NODE_ENV

services:
  # Single instance for first deploy: WebSocket cluster routing requires
  # sticky sessions or Redis pub/sub before scaling beyond 1 (per
  # ecosystem.config.js comment).
  - name: modia-api
    kind: pm2
    script: api/src/index.js
    exec_mode: fork
    singleton: true
    max_memory: 512M

health:
  url: https://modia.mittonvillage.com/api/health
  expect_status: 200

# Catches the failure mode that prompted this whole audit: a deploy where
# secrets point at an empty/wrong DB. modia_production carries 91 tables;
# anything below ~50 means we're connected to the wrong target. lsd sources
# the runtime .env.production for this check, so it sees the same DSN the
# running app sees.
db_sanity_check:
  min_tables: 80

nginx:
  # api-spa.conf.tpl serves the Vite SPA from frontend/dist as static files
  # and proxies /api/ + /health to the Express API on :3110. The previous
  # api.conf.tpl proxied /everything/ to the API, which 404'd on / because
  # Express has no GET / route — that's the "Cannot GET /" symptom.
  template: api-spa.conf.tpl
  server_name: modia.mittonvillage.com
  vars:
    upstream: "127.0.0.1:3110"
    static_root: "frontend/dist"

hooks:
  post_deploy:
    - { id: db-migrate, cmd: npm run db:migrate, cwd: current }
