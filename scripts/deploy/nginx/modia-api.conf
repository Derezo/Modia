# Modia API - modia-api.mittonvillage.com
# Proxies all requests to Node.js backend with WebSocket support
#
# Installation:
#   sudo cp modia-api.conf /etc/nginx/sites-available/modia-api
#   sudo ln -s /etc/nginx/sites-available/modia-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=modia_api_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=modia_api_general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=modia_api_ws_conn:10m;

# Upstream for load balancing (PM2 cluster mode)
upstream modia_api_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name modia-api.mittonvillage.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modia-api.mittonvillage.com;

    # SSL configuration (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/modia-api.mittonvillage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modia-api.mittonvillage.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (no X-Frame-Options for API)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # CORS headers for cross-origin requests from frontend
    set $cors_origin "";
    if ($http_origin ~* "^https://modia\.mittonvillage\.com$") {
        set $cors_origin $http_origin;
    }

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400;
        add_header Content-Type "text/plain; charset=UTF-8";
        add_header Content-Length 0;
        return 204;
    }

    # Add CORS headers to all responses
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Health check endpoint (no rate limiting for monitoring)
    location = /api/health {
        proxy_pass http://modia_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Quick timeout for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Auth endpoints (stricter rate limiting to prevent brute force)
    location ~ ^/api/auth/(login|register|refresh) {
        limit_req zone=modia_api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://modia_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocket endpoint for real-time communication
    location /ws {
        # Limit concurrent WebSocket connections per IP
        limit_conn modia_api_ws_conn 10;

        proxy_pass http://modia_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1 hour timeout (application handles heartbeat/ping)
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Disable buffering for real-time
        proxy_buffering off;
    }

    # General API endpoints
    location /api/ {
        limit_req zone=modia_api_general burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://modia_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request body size limit (for file uploads if needed)
        client_max_body_size 10m;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
    }

    # Catch-all for non-API requests - return 404
    location / {
        return 404 '{"error":"Not Found","message":"This is the API server. Visit https://modia.mittonvillage.com for the game."}';
        default_type application/json;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Access and error logs
    access_log /var/log/nginx/modia-api.access.log;
    error_log /var/log/nginx/modia-api.error.log;
}
