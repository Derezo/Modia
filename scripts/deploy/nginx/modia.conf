# Modia Frontend - modia.mittonvillage.com
# Serves static files with SPA fallback and proxies API/WS requests
#
# Installation:
#   sudo cp modia.conf /etc/nginx/sites-available/modia
#   sudo ln -s /etc/nginx/sites-available/modia /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=modia_frontend:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=modia_ws_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name modia.mittonvillage.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modia.mittonvillage.com;

    # SSL configuration (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/modia.mittonvillage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modia.mittonvillage.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Document root - symlinked to active release
    root <APP_DIR>/current/frontend/dist;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://modia.mittonvillage.com https://modia-api.mittonvillage.com; media-src 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static assets with aggressive caching (Vite hash-busted filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        # Specific handling for audio files
        location ~* \.(mp3|ogg|wav)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Specific handling for images
        location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        try_files $uri =404;
    }

    # API proxy (same-origin pattern for simpler CORS)
    location /api/ {
        limit_req zone=modia_frontend burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request body size limit
        client_max_body_size 10m;

        # Buffer settings
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy
    location /ws {
        # Limit concurrent WebSocket connections per IP
        limit_conn modia_ws_conn 10;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1 hour timeout (application handles heartbeat/ping)
        proxy_connect_timeout 1h;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        limit_req zone=modia_frontend burst=50 nodelay;

        # Try to serve file directly, then directory, then fall back to index.html
        try_files $uri $uri/ /index.html;

        # Cache HTML files for a short time
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Deny access to hidden files (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Favicon - serve directly with caching
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
        log_not_found off;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Access and error logs
    access_log /var/log/nginx/modia.access.log;
    error_log /var/log/nginx/modia.error.log;
}
