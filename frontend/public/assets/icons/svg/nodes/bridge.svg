<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Bridge shadow -->
  <ellipse cx="12" cy="22" rx="10" ry="2" fill="#2a2a2a" opacity="0.3"/>

  <!-- Water underneath -->
  <path d="M2 18c2-0.8 4 0.8 6 0s4 0.8 6 0s4 0.8 6 0" fill="none" stroke="#4a7a9a" stroke-width="1.5"/>
  <path d="M1 20c2.5-0.6 5 0.6 7.5 0s5 0.6 7.5 0s5 0.6 7.5 0" fill="none" stroke="#3a6a8a" stroke-width="1"/>
  <path d="M0 22c3-0.5 6 0.5 9 0s6 0.5 9 0s6 0.5 6 0" fill="none" stroke="#2a5a7a" stroke-width="0.8"/>

  <!-- Stone arch (darkest layer) -->
  <path d="M2 17c0-7 4.5-12 10-12s10 5 10 12" fill="#4a4a4a"/>

  <!-- Stone arch (medium layer) -->
  <path d="M3 17c0-6 4-10.5 9-10.5s9 4.5 9 10.5" fill="#606060"/>

  <!-- Stone arch (light layer) -->
  <path d="M4 17c0-5 3.5-9 8-9s8 4 8 9" fill="#707070"/>

  <!-- Arch highlight -->
  <path d="M5 17c0-4 3-7.5 6-7.5s3 2 3 5" fill="#808080" opacity="0.5"/>

  <!-- Bridge deck base (dark stone) -->
  <rect x="1" y="12" width="22" height="4" fill="#5a5a5a"/>

  <!-- Bridge deck top (medium stone) -->
  <rect x="1" y="12" width="22" height="3" fill="#707070"/>

  <!-- Bridge deck surface (wood planks) -->
  <rect x="1" y="12" width="22" height="2" fill="#5a4020"/>
  <rect x="1.5" y="12.2" width="21" height="1.6" fill="#6b4a2a"/>

  <!-- Wood plank lines -->
  <g fill="none" stroke="#4a3018" stroke-width="0.3">
    <path d="M4 12v2M8 12v2M12 12v2M16 12v2M20 12v2"/>
  </g>

  <!-- Stone railing posts -->
  <g fill="#5a5a5a">
    <rect x="2" y="9" width="2" height="3"/>
    <rect x="7" y="9" width="2" height="3"/>
    <rect x="15" y="9" width="2" height="3"/>
    <rect x="20" y="9" width="2" height="3"/>
  </g>

  <!-- Post tops (lighter) -->
  <g fill="#707070">
    <rect x="2.2" y="9" width="1.6" height="1"/>
    <rect x="7.2" y="9" width="1.6" height="1"/>
    <rect x="15.2" y="9" width="1.6" height="1"/>
    <rect x="20.2" y="9" width="1.6" height="1"/>
  </g>

  <!-- Keystone at arch top -->
  <rect x="10.5" y="5.5" width="3" height="2.5" fill="#606060"/>
  <rect x="11" y="6" width="2" height="1.5" fill="#707070"/>

  <!-- Stone texture on arch -->
  <g fill="none" stroke="#4a4a4a" stroke-width="0.4">
    <path d="M5 14c0-3 2-6 5-6"/>
    <path d="M19 14c0-3-2-6-5-6"/>
    <path d="M6 16c0-2 1.5-4.5 4-5"/>
    <path d="M18 16c0-2-1.5-4.5-4-5"/>
  </g>

  <!-- Bridge side pillars -->
  <rect x="1" y="14" width="3" height="7" fill="#4a4a4a"/>
  <rect x="1.3" y="14" width="2.4" height="6.5" fill="#5a5a5a"/>
  <rect x="20" y="14" width="3" height="7" fill="#4a4a4a"/>
  <rect x="20.3" y="14" width="2.4" height="6.5" fill="#5a5a5a"/>

  <!-- Bottom depth -->
  <path d="M1 20h3v1H1zM20 20h3v1h-3z" fill="#3a3a3a" opacity="0.3"/>
</svg>
