    <path d="M5 7h14M5 10h14M5 13h14M5 16h14"/>
  </g>

  <!-- Curled edge effect on corners -->
  <path d="M3 18c0.5-0.5 1-0.3 1.5 0" fill="none" stroke="#5a4020" stroke-width="0.4"/>
  <path d="M21 18c-0.5-0.5-1-0.3-1.5 0" fill="none" stroke="#7a5a30" stroke-width="0.4"/>

  <!-- Gold question mark (shadow/depth) -->
