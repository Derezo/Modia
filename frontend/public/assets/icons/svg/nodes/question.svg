  <g fill="none" stroke="#daa520" stroke-width="0.6" stroke-linecap="round">
    <path d="M5 5l1.5 0M5 5l0 1.5"/>
    <path d="M19 5l-1.5 0M19 5l0 1.5"/>
    <path d="M5 19l1.5 0M5 19l0-1.5"/>
    <path d="M19 19l-1.5 0M19 19l0-1.5"/>
