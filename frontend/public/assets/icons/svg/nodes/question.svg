  <!-- Question mark dot (shadow) -->
  <ellipse cx="12" cy="16" rx="1.5" ry="1.5" fill="#8b6914"/>

  <!-- Question mark dot (main) -->
  <ellipse cx="12" cy="16" rx="1.2" ry="1.2" fill="#daa520"/>

  <!-- Question mark dot (highlight) -->
  <ellipse cx="11.7" cy="15.7" rx="0.6" ry="0.6" fill="#ffd700" opacity="0.6"/>

