  <!-- Parchment outer edge (dark brown) -->
  <path d="M4 3c-1 0-2 1-2 2v14c0 1 1 2 2 2h16c1 0 2-1 2-2V5c0-1-1-2-2-2H4z" fill="#6b4a20"/>

