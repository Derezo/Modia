<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Training grounds shadow -->
  <ellipse cx="12" cy="22" rx="9" ry="2" fill="#2a2a2a" opacity="0.3"/>

  <!-- Ground (dirt arena) -->
  <ellipse cx="12" cy="21" rx="10" ry="2.5" fill="#5a4a30"/>
  <ellipse cx="11" cy="21" rx="7" ry="1.8" fill="#6b5a40" opacity="0.5"/>

  <!-- Training dummy post (dark wood) -->
  <rect x="10.5" y="12" width="3" height="9" fill="#4a3018"/>
  <rect x="10.8" y="12" width="2.4" height="8.5" fill="#5a4020"/>
  <rect x="11" y="12" width="1.5" height="8" fill="#6b4a28" opacity="0.5"/>

  <!-- Dummy base (wood platform) -->
  <ellipse cx="12" cy="21" rx="4" ry="1" fill="#4a3018"/>
  <ellipse cx="12" cy="20.8" rx="3.5" ry="0.8" fill="#5a4020"/>
  <ellipse cx="11.5" cy="20.6" rx="2" ry="0.5" fill="#6b4a28" opacity="0.4"/>

  <!-- Dummy body (straw/hay) -->
  <ellipse cx="12" cy="8" rx="4" ry="5" fill="#8b7a30"/>
  <ellipse cx="12" cy="8" rx="3.5" ry="4.5" fill="#a08a40"/>
  <ellipse cx="11" cy="7.5" rx="2.5" ry="3.5" fill="#b09a50"/>
  <ellipse cx="10.5" cy="7" rx="1.5" ry="2.5" fill="#c0aa60" opacity="0.5"/>

  <!-- Dummy head -->
  <circle cx="12" cy="4" r="2.5" fill="#8b7a30"/>
  <circle cx="12" cy="4" r="2.2" fill="#a08a40"/>
  <circle cx="11.5" cy="3.7" r="1.5" fill="#b09a50"/>
  <circle cx="11" cy="3.5" r="0.8" fill="#c0aa60" opacity="0.5"/>

  <!-- Target painted on dummy -->
  <circle cx="12" cy="8" r="2.5" fill="none" stroke="#8b2020" stroke-width="0.8"/>
  <circle cx="12" cy="8" r="1.5" fill="none" stroke="#8b2020" stroke-width="0.6"/>
  <circle cx="12" cy="8" r="0.5" fill="#8b2020"/>

  <!-- Dummy arms (crossbar) -->
  <rect x="5" y="8" width="14" height="1.5" fill="#4a3018"/>
  <rect x="5.2" y="8.2" width="13.6" height="1.1" fill="#5a4020"/>
  <rect x="5.5" y="8.3" width="6" height="0.8" fill="#6b4a28" opacity="0.4"/>

  <!-- Practice sword leaning against post -->
  <g transform="rotate(-20, 18, 18)">
    <!-- Blade -->
    <rect x="16" y="6" width="1.5" height="12" fill="#5a5a5a"/>
    <rect x="16.2" y="6.2" width="1.1" height="11.6" fill="#808080"/>
    <rect x="16.3" y="6.3" width="0.6" height="11" fill="#a0a0a0"/>
    <rect x="16.4" y="6.5" width="0.3" height="10" fill="#c0c0c0" opacity="0.5"/>

    <!-- Guard -->
    <rect x="14.5" y="17.5" width="4.5" height="1" rx="0.2" fill="#4a3018"/>
    <rect x="14.7" y="17.6" width="4.1" height="0.8" rx="0.15" fill="#5a4020"/>

    <!-- Hilt -->
    <rect x="16.3" y="18.5" width="1" height="3" fill="#4a3018"/>
    <rect x="16.4" y="18.6" width="0.8" height="2.8" fill="#5a4020"/>

    <!-- Pommel -->
    <circle cx="16.8" cy="22" r="0.8" fill="#4a3018"/>
    <circle cx="16.7" cy="21.9" r="0.6" fill="#5a4020"/>
  </g>

  <!-- Weapon rack in background -->
  <rect x="2" y="10" width="1.5" height="10" fill="#4a3018"/>
  <rect x="2.2" y="10" width="1.1" height="9.5" fill="#5a4020"/>

  <!-- Swords on rack -->
  <g fill="#5a5a5a">
    <rect x="1" y="11" width="0.8" height="5" transform="rotate(-10, 1.4, 13.5)"/>
    <rect x="2.5" y="11" width="0.8" height="5" transform="rotate(5, 2.9, 13.5)"/>
  </g>
  <g fill="#808080" opacity="0.6">
    <rect x="1.1" y="11.1" width="0.5" height="4.5" transform="rotate(-10, 1.35, 13.35)"/>
    <rect x="2.6" y="11.1" width="0.5" height="4.5" transform="rotate(5, 2.85, 13.35)"/>
  </g>

  <!-- Shield on ground -->
  <ellipse cx="20" cy="18" rx="2" ry="3" fill="#5a5a5a"/>
  <ellipse cx="20" cy="18" rx="1.7" ry="2.7" fill="#707070"/>
  <ellipse cx="19.8" cy="17.8" rx="1.2" ry="2" fill="#808080"/>
  <ellipse cx="19.6" cy="17.5" rx="0.6" ry="1" fill="#909090" opacity="0.5"/>

  <!-- Bottom depth -->
  <path d="M5 20h14v1H5z" fill="#3a3a2a" opacity="0.2"/>
</svg>
