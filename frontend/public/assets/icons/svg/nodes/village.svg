<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Village shadow -->
  <ellipse cx="12" cy="22" rx="9" ry="2" fill="#2a1a08" opacity="0.3"/>

  <!-- Green field background -->
  <ellipse cx="12" cy="20" rx="10" ry="3" fill="#2d5530"/>
  <ellipse cx="12" cy="20" rx="9" ry="2.5" fill="#448844"/>
  <ellipse cx="10" cy="19" rx="6" ry="1.5" fill="#66aa66" opacity="0.5"/>

  <!-- Main cottage (dark brown) -->
  <path d="M6 20V13l6-5 6 5v7H6z" fill="#4a3018"/>

  <!-- Cottage front (medium brown) -->
  <path d="M7 20V14l5-4 5 4v6H7z" fill="#6b4423"/>

  <!-- Cottage lit side (light brown) -->
  <path d="M8 19V15l4-3v7H8z" fill="#8b5a30"/>

  <!-- Roof thatch (dark) -->
  <path d="M5 13l7-6 7 6H5z" fill="#5a4020"/>

  <!-- Roof thatch (medium) -->
  <path d="M6 12.5l6-5 6 5H6z" fill="#7a5a30"/>

  <!-- Roof highlight -->
  <path d="M8 11.5l4-3.5 2 1.5-5 4z" fill="#8b6a40" opacity="0.5"/>

  <!-- Cottage door -->
  <rect x="10" y="15" width="4" height="5" fill="#3a2010"/>
  <rect x="10.5" y="15.5" width="3" height="4.5" fill="#4a3018"/>
  <circle cx="13" cy="17.5" r="0.4" fill="#8b6914"/>

  <!-- Window -->
  <rect x="15" y="14" width="2" height="2" fill="#2a1a08"/>
  <path d="M15.3 14.3h1.4v1.4h-1.4z" fill="#daa520" opacity="0.4"/>
  <path d="M16 14v2M15 15h2" fill="none" stroke="#4a3018" stroke-width="0.3"/>

  <!-- Chimney -->
  <rect x="15" y="8" width="2" height="4" fill="#5a4a3a"/>
  <rect x="15.2" y="8.2" width="1.6" height="3.6" fill="#6a5a4a"/>

  <!-- Smoke wisps -->
  <g fill="none" stroke="#9a9a9a" stroke-width="0.5" opacity="0.5">
    <path d="M16 7c0.5-1 0-1.5 0.5-2"/>
    <path d="M16.5 6c-0.3-0.8 0.3-1.2 0-2"/>
  </g>

  <!-- Small background cottage -->
  <path d="M2 20v-4l3-2.5 3 2.5v4H2z" fill="#4a3018" opacity="0.7"/>
  <path d="M1.5 16l3.5-3 3.5 3H1.5z" fill="#5a4020" opacity="0.7"/>

  <!-- Bottom depth shadow -->
  <path d="M6 19h12v1.5H6z" fill="#2a1a08" opacity="0.2"/>
</svg>
