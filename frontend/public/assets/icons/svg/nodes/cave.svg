<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Cave shadow -->
  <ellipse cx="12" cy="22" rx="9" ry="2" fill="#1a1a1a" opacity="0.4"/>

  <!-- Mountain/rock base (darkest) -->
  <path d="M1 21l4-7 3 2 4-10 4 10 3-2 4 7H1z" fill="#2a2a2a"/>

  <!-- Rock middle layer -->
  <path d="M2 21l3.5-6 3 1.5 3.5-8 3.5 8 3-1.5 3.5 6H2z" fill="#4a4a4a"/>

  <!-- Rock front layer (lighter) -->
  <path d="M3 21l3-5 2.5 1 3.5-6.5 2.5 5 2-0.5 3 6H3z" fill="#6a6a6a"/>

  <!-- Highlight on rocks -->
  <path d="M5 18l2-3 1.5 0.5 2-3v5z" fill="#7a7a7a" opacity="0.5"/>

  <!-- Cave entrance (dark void) -->
  <path d="M7 21c0-5 2.5-8 5-8s5 3 5 8H7z" fill="#0a0a0a"/>

  <!-- Cave interior shadow gradient -->
  <path d="M8 21c0-4 2-6.5 4-6.5s4 2.5 4 6.5H8z" fill="#151515"/>
  <path d="M9 21c0-3 1.5-5 3-5s3 2 3 5H9z" fill="#1a1a1a"/>

  <!-- Torch on left side -->
  <rect x="5" y="12" width="1.2" height="4" fill="#4a3018"/>
  <ellipse cx="5.6" cy="11.5" rx="1.2" ry="1.8" fill="#cc4400"/>
  <ellipse cx="5.6" cy="11" rx="0.8" ry="1.2" fill="#ff6600"/>
  <ellipse cx="5.6" cy="10.5" rx="0.4" ry="0.7" fill="#ffaa00"/>

  <!-- Torch glow effect -->
  <ellipse cx="5.6" cy="12" rx="3" ry="4" fill="#ff6600" opacity="0.15"/>

  <!-- Torch on right side -->
  <rect x="17.8" y="12" width="1.2" height="4" fill="#4a3018"/>
  <ellipse cx="18.4" cy="11.5" rx="1.2" ry="1.8" fill="#cc4400"/>
  <ellipse cx="18.4" cy="11" rx="0.8" ry="1.2" fill="#ff6600"/>
  <ellipse cx="18.4" cy="10.5" rx="0.4" ry="0.7" fill="#ffaa00"/>

  <!-- Right torch glow -->
  <ellipse cx="18.4" cy="12" rx="3" ry="4" fill="#ff6600" opacity="0.15"/>

  <!-- Stalactites in cave entrance -->
  <g fill="#3a3a3a">
    <path d="M9 13l0.5 2-0.5 0.5-0.5-0.5z"/>
    <path d="M11 13.5l0.4 1.5-0.4 0.4-0.4-0.4z"/>
    <path d="M13 13l0.4 2-0.4 0.4-0.4-0.4z"/>
    <path d="M15 13.5l0.5 1.5-0.5 0.5-0.5-0.5z"/>
  </g>

  <!-- Rock texture details -->
  <g fill="none" stroke="#3a3a3a" stroke-width="0.4">
    <path d="M4 17l1-1M19 17l1-1"/>
    <path d="M6 14l0.5 0.5M17 14l0.5 0.5"/>
  </g>

  <!-- Bottom depth -->
  <path d="M1 20h22v1H1z" fill="#1a1a1a" opacity="0.3"/>
</svg>
