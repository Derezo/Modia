<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Stables shadow -->
  <ellipse cx="12" cy="22" rx="9" ry="2" fill="#2a1a08" opacity="0.3"/>

  <!-- Ground (hay scattered) -->
  <ellipse cx="12" cy="21" rx="10" ry="2" fill="#6b5a30"/>
  <ellipse cx="10" cy="21" rx="6" ry="1.2" fill="#8b7a40" opacity="0.5"/>

  <!-- Stable building base (dark brown) -->
  <path d="M2 20V10h20v10H2z" fill="#4a3018"/>

  <!-- Stable building front (medium brown) -->
  <path d="M2.5 20V10.5h19v9.5H2.5z" fill="#5a4020"/>

  <!-- Stable building lit side (light brown) -->
  <path d="M3 19V11h10v8H3z" fill="#6b4a28"/>

  <!-- Building highlight -->
  <rect x="3.5" y="11.5" width="5" height="6" fill="#7a5a38" opacity="0.4"/>

  <!-- Roof (dark wood) -->
  <path d="M1 10l11-7 11 7H1z" fill="#3a2010"/>

  <!-- Roof (medium wood) -->
  <path d="M2 9.5l10-6 10 6H2z" fill="#4a3018"/>

  <!-- Roof lit side -->
  <path d="M3 9l9-5.5 3 1.5-10 5z" fill="#5a4020"/>

  <!-- Roof highlight -->
  <path d="M5 8l6-4 2 1-7 4z" fill="#6a5030" opacity="0.5"/>

  <!-- Roof texture lines -->
  <g fill="none" stroke="#2a1a08" stroke-width="0.3">
    <path d="M4 9l8-5M6 9l8-5M8 9l8-5M10 9l8-5"/>
  </g>

  <!-- Horse stall door left -->
  <rect x="3" y="12" width="5" height="8" fill="#3a2010"/>
  <rect x="3.3" y="12.3" width="4.4" height="7.4" fill="#4a3018"/>
  <rect x="3.5" y="12.5" width="4" height="3.5" fill="#5a4020"/>

  <!-- Horse stall door right -->
  <rect x="10" y="12" width="5" height="8" fill="#3a2010"/>
  <rect x="10.3" y="12.3" width="4.4" height="7.4" fill="#4a3018"/>
  <rect x="10.5" y="12.5" width="4" height="3.5" fill="#5a4020"/>

  <!-- Stall dividers -->
  <path d="M8 12v8M15 12v8" fill="none" stroke="#2a1a08" stroke-width="1"/>

  <!-- Door hardware (hinges) -->
  <g fill="#4a4a4a">
    <rect x="3.2" y="13" width="0.8" height="1.5"/>
    <rect x="3.2" y="17" width="0.8" height="1.5"/>
    <rect x="10.2" y="13" width="0.8" height="1.5"/>
    <rect x="10.2" y="17" width="0.8" height="1.5"/>
  </g>

  <!-- Horse head peeking out (left stall) -->
  <path d="M5 12c0-2 1-3.5 2-4h1c0.5 0 1 0.5 1 1v2c0 0.5-0.3 1-0.8 1.2l-1.2 0.3c-0.5 0.1-1 0-1.5-0.2" fill="#5a4030"/>
  <path d="M5.5 11.5c0-1.5 0.8-2.8 1.6-3.2h0.7c0.4 0 0.7 0.4 0.7 0.8v1.6c0 0.4-0.2 0.8-0.6 1l-1 0.2" fill="#6b5040"/>
  <circle cx="7.5" cy="10" r="0.4" fill="#2a1a08"/>
  <ellipse cx="8.3" cy="11.3" rx="0.3" ry="0.2" fill="#3a2a18"/>

  <!-- Hay bale on right -->
  <rect x="16" y="15" width="5" height="5" rx="0.5" fill="#8b7a30"/>
  <rect x="16.3" y="15.3" width="4.4" height="4.4" rx="0.3" fill="#a08a40"/>
  <rect x="16.5" y="15.5" width="2.5" height="3" fill="#b09a50" opacity="0.5"/>

  <!-- Hay bale ties -->
  <path d="M16 17h5M16 19h5" fill="none" stroke="#5a4a20" stroke-width="0.5"/>

  <!-- Scattered hay on ground -->
  <g fill="#a09050">
    <ellipse cx="4" cy="20.5" rx="1" ry="0.3"/>
    <ellipse cx="14" cy="20.5" rx="1.2" ry="0.3"/>
    <ellipse cx="9" cy="20.3" rx="0.8" ry="0.25"/>
  </g>

  <!-- Horseshoe on wall -->
  <path d="M18 11c-1 0-1.5 0.8-1.5 1.5 0 0.5 0.3 1 0.8 1.2h1.4c0.5-0.2 0.8-0.7 0.8-1.2 0-0.7-0.5-1.5-1.5-1.5z" fill="none" stroke="#5a5a5a" stroke-width="0.6"/>
  <g fill="#5a5a5a">
    <circle cx="17" cy="12.5" r="0.25"/>
    <circle cx="19" cy="12.5" r="0.25"/>
  </g>

  <!-- Bottom depth -->
  <path d="M2 19h20v1.5H2z" fill="#2a1a08" opacity="0.2"/>
</svg>
