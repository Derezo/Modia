<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Throne shadow -->
  <ellipse cx="12" cy="22" rx="8" ry="2" fill="#3d2a00" opacity="0.3"/>

  <!-- Throne back (dark gold) -->
  <path d="M5 20V7c0-2 1.5-4 3.5-4h7c2 0 3.5 2 3.5 4v13H5z" fill="#8b6914"/>

  <!-- Throne back (gold) -->
  <path d="M6 20V8c0-1.5 1-3 2.5-3h7c1.5 0 2.5 1.5 2.5 3v12H6z" fill="#daa520"/>

  <!-- Throne back highlight (light gold) -->
