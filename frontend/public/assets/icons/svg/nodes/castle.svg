<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Castle shadow -->
  <ellipse cx="12" cy="22" rx="9" ry="2" fill="#2a2a2a" opacity="0.3"/>

  <!-- Castle base (dark stone) -->
  <path d="M3 21V10l2-2V5h3v3l4-3 4 3V5h3v3l2 2v11H3z" fill="#4a4a4a"/>

  <!-- Castle front face (medium stone) -->
  <path d="M4 21V11l2-2V6h2v3l4-3 4 3V6h2v3l2 2v10H4z" fill="#707070"/>

  <!-- Castle lit area (light stone) -->
  <path d="M5 20V12l1-1h2l4-3 3 2v10H5z" fill="#909090"/>

  <!-- Highlight -->
  <path d="M6 12l3-2v8H6z" fill="#a0a0a0" opacity="0.5"/>

  <!-- Red banner on tower -->
  <rect x="11" y="3" width="2" height="4" fill="#8b2020"/>
  <path d="M11 3h2v1.5l-1 0.5-1-0.5z" fill="#c93030"/>

  <!-- Flag pole -->
  <path d="M12 2v2" fill="none" stroke="#4a4a4a" stroke-width="0.8"/>

  <!-- Battlements -->
  <path d="M3 10h2v-2h2v2h2v-2h2v2h2v-2h2v2h2v-2h2v2h2" fill="none" stroke="#3a3a3a" stroke-width="0.6"/>

  <!-- Central gate -->
  <path d="M10 21v-5c0-1.5 0.9-2.5 2-2.5s2 1 2 2.5v5" fill="#2a2a2a"/>
  <path d="M10.5 21v-4.5c0-1 0.7-1.8 1.5-1.8s1.5 0.8 1.5 1.8v4.5" fill="#3a3a3a"/>

  <!-- Windows -->
  <rect x="5" y="13" width="2" height="2.5" fill="#2a2a2a"/>
  <rect x="17" y="13" width="2" height="2.5" fill="#2a2a2a"/>

  <!-- Window glow -->
  <rect x="5.3" y="13.3" width="1.4" height="1.9" fill="#4a3a20" opacity="0.5"/>
  <rect x="17.3" y="13.3" width="1.4" height="1.9" fill="#4a3a20" opacity="0.5"/>

  <!-- Stone detail lines -->
  <g fill="none" stroke="#3a3a3a" stroke-width="0.4">
    <path d="M4 15h4M4 17h4M16 15h4M16 17h4"/>
    <path d="M7 12v3M17 12v3"/>
  </g>

  <!-- Bottom shadow for depth -->
  <path d="M3 19h18v2H3z" fill="#3a3a3a" opacity="0.3"/>
</svg>
