<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Temple shadow -->
  <ellipse cx="12" cy="22" rx="9" ry="2" fill="#5a5a5a" opacity="0.3"/>

  <!-- Temple base platform (dark gray) -->
  <rect x="2" y="19" width="20" height="2" fill="#909090"/>
  <rect x="2.5" y="19" width="19" height="1.5" fill="#b0b0b0"/>

  <!-- Building body (dark layer) -->
  <rect x="3" y="8" width="18" height="11" fill="#c0c0c0"/>

  <!-- Building body (medium layer) -->
  <rect x="3.5" y="8.5" width="17" height="10" fill="#d8d8d8"/>

  <!-- Building body (light layer) -->
  <rect x="4" y="9" width="10" height="9" fill="#e8e8e8"/>

  <!-- Building highlight -->
  <rect x="4.5" y="9.5" width="6" height="7" fill="#f0f0f0" opacity="0.5"/>

  <!-- Roof pediment (dark) -->
  <path d="M1 8l11-6 11 6H1z" fill="#b0b0b0"/>

  <!-- Roof pediment (medium) -->
  <path d="M2 7.5l10-5.5 10 5.5H2z" fill="#d0d0d0"/>

  <!-- Roof pediment (light) -->
  <path d="M3 7l9-5 5 2.5-12 4z" fill="#e0e0e0"/>

  <!-- Roof highlight -->
  <path d="M5 6.5l7-4 2 1-8 4z" fill="#f0f0f0" opacity="0.5"/>

  <!-- Gold trim on roof edge -->
  <path d="M1 8h22" fill="none" stroke="#daa520" stroke-width="0.8"/>
  <path d="M12 2l-10 5.5" fill="none" stroke="#b8860b" stroke-width="0.4"/>
  <path d="M12 2l10 5.5" fill="none" stroke="#daa520" stroke-width="0.4"/>

  <!-- Columns (4 pillars) -->
  <g>
    <!-- Column 1 -->
    <rect x="5" y="8" width="2" height="11" fill="#a0a0a0"/>
    <rect x="5.3" y="8" width="1.4" height="10.5" fill="#c8c8c8"/>
    <rect x="5.5" y="8" width="0.8" height="10" fill="#e0e0e0" opacity="0.5"/>

    <!-- Column 2 -->
    <rect x="9" y="8" width="2" height="11" fill="#a0a0a0"/>
    <rect x="9.3" y="8" width="1.4" height="10.5" fill="#c8c8c8"/>
    <rect x="9.5" y="8" width="0.8" height="10" fill="#e0e0e0" opacity="0.5"/>

    <!-- Column 3 -->
    <rect x="13" y="8" width="2" height="11" fill="#a0a0a0"/>
    <rect x="13.3" y="8" width="1.4" height="10.5" fill="#c8c8c8"/>
    <rect x="13.5" y="8" width="0.8" height="10" fill="#e0e0e0" opacity="0.5"/>

    <!-- Column 4 -->
    <rect x="17" y="8" width="2" height="11" fill="#a0a0a0"/>
    <rect x="17.3" y="8" width="1.4" height="10.5" fill="#c8c8c8"/>
    <rect x="17.5" y="8" width="0.8" height="10" fill="#e0e0e0" opacity="0.5"/>
  </g>

  <!-- Column capitals (gold) -->
  <g fill="#daa520">
    <rect x="4.5" y="7.5" width="3" height="1" rx="0.2"/>
    <rect x="8.5" y="7.5" width="3" height="1" rx="0.2"/>
    <rect x="12.5" y="7.5" width="3" height="1" rx="0.2"/>
    <rect x="16.5" y="7.5" width="3" height="1" rx="0.2"/>
  </g>

  <!-- Column bases -->
  <g fill="#a0a0a0">
    <rect x="4.5" y="18.5" width="3" height="0.5"/>
    <rect x="8.5" y="18.5" width="3" height="0.5"/>
    <rect x="12.5" y="18.5" width="3" height="0.5"/>
    <rect x="16.5" y="18.5" width="3" height="0.5"/>
  </g>

  <!-- Door arch -->
  <path d="M9 19v-5c0-2 1.5-3 3-3s3 1 3 3v5" fill="#808080"/>
  <path d="M9.5 19v-4.5c0-1.5 1.2-2.5 2.5-2.5s2.5 1 2.5 2.5v4.5" fill="#606060"/>

  <!-- Sacred symbol (gold sun) -->
  <circle cx="12" cy="5" r="1.2" fill="#daa520"/>
  <circle cx="12" cy="5" r="0.8" fill="#ffd700"/>
  <circle cx="11.8" cy="4.8" r="0.4" fill="#ffe44d" opacity="0.6"/>

  <!-- Sun rays -->
  <g fill="none" stroke="#daa520" stroke-width="0.4">
    <path d="M12 3.3v-0.8M12 6.7v0.8"/>
    <path d="M10.3 5h-0.8M13.7 5h0.8"/>
    <path d="M10.8 3.8l-0.5-0.5M13.2 6.2l0.5 0.5"/>
    <path d="M13.2 3.8l0.5-0.5M10.8 6.2l-0.5 0.5"/>
  </g>

  <!-- Bottom depth -->
  <path d="M2 20h20v1H2z" fill="#707070" opacity="0.2"/>
</svg>
