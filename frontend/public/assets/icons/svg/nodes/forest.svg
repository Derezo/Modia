<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Forest shadow -->
  <ellipse cx="12" cy="22" rx="9" ry="2" fill="#1a3018" opacity="0.4"/>

  <!-- Ground -->
  <ellipse cx="12" cy="21" rx="10" ry="2" fill="#2d3520"/>
  <ellipse cx="11" cy="21" rx="7" ry="1.5" fill="#3d4530" opacity="0.6"/>

  <!-- Background trees (smaller, darker) -->
  <g opacity="0.6">
    <!-- Left back tree -->
    <path d="M4 21v-3" fill="none" stroke="#3a2a18" stroke-width="1.5"/>
    <path d="M4 14l-2.5 4h5l-2.5-4z" fill="#2d5530"/>
    <path d="M4 11l-2 3h4l-2-3z" fill="#2d5530"/>

    <!-- Right back tree -->
    <path d="M20 21v-3" fill="none" stroke="#3a2a18" stroke-width="1.5"/>
    <path d="M20 14l-2.5 4h5l-2.5-4z" fill="#2d5530"/>
    <path d="M20 11l-2 3h4l-2-3z" fill="#2d5530"/>
  </g>

  <!-- Main tree trunk (brown) -->
  <path d="M12 21v-6" fill="none" stroke="#4a3018" stroke-width="3"/>
  <path d="M11 21v-5.5" fill="none" stroke="#6b4423" stroke-width="1.5"/>

  <!-- Tree foliage layer 1 (dark green) -->
  <path d="M12 4l-7 9h4l-3 5h12l-3-5h4l-7-9z" fill="#2d5530"/>

  <!-- Tree foliage layer 2 (medium green) -->
  <path d="M12 5l-6 8h3.5l-2.5 4h10l-2.5-4h3.5l-6-8z" fill="#448844"/>

  <!-- Tree foliage layer 3 (light green highlight) -->
  <path d="M12 6l-4.5 6h2.5l-2 3h6l-1-2h2l-3-7z" fill="#66aa66"/>

  <!-- Highlight on foliage -->
  <path d="M10 8l-2 4h3l-1 2h2l1-3h-1l1-3z" fill="#77bb77" opacity="0.5"/>

  <!-- Branch details -->
  <g fill="none" stroke="#2a4a2a" stroke-width="0.5">
    <path d="M9 10l-1 1M15 10l1 1"/>
    <path d="M8 14l-1 1M16 14l1 1"/>
  </g>

  <!-- Small undergrowth -->
  <g fill="#3d6640">
    <ellipse cx="6" cy="20" rx="2" ry="1"/>
    <ellipse cx="18" cy="20" rx="2" ry="1"/>
    <ellipse cx="9" cy="20.5" rx="1.5" ry="0.7"/>
    <ellipse cx="15" cy="20.5" rx="1.5" ry="0.7"/>
  </g>

  <!-- Bottom depth -->
  <path d="M5 20c3 0.5 6 0.5 9 0.5s5 0 7-0.5" fill="none" stroke="#1a2a18" stroke-width="0.5" opacity="0.5"/>
</svg>
