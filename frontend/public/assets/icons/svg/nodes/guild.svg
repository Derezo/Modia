<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shield shadow -->
  <ellipse cx="12" cy="22" rx="7" ry="2" fill="#3d2200" opacity="0.3"/>

  <!-- Shield outer rim (dark bronze) -->
  <path d="M12 1L3 5v7c0 6 4 10.5 9 12 5-1.5 9-6 9-12V5l-9-4z" fill="#8b5514"/>

  <!-- Shield main face (bronze) -->
  <path d="M12 2L4 5.5v6.5c0 5.5 3.5 9.5 8 11 4.5-1.5 8-5.5 8-11V5.5L12 2z" fill="#cd7f32"/>

  <!-- Shield inner area (light bronze) -->
  <path d="M12 3L5 6.2v6c0 5 3 8.5 7 10 4-1.5 7-5 7-10v-6L12 3z" fill="#e6a852"/>

  <!-- Shield highlight -->
  <path d="M12 4L6 7v5c0 3.5 2 6 5 7.5V4z" fill="#f0b862" opacity="0.5"/>

  <!-- Top edge highlight -->
  <path d="M12 3L7 5.5v3c0 1 0.5 2 1.5 2.5l3.5-8z" fill="#f8c872" opacity="0.4"/>

  <!-- Inner rim detail (gold trim) -->
  <path d="M12 4L6 7v5.5c0 4.5 2.5 8 6 9.5 3.5-1.5 6-5 6-9.5V7l-6-3z" fill="none" stroke="#daa520" stroke-width="0.6"/>

  <!-- Star emblem (embossed gold) -->
  <g fill="none" stroke="#8b5514" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Five-pointed star -->
    <path d="M12 6l1.5 3.5 3.5 0.5-2.5 2.5 0.5 3.5-3-1.8-3 1.8 0.5-3.5-2.5-2.5 3.5-0.5z"/>
  </g>

  <!-- Star fill (subtle gold) -->
  <path d="M12 7l1.2 2.8 2.8 0.4-2 2 0.4 2.8-2.4-1.4-2.4 1.4 0.4-2.8-2-2 2.8-0.4z" fill="#daa520" opacity="0.3"/>

  <!-- Center star highlight -->
  <circle cx="11" cy="10" r="1" fill="#f0c050" opacity="0.4"/>

  <!-- Shield border rivets -->
  <g fill="#8b5514">
    <circle cx="6" cy="7" r="0.6"/>
    <circle cx="18" cy="7" r="0.6"/>
    <circle cx="5" cy="11" r="0.6"/>
    <circle cx="19" cy="11" r="0.6"/>
    <circle cx="7" cy="16" r="0.6"/>
    <circle cx="17" cy="16" r="0.6"/>
  </g>

  <!-- Rivet highlights -->
  <g fill="#e6a852" opacity="0.6">
    <circle cx="5.8" cy="6.8" r="0.3"/>
    <circle cx="17.8" cy="6.8" r="0.3"/>
    <circle cx="4.8" cy="10.8" r="0.3"/>
    <circle cx="18.8" cy="10.8" r="0.3"/>
  </g>

  <!-- Bottom shadow for depth -->
  <path d="M6 17c2 2 4 3.5 6 4 2-0.5 4-2 6-4" fill="#6a4010" opacity="0.3"/>
</svg>
