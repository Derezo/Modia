<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="13" cy="21" rx="5" ry="1" fill="#2a2a2a" opacity="0.3"/>

  <!-- Ornate brooch/clasp - jeweled accessory -->
  <!-- Outer frame base (dark gold) -->
  <circle cx="12" cy="11" r="8" fill="#8b6914"/>

  <!-- Outer frame main (gold) -->
  <circle cx="12" cy="11" r="7.3" fill="#daa520"/>

  <!-- Outer frame bright -->
  <circle cx="12" cy="11" r="6.6" fill="#ffd700"/>

  <!-- Inner setting base (dark gold) -->
  <circle cx="12" cy="11" r="5" fill="#8b6914"/>

  <!-- Inner setting main (gold) -->
  <circle cx="12" cy="11" r="4.3" fill="#daa520"/>

  <!-- Top highlight on frame -->
  <ellipse cx="9.5" cy="7" rx="2.5" ry="1.2" fill="#ffe44d" opacity="0.5"/>

  <!-- Gem mount (dark) -->
  <path d="M12 6l4 5-4 5-4-5 4-5z" fill="#1a3a5a"/>

  <!-- Gem main (blue) -->
  <path d="M12 7l3 4-3 4-3-4 3-4z" fill="#2a5a8a"/>

  <!-- Gem bright facet -->
  <path d="M12 7.5l2 2.8-2 2.8-2-2.8 2-2.8z" fill="#4a8aba"/>

  <!-- Gem highlight -->
  <path d="M12 8l1.2 1.7-1.2 1.7-1.2-1.7 1.2-1.7z" fill="#6aacda" opacity="0.7"/>

  <!-- Gem sparkle -->
  <circle cx="10.5" cy="9" r="0.6" fill="#aaddff" opacity="0.8"/>

  <!-- Decorative prongs (gold) -->
  <circle cx="12" cy="4" r="1" fill="#8b6914"/>
  <circle cx="12" cy="4" r="0.7" fill="#daa520"/>
  <circle cx="12" cy="3.8" r="0.35" fill="#ffd700"/>

  <circle cx="12" cy="18" r="1" fill="#8b6914"/>
  <circle cx="12" cy="18" r="0.7" fill="#daa520"/>
  <circle cx="12" cy="17.8" r="0.35" fill="#ffd700"/>

  <circle cx="5" cy="11" r="1" fill="#8b6914"/>
  <circle cx="5" cy="11" r="0.7" fill="#daa520"/>
  <circle cx="5.2" cy="10.8" r="0.35" fill="#ffd700"/>

  <circle cx="19" cy="11" r="1" fill="#8b6914"/>
  <circle cx="19" cy="11" r="0.7" fill="#daa520"/>
  <circle cx="18.8" cy="10.8" r="0.35" fill="#ffd700"/>

  <!-- Filigree accent dots -->
  <circle cx="7" cy="6" r="0.5" fill="#cd9f00"/>
  <circle cx="17" cy="6" r="0.5" fill="#cd9f00"/>
  <circle cx="7" cy="16" r="0.5" fill="#cd9f00"/>
  <circle cx="17" cy="16" r="0.5" fill="#cd9f00"/>
</svg>
