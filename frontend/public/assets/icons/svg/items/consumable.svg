<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="13" cy="22" rx="4.5" ry="1" fill="#2a2a2a" opacity="0.3"/>

  <!-- Flask body base (dark red glass) -->
  <path d="M9 10V6h6v4l3 8c0.5 1.5-0.5 3-2.5 3H8.5c-2 0-3-1.5-2.5-3l3-8z" fill="#662222"/>

  <!-- Flask body main (mid red) -->
  <path d="M9.5 10V6.5h5v3.5l2.7 7.5c0.4 1.2-0.3 2.3-2 2.3H8.8c-1.7 0-2.4-1.1-2-2.3l2.7-7.5z" fill="#884444"/>

  <!-- Flask body bright (light red) -->
  <path d="M10 10V7h4v3l2.3 7c0.3 1-0.2 1.8-1.5 1.8H9.2c-1.3 0-1.8-0.8-1.5-1.8l2.3-7z" fill="#aa5555"/>

  <!-- Glass highlight left -->
  <path d="M10 8v2l-1 4" stroke="#cc7777" stroke-width="0.8" fill="none" stroke-linecap="round"/>

  <!-- Glass reflection -->
  <ellipse cx="9.5" cy="12" rx="0.8" ry="1.5" fill="#cc8888" opacity="0.4"/>

  <!-- Liquid level line -->
  <path d="M8 15c1.5 0.8 6.5 0.8 8 0" stroke="#662222" stroke-width="0.6" fill="none"/>

  <!-- Bubbles -->
  <circle cx="10" cy="17" r="0.8" fill="#aa6666"/>
  <circle cx="10" cy="17" r="0.5" fill="#cc8888"/>
  <circle cx="13" cy="18" r="0.6" fill="#aa6666"/>
  <circle cx="13" cy="18" r="0.35" fill="#cc8888"/>
  <circle cx="11.5" cy="19" r="0.5" fill="#aa6666"/>
  <circle cx="11.5" cy="19" r="0.3" fill="#cc8888"/>

  <!-- Flask neck -->
  <rect x="9.5" y="4" width="5" height="2.5" rx="0.3" fill="#884444"/>
  <rect x="10" y="4.3" width="4" height="2" rx="0.2" fill="#aa5555"/>
  <rect x="10.3" y="4.5" width="1.2" height="1.6" rx="0.1" fill="#cc7777" opacity="0.4"/>

  <!-- Cork base (dark) -->
  <path d="M9 3c0-1 1-2 3-2s3 1 3 2v1.5H9V3z" fill="#5a4030"/>

  <!-- Cork main -->
  <path d="M9.3 3.2c0-0.8 0.9-1.7 2.7-1.7s2.7 0.9 2.7 1.7v1H9.3v-1z" fill="#8b6b50"/>

  <!-- Cork highlight -->
  <path d="M9.8 3c0.2-0.6 0.8-1.2 2.2-1.2s2 0.6 2.2 1.2" stroke="#a08060" stroke-width="0.5" fill="none"/>

  <!-- Cork texture -->
  <path d="M10 3h4" stroke="#5a4030" stroke-width="0.4"/>
  <path d="M10.5 2.5h3" stroke="#5a4030" stroke-width="0.3"/>

  <!-- Label band (parchment color) -->
  <rect x="8" y="11.5" width="8" height="2" rx="0.3" fill="#c4a060" opacity="0.6"/>
  <path d="M8.5 12.5h7" stroke="#8b6030" stroke-width="0.4"/>
</svg>
