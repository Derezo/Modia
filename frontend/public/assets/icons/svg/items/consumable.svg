<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Potion flask - consumable item type -->
  <!-- Flask body -->
  <path class="stroke metallic" d="M9 10V5h6v5l3 8c.5 1.5-.5 3-2 3H8c-1.5 0-2.5-1.5-2-3l3-8z"/>
  <!-- Cork -->
  <path class="stroke metallic" d="M9 5c0-1 1-2 3-2s3 1 3 2"/>
  <!-- Cork texture -->
  <path class="stroke" d="M10 4h4" style="stroke-width: 1;"/>
  <!-- Liquid level -->
  <path class="stroke" d="M7.5 15c1.5 1 7.5 1 9 0"/>
  <!-- Flask label band -->
  <path class="stroke" d="M8 12h8" style="stroke-width: 1;"/>
  <!-- Bubbles -->
  <circle cx="10" cy="17" r="0.75" fill="currentColor"/>
  <circle cx="13" cy="18" r="0.5" fill="currentColor"/>
  <circle cx="11" cy="19" r="0.5" fill="currentColor"/>
</svg>
