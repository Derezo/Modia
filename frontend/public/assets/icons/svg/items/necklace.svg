<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Necklace with pendant - necklace item type -->
  <!-- Chain -->
  <path class="stroke" d="M5 5c0-2 3-3 7-3s7 1 7 3"/>
  <path class="stroke" d="M5 5c0 3 2 7 4 9"/>
  <path class="stroke" d="M19 5c0 3-2 7-4 9"/>
  <!-- Chain links detail -->
  <path class="stroke" d="M6 6c1 2 2 4 2.5 6M18 6c-1 2-2 4-2.5 6" style="stroke-width: 1;"/>
  <!-- Pendant -->
  <path class="stroke metallic" d="M9 14l3 7 3-7-3-2-3 2z"/>
  <!-- Pendant facets -->
  <path class="stroke" d="M12 14v4" style="stroke-width: 1;"/>
  <path class="stroke" d="M10 16h4" style="stroke-width: 1;"/>
  <!-- Clasp dots -->
  <circle cx="5" cy="5" r="0.75" fill="currentColor"/>
  <circle cx="19" cy="5" r="0.75" fill="currentColor"/>
  <!-- Pendant gem -->
  <circle cx="12" cy="16" r="1" fill="currentColor"/>
</svg>
