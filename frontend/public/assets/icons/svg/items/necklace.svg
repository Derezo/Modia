<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="4" ry="0.8" fill="#2a2a2a" opacity="0.3"/>

  <!-- Chain left side (layered for depth) -->
  <path d="M5 4c0-2 3-3 7-3" stroke="#8b6914" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M5 4c0-2 3-3 7-3" stroke="#daa520" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M5.2 3.6c0.3-1.5 2.8-2.4 6.3-2.4" stroke="#ffd700" stroke-width="0.5" fill="none" stroke-linecap="round"/>

  <!-- Chain right side -->
  <path d="M19 4c0-2-3-3-7-3" stroke="#8b6914" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M19 4c0-2-3-3-7-3" stroke="#daa520" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M18.8 3.6c-0.3-1.5-2.8-2.4-6.3-2.4" stroke="#ffd700" stroke-width="0.5" fill="none" stroke-linecap="round"/>

  <!-- Chain draping left -->
  <path d="M5 4c0 4 2 7 4 9" stroke="#8b6914" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M5 4c0 4 2 7 4 9" stroke="#daa520" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M5.4 4.5c0.2 3.5 1.8 6 3.4 8" stroke="#ffd700" stroke-width="0.4" fill="none"/>

  <!-- Chain draping right -->
  <path d="M19 4c0 4-2 7-4 9" stroke="#8b6914" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M19 4c0 4-2 7-4 9" stroke="#daa520" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M18.6 4.5c-0.2 3.5-1.8 6-3.4 8" stroke="#ffd700" stroke-width="0.4" fill="none"/>

  <!-- Chain link details -->
  <circle cx="6" cy="5" r="0.6" fill="#daa520"/>
  <circle cx="7.5" cy="8" r="0.6" fill="#daa520"/>
  <circle cx="18" cy="5" r="0.6" fill="#daa520"/>
  <circle cx="16.5" cy="8" r="0.6" fill="#daa520"/>

  <!-- Pendant mount (gold) -->
  <circle cx="12" cy="12.5" r="1.5" fill="#8b6914"/>
  <circle cx="12" cy="12.5" r="1.1" fill="#daa520"/>
  <circle cx="11.7" cy="12.2" r="0.4" fill="#ffd700"/>

  <!-- Pendant body (gold frame) -->
  <path d="M9 13l3 7 3-7-3-1.5-3 1.5z" fill="#8b6914"/>
  <path d="M9.5 13.3l2.5 6 2.5-6-2.5-1.2-2.5 1.2z" fill="#daa520"/>

  <!-- Gem in pendant -->
  <path d="M10.2 14l1.8 4.5 1.8-4.5-1.8-1-1.8 1z" fill="#1a3a5a"/>
  <path d="M10.8 14.3l1.2 3.5 1.2-3.5-1.2-0.7-1.2 0.7z" fill="#2a5a8a"/>
  <path d="M11.3 14.6l0.7 2.5 0.7-2.5-0.7-0.5-0.7 0.5z" fill="#4a8aba"/>

  <!-- Gem sparkle -->
  <circle cx="11.3" cy="15" r="0.4" fill="#aaddff" opacity="0.8"/>

  <!-- Pendant highlight -->
  <path d="M9.8 13.5l0.5 1" stroke="#ffd700" stroke-width="0.4" stroke-linecap="round"/>

  <!-- Clasp dots -->
  <circle cx="5" cy="4" r="0.8" fill="#8b6914"/>
  <circle cx="5" cy="4" r="0.5" fill="#daa520"/>
  <circle cx="4.85" cy="3.85" r="0.25" fill="#ffd700"/>

  <circle cx="19" cy="4" r="0.8" fill="#8b6914"/>
  <circle cx="19" cy="4" r="0.5" fill="#daa520"/>
  <circle cx="19.15" cy="3.85" r="0.25" fill="#ffd700"/>
</svg>
