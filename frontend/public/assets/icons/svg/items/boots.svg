  <!-- Buckle straps -->
  <rect x="8" y="6.5" width="4" height="1" rx="0.2" fill="#4a3018"/>
  <rect x="8" y="9.5" width="4" height="1" rx="0.2" fill="#4a3018"/>

  <!-- Strap highlights -->
