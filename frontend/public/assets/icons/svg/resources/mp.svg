<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="5" ry="1.5" fill="#0d1d2e" opacity="0.3"/>

  <!-- Outer glow effect -->
  <path d="M12 2L7 10l0 6 5 5 5-5 0-6z" fill="#1a3a5c" transform="translate(0.3, 0.3)" opacity="0.5"/>

  <!-- Base layer (darkest blue) - hexagonal crystal -->
  <path d="M12 2L7 10l0 6 5 5 5-5 0-6z" fill="#1a3a5c"/>

  <!-- Mid layer (medium blue) -->
  <path d="M12 4L8 10.5l0 5 4 4 4-4 0-5z" fill="#3366aa"/>

  <!-- Bright layer (bright blue) - inner crystal -->
  <path d="M12 6L9 11l0 4 3 3 3-3 0-4z" fill="#5599dd"/>

  <!-- Crystal facet highlight (left) -->
  <path d="M12 6L9 11l0 4 3-9z" fill="#88ccff" opacity="0.4"/>

  <!-- Top highlight -->
  <ellipse cx="10" cy="9" rx="1.5" ry="2" fill="#88ccff" opacity="0.5"/>

  <!-- Small sparkle -->
  <circle cx="9" cy="8" r="0.8" fill="#aaddff" opacity="0.6"/>

  <!-- Crystal edge details -->
  <path d="M12 2L7 10l0 6 5 5 5-5 0-6z" fill="none" stroke="#1a3a5c" stroke-width="0.5"/>

  <!-- Inner facet lines -->
  <path d="M12 6L9 11M12 6L15 11" fill="none" stroke="#1a3a5c" stroke-width="0.4" opacity="0.6"/>

  <!-- Mystical sparkles -->
  <circle cx="14" cy="12" r="0.5" fill="#88ccff" opacity="0.7"/>
  <circle cx="10" cy="14" r="0.4" fill="#88ccff" opacity="0.5"/>
  <circle cx="13" cy="16" r="0.3" fill="#aaddff" opacity="0.6"/>
</svg>
