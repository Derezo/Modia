<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Coin shadow -->
  <ellipse cx="13" cy="20" rx="7" ry="2" fill="#3d2a00" opacity="0.3"/>

  <!-- Outer rim (dark gold) -->
  <circle cx="12" cy="12" r="10" fill="#8b6914"/>

  <!-- Main coin face (gold) -->
  <circle cx="12" cy="12" r="9" fill="#daa520"/>

  <!-- Inner bright area (light gold) -->
  <circle cx="11" cy="11" r="7" fill="#ffd700"/>

  <!-- Highlight (very light) -->
  <circle cx="9" cy="9" r="4" fill="#ffe44d" opacity="0.6"/>

  <!-- Top edge highlight -->
  <circle cx="8" cy="7" r="2" fill="#fff4a3" opacity="0.5"/>

  <!-- Inner rim detail -->
  <circle cx="12" cy="12" r="7.5" fill="none" stroke="#b8860b" stroke-width="0.6"/>

  <!-- Crown symbol embossed -->
  <g fill="none" stroke="#8b6914" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crown base -->
    <path d="M7.5 14.5h9"/>
    <!-- Crown points -->
    <path d="M7.5 14.5l1-4 2.5 2 1-2 1 2 2.5-2 1 4"/>
  </g>

  <!-- Bottom shadow for depth -->
  <path d="M5 15 A9 9 0 0 0 19 15" fill="#8b6914" opacity="0.3"/>
</svg>
