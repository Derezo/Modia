<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="13" cy="21" rx="5" ry="1.5" fill="#1a2e0a" opacity="0.3"/>

  <!-- Outer glow effect -->
  <path d="M13 2L4 14h7l-2 8 11-12h-7l2-8z" fill="#2d5016" transform="translate(0.5, 0.5)"/>

  <!-- Base layer (darkest green) -->
  <path d="M13 2L4 14h7l-2 8 11-12h-7l2-8z" fill="#2d5016"/>

  <!-- Mid layer (medium green) - slightly inset -->
  <path d="M12.8 4L5.5 13.5h6l-1.8 6.5 9-10h-6l1.8-6z" fill="#4a8c2a"/>

  <!-- Bright layer (lime green) - inner bolt -->
  <path d="M12.5 6L7 13h5l-1.5 5 7-8h-5l1.5-4z" fill="#7ec850"/>

  <!-- Top highlight -->
  <ellipse cx="10" cy="8" rx="2" ry="1.5" fill="#a8e878" opacity="0.5"/>

  <!-- Secondary highlight on lower section -->
  <ellipse cx="10" cy="16" rx="1.5" ry="1" fill="#a8e878" opacity="0.4"/>

  <!-- Edge detail stroke -->
  <path d="M13 2L4 14h7l-2 8 11-12h-7l2-8z" fill="none" stroke="#2d5016" stroke-width="0.5"/>

  <!-- Energy crackle details -->
  <path d="M17 8l1.5-0.5M18 11l1.5 0M17 14l1.5 0.5" fill="none" stroke="#7ec850" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
</svg>
