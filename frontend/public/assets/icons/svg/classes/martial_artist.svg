<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="22" rx="7" ry="2" fill="#3d2a00" opacity="0.3"/>

  <!-- Impact burst effect -->
  <circle cx="12" cy="12" r="10" fill="#ffd700" opacity="0.1"/>

  <!-- Open hand/palm - outer dark -->
  <path d="M7 9c0-1.2 1.2-2.2 2.8-2.2h4.4c1.6 0 2.8 1 2.8 2.2v9c0 1.5-1.2 2.5-2.8 2.5H9.8c-1.6 0-2.8-1-2.8-2.5V9z" fill="#8b6914"/>
  <!-- Open hand/palm - main -->
  <path d="M7.8 9.3c0-1 1-1.8 2.4-1.8h3.6c1.4 0 2.4.8 2.4 1.8v8.2c0 1.2-1 2-2.4 2H10.2c-1.4 0-2.4-.8-2.4-2V9.3z" fill="#daa520"/>
  <!-- Open hand/palm - bright inner -->
  <path d="M8.5 9.8c0-.7.8-1.3 2-1.3h3c1.2 0 2 .6 2 1.3v7c0 1-.8 1.5-2 1.5h-3c-1.2 0-2-.5-2-1.5v-7z" fill="#ffd700"/>
  <!-- Palm highlight -->
  <path d="M9 10.5c0-.5.6-1 1.5-1h2c.8 0 1.3.4 1.3.8v4c0 .6-.5 1-1.3 1h-2c-.9 0-1.5-.4-1.5-1v-3.8z" fill="#ffe44d" opacity="0.5"/>

  <!-- Fingers spread - outer dark gold -->
  <path d="M8.5 9v-4" fill="none" stroke="#8b6914" stroke-width="2" stroke-linecap="round"/>
  <path d="M10.8 9v-5" fill="none" stroke="#8b6914" stroke-width="2" stroke-linecap="round"/>
  <path d="M13.2 9v-5" fill="none" stroke="#8b6914" stroke-width="2" stroke-linecap="round"/>
  <path d="M15.5 9v-4" fill="none" stroke="#8b6914" stroke-width="2" stroke-linecap="round"/>

  <!-- Fingers spread - main gold -->
  <path d="M8.5 8.8v-3.5" fill="none" stroke="#daa520" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M10.8 8.8v-4.5" fill="none" stroke="#daa520" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M13.2 8.8v-4.5" fill="none" stroke="#daa520" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M15.5 8.8v-3.5" fill="none" stroke="#daa520" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Fingers spread - bright highlight -->
  <path d="M8.3 8.5v-3" fill="none" stroke="#ffd700" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M10.6 8.5v-4" fill="none" stroke="#ffd700" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M13 8.5v-4" fill="none" stroke="#ffd700" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M15.3 8.5v-3" fill="none" stroke="#ffd700" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Palm lines - detail -->
  <path d="M9 12h6" fill="none" stroke="#8b6914" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M9 15c1.5 1.2 4.5 1.2 6 0" fill="none" stroke="#8b6914" stroke-width="0.6" stroke-linecap="round"/>

  <!-- White wrist wrap -->
  <rect x="8" y="18.5" width="8" height="1.8" rx="0.4" fill="#c0c0c0"/>
  <rect x="8.2" y="18.7" width="7.6" height="1.3" rx="0.3" fill="#e0e0e0"/>
  <rect x="8.4" y="18.9" width="3" height="0.8" rx="0.2" fill="#f0f0f0" opacity="0.6"/>

  <!-- Impact burst lines -->
  <g fill="none" stroke="#daa520" stroke-width="0.8" stroke-linecap="round" opacity="0.6">
    <path d="M3 7l2 2"/>
    <path d="M3 13l2-1"/>
    <path d="M21 7l-2 2"/>
    <path d="M21 13l-2-1"/>
  </g>

  <!-- Energy point in palm -->
  <circle cx="12" cy="13" r="1.2" fill="#8b6914"/>
  <circle cx="12" cy="13" r="0.8" fill="#daa520"/>
  <circle cx="12" cy="13" r="0.5" fill="#ffd700"/>
  <circle cx="11.8" cy="12.8" r="0.2" fill="#ffffff" opacity="0.5"/>
</svg>
