<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="9" ry="2" fill="#1a0808" opacity="0.3"/>

  <!-- Impact effect -->
  <circle cx="12" cy="5" r="4" fill="#662222" opacity="0.2"/>

  <!-- Left fist - outer dark brown -->
  <path d="M2 9c0-1.2 1-2.2 2.5-2.2h4c1.5 0 2.5 1 2.5 2.2v6c0 1.5-1 2.5-2.5 2.5h-4C3 17.5 2 16.5 2 15V9z" fill="#4a3018"/>
  <!-- Left fist - main brown -->
  <path d="M2.8 9.3c0-1 .8-1.8 2.2-1.8h3.2c1.4 0 2.2.8 2.2 1.8v5.4c0 1.2-.8 2-2.2 2H5c-1.4 0-2.2-.8-2.2-2V9.3z" fill="#6b4423"/>
  <!-- Left fist - bright -->
  <path d="M3.5 9.8c0-.7.6-1.3 1.8-1.3h2.5c1.2 0 1.8.6 1.8 1.3v4.5c0 1-.6 1.5-1.8 1.5H5.3c-1.2 0-1.8-.5-1.8-1.5V9.8z" fill="#8b5a30"/>
  <!-- Left fist - highlight -->
  <path d="M4 10.5c0-.4.5-.8 1.3-.8h1.8c.7 0 1.1.3 1.1.6v2.5c0 .5-.4.7-1.1.7H5.3c-.8 0-1.3-.3-1.3-.7v-2.3z" fill="#a87040" opacity="0.5"/>

  <!-- Right fist - outer dark brown -->
  <path d="M13 9c0-1.2 1-2.2 2.5-2.2h4c1.5 0 2.5 1 2.5 2.2v6c0 1.5-1 2.5-2.5 2.5h-4c-1.5 0-2.5-1-2.5-2.5V9z" fill="#4a3018"/>
  <!-- Right fist - main brown -->
  <path d="M13.8 9.3c0-1 .8-1.8 2.2-1.8h3.2c1.4 0 2.2.8 2.2 1.8v5.4c0 1.2-.8 2-2.2 2H16c-1.4 0-2.2-.8-2.2-2V9.3z" fill="#6b4423"/>
  <!-- Right fist - bright -->
  <path d="M14.5 9.8c0-.7.6-1.3 1.8-1.3h2.5c1.2 0 1.8.6 1.8 1.3v4.5c0 1-.6 1.5-1.8 1.5h-2.5c-1.2 0-1.8-.5-1.8-1.5V9.8z" fill="#8b5a30"/>
  <!-- Right fist - highlight -->
  <path d="M15 10.5c0-.4.5-.8 1.3-.8h1.8c.7 0 1.1.3 1.1.6v2.5c0 .5-.4.7-1.1.7h-1.8c-.8 0-1.3-.3-1.3-.7v-2.3z" fill="#a87040" opacity="0.5"/>

  <!-- Knuckle lines -->
  <path d="M3.5 11h5" fill="none" stroke="#4a3018" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M14.5 11h5" fill="none" stroke="#4a3018" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Red wrist wraps - left -->
  <rect x="2.5" y="16" width="6" height="2" rx="0.4" fill="#4a1515"/>
  <rect x="2.7" y="16.2" width="5.6" height="1.5" rx="0.3" fill="#662222"/>
  <rect x="2.9" y="16.4" width="2.5" height="1" rx="0.2" fill="#884444" opacity="0.6"/>

  <!-- Red wrist wraps - right -->
  <rect x="13.5" y="16" width="6" height="2" rx="0.4" fill="#4a1515"/>
  <rect x="13.7" y="16.2" width="5.6" height="1.5" rx="0.3" fill="#662222"/>
  <rect x="13.9" y="16.4" width="2.5" height="1" rx="0.2" fill="#884444" opacity="0.6"/>

  <!-- Impact stars -->
  <circle cx="12" cy="5" r="1" fill="#4a3018"/>
  <circle cx="12" cy="5" r="0.7" fill="#6b4423"/>
  <circle cx="11.8" cy="4.8" r="0.3" fill="#8b5a30" opacity="0.7"/>

  <circle cx="9" cy="3" r="0.6" fill="#6b4423"/>
  <circle cx="9" cy="3" r="0.35" fill="#8b5a30"/>

  <circle cx="15" cy="3" r="0.6" fill="#6b4423"/>
  <circle cx="15" cy="3" r="0.35" fill="#8b5a30"/>

  <!-- Motion lines upward -->
  <g fill="none" stroke="#6b4423" stroke-width="0.8" stroke-linecap="round" opacity="0.6">
    <path d="M6 7v-3"/>
    <path d="M18 7v-3"/>
  </g>
  <g fill="none" stroke="#8b5a30" stroke-width="0.5" stroke-linecap="round" opacity="0.5">
    <path d="M5.8 6.5v-2.5"/>
    <path d="M17.8 6.5v-2.5"/>
