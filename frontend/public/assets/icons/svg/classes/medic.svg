  <!-- Red cross - main -->
  <path d="M11 6.5h2v4h4v2h-4v4h-2v-4H7v-2h4v-4z" fill="#662222"/>
  <!-- Red cross - bright -->
  <path d="M11.5 7h1v4h4v1h-4v4h-1v-4h-4v-1h4V7z" fill="#884444"/>
  <!-- Red cross - highlight -->
  <path d="M11.7 7.5h.6v3.5h3.5v.6h-3.5v3.5h-.6v-3.5H8v-.6h3.7V7.5z" fill="#aa6666" opacity="0.5"/>

  <!-- Healing sparkles -->
  <circle cx="5" cy="5" r="1" fill="#c0c0c0"/>
  <circle cx="5" cy="5" r="0.6" fill="#e0e0e0"/>
  <circle cx="4.8" cy="4.8" r="0.25" fill="#ffffff" opacity="0.7"/>

  <circle cx="19" cy="5" r="1" fill="#c0c0c0"/>
  <circle cx="19" cy="5" r="0.6" fill="#e0e0e0"/>
  <circle cx="18.8" cy="4.8" r="0.25" fill="#ffffff" opacity="0.7"/>

  <circle cx="5" cy="17" r="1" fill="#c0c0c0"/>
  <circle cx="5" cy="17" r="0.6" fill="#e0e0e0"/>
  <circle cx="4.8" cy="16.8" r="0.25" fill="#ffffff" opacity="0.7"/>

