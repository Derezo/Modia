  <!-- Cross background - outer dark white -->
  <path d="M8 2h8v6h6v8h-6v6H8v-6H2v-8h6V2z" fill="#c0c0c0"/>
  <!-- Cross background - main white -->
  <path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3z" fill="#e0e0e0"/>
  <!-- Cross background - bright white -->
  <path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6V4z" fill="#f0f0f0"/>
  <!-- Cross highlight -->
  <path d="M10.5 4.5h2v5h5v2h-5v5h-2v-5h-5v-2h5v-5z" fill="#ffffff" opacity="0.5"/>

