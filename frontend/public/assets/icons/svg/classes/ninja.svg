<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Shuriken and kunai - ninja class -->
  <!-- Shuriken (throwing star) -->
  <path class="stroke metallic" d="M12 4l2 4-4 2 2 4-4-2-2 4-2-4-4 2 2-4-4-2 4-2-2-4 4 2z" transform="translate(6,2) scale(0.6)"/>
  <!-- Kunai dagger -->
  <path class="stroke metallic" d="M14 12l6 8"/>
  <path class="stroke" d="M18 16l3-1-1 3"/>
  <!-- Kunai ring -->
  <circle class="stroke" cx="14" cy="12" r="1.5"/>
  <!-- Shuriken center -->
  <circle cx="10" cy="8" r="1" fill="currentColor"/>
  <!-- Throwing motion lines -->
  <path class="stroke" d="M6 5l-2-2M4 8l-2 0" style="stroke-width: 1;"/>
</svg>
