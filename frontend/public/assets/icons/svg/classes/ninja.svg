<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="2" fill="#0a0a0a" opacity="0.3"/>

  <!-- Shuriken (throwing star) -->
  <!-- Outer blade points - dark -->
  <path d="M10 2l2 6-2 2-6-2 2-2 4-4z" fill="#1a1a1a"/>
  <path d="M10 2l6 2-2 2 2 6-2-4-4 4-4-4 4-6z" fill="#1a1a1a"/>
  <!-- Full shuriken shape - main -->
  <path d="M10 3l1.5 5-1.5 1.5-5-1.5 1.5-1.5 3.5-3.5z" fill="#3a3a3a"/>
  <path d="M10 3l5 1.5-1.5 1.5 1.5 5-1.5-3.5-3.5 3.5-3.5-3.5 3.5-5z" fill="#3a3a3a"/>
  <!-- Shuriken highlights -->
  <path d="M10 4l1 4-1 1-4-1 1-1 3-3z" fill="#5a5a5a"/>
  <path d="M8 5l2 2" fill="none" stroke="#7a7a7a" stroke-width="0.5" opacity="0.6"/>
  <path d="M12 7l-2 2" fill="none" stroke="#7a7a7a" stroke-width="0.5" opacity="0.6"/>

  <!-- Shuriken center - dark -->
  <circle cx="10" cy="8" r="1.5" fill="#1a1a1a"/>
  <circle cx="10" cy="8" r="1" fill="#3a3a3a"/>
  <circle cx="10" cy="8" r="0.5" fill="#5a5a5a"/>
  <!-- Red accent in center -->
  <circle cx="10" cy="8" r="0.3" fill="#662222"/>

  <!-- Kunai dagger -->
  <!-- Blade - dark -->
  <path d="M14 11l7 9" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Blade - main -->
  <path d="M14.3 11.3l6.4 8.4" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
  <!-- Blade - highlight -->
  <path d="M14.5 11.5l6 8" fill="none" stroke="#5a5a5a" stroke-width="1" stroke-linecap="round"/>
  <!-- Blade edge shine -->
  <path d="M15 12l5.5 7" fill="none" stroke="#7a7a7a" stroke-width="0.4" opacity="0.6"/>

  <!-- Kunai tip -->
  <path d="M18 16l3-1-1 3z" fill="#1a1a1a"/>
  <path d="M18.3 16.2l2.2-.7-.7 2.2z" fill="#3a3a3a"/>
  <path d="M18.5 16.4l1.5-.5-.5 1.5z" fill="#5a5a5a"/>

  <!-- Kunai ring (finger hole) - dark -->
  <circle cx="14" cy="11" r="2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Kunai ring - main -->
  <circle cx="14" cy="11" r="1.7" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Kunai ring - highlight -->
  <circle cx="14" cy="11" r="1.4" fill="none" stroke="#5a5a5a" stroke-width="0.5"/>
  <!-- Red wrap on ring -->
  <path d="M12.5 10c.5-.8 1.5-1.2 2.5-1" fill="none" stroke="#662222" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Throwing motion lines -->
  <g fill="none" stroke="#3a3a3a" stroke-width="0.6" stroke-linecap="round" opacity="0.5">
    <path d="M5 4l-2-2"/>
    <path d="M3 7l-2 0"/>
    <path d="M4 10l-2 1"/>
  </g>
  <!-- Motion blur dots -->
  <circle cx="3" cy="2" r="0.4" fill="#5a5a5a" opacity="0.4"/>
  <circle cx="1" cy="7" r="0.4" fill="#5a5a5a" opacity="0.4"/>
</svg>
