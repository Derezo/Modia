<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="2" fill="#2a1100" opacity="0.3"/>

  <!-- Fire glow effect -->
  <ellipse cx="12" cy="14" rx="10" ry="6" fill="#ff8800" opacity="0.15"/>

  <!-- Left hand - outer dark -->
  <path d="M3 13c-1.5 3.5 0 6 2.5 8l2.5-3.5c-.5 2.5.5 3.5 1.5 3.5s2-2 2-4.5c0-3.5-2-5.5-4.5-5.5S3 12 3 13z" fill="#8b4400"/>
  <!-- Left hand - main -->
  <path d="M4 13.5c-1 2.5.2 4.5 2 6l2-2.8c-.3 2 .3 2.8 1 2.8s1.5-1.5 1.5-3.5c0-2.8-1.5-4.5-3.5-4.5S4 12.5 4 13.5z" fill="#cc5500"/>
  <!-- Left hand - bright -->
  <path d="M5 14c-.5 1.8.3 3 1.3 4l1.2-1.8c-.2 1.2.2 1.8.6 1.8s1-1 1-2.2c0-1.8-1-3-2.3-3S5 13.2 5 14z" fill="#ff8800"/>
  <!-- Left flame core -->
  <path d="M5.5 15c0 1 .5 2 1 2.5" fill="none" stroke="#ffaa44" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Right hand - outer dark -->
  <path d="M21 13c1.5 3.5 0 6-2.5 8l-2.5-3.5c.5 2.5-.5 3.5-1.5 3.5s-2-2-2-4.5c0-3.5 2-5.5 4.5-5.5S21 12 21 13z" fill="#8b4400"/>
  <!-- Right hand - main -->
  <path d="M20 13.5c1 2.5-.2 4.5-2 6l-2-2.8c.3 2-.3 2.8-1 2.8s-1.5-1.5-1.5-3.5c0-2.8 1.5-4.5 3.5-4.5S20 12.5 20 13.5z" fill="#cc5500"/>
  <!-- Right hand - bright -->
  <path d="M19 14c.5 1.8-.3 3-1.3 4l-1.2-1.8c.2 1.2-.2 1.8-.6 1.8s-1-1-1-2.2c0-1.8 1-3 2.3-3S19 13.2 19 14z" fill="#ff8800"/>
  <!-- Right flame core -->
  <path d="M18.5 15c0 1-.5 2-1 2.5" fill="none" stroke="#ffaa44" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Energy arc between hands -->
  <path d="M7 12c2.5-2.5 7.5-2.5 10 0" fill="none" stroke="#8b4400" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M7.5 11.5c2-2 6-2 9 0" fill="none" stroke="#cc5500" stroke-width="1" stroke-linecap="round"/>
  <path d="M8 11c1.5-1.5 5-1.5 8 0" fill="none" stroke="#ff8800" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Rising embers -->
  <circle cx="5" cy="10" r="0.7" fill="#ff8800"/>
  <circle cx="5" cy="10" r="0.4" fill="#ffaa44"/>

  <circle cx="19" cy="10" r="0.7" fill="#ff8800"/>
  <circle cx="19" cy="10" r="0.4" fill="#ffaa44"/>

  <circle cx="12" cy="8" r="1" fill="#cc5500"/>
  <circle cx="12" cy="8" r="0.6" fill="#ff8800"/>
  <circle cx="11.8" cy="7.8" r="0.3" fill="#ffcc66" opacity="0.7"/>

  <circle cx="8" cy="6" r="0.5" fill="#ff8800"/>
  <circle cx="16" cy="6" r="0.5" fill="#ff8800"/>
  <circle cx="12" cy="4" r="0.6" fill="#ffaa44"/>

  <!-- Flame tips -->
  <g fill="none" stroke="#ffcc66" stroke-width="0.5" stroke-linecap="round" opacity="0.7">
    <path d="M6 11l-1-2"/>
    <path d="M18 11l1-2"/>
    <path d="M12 9v-2"/>
  </g>
</svg>
