<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="22" rx="8" ry="2" fill="#0a1520" opacity="0.3"/>

  <!-- Outer glow -->
  <circle cx="12" cy="12" r="10" fill="#5599dd" opacity="0.1"/>

  <!-- Outer magic circle - dark rim -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="#1a3a5c" stroke-width="2"/>
  <!-- Outer magic circle - main -->
  <circle cx="12" cy="12" r="9.5" fill="none" stroke="#3366aa" stroke-width="1.2"/>
  <!-- Outer magic circle - bright -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="#5599dd" stroke-width="0.6"/>

  <!-- Inner circle -->
  <circle cx="12" cy="12" r="5.5" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="5" fill="none" stroke="#3366aa" stroke-width="1"/>
  <circle cx="12" cy="12" r="4.5" fill="none" stroke="#5599dd" stroke-width="0.5"/>

  <!-- Pentagram - dark -->
  <path d="M12 2.5l3 9.2-7.8-5.7h9.6l-7.8 5.7z" fill="none" stroke="#1a3a5c" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Pentagram - main -->
  <path d="M12 3l2.8 8.6-7.3-5.3h9l-7.3 5.3z" fill="none" stroke="#3366aa" stroke-width="1" stroke-linejoin="round"/>
  <!-- Pentagram - bright glow -->
  <path d="M12 3.5l2.5 7.8-6.6-4.8h8.2l-6.6 4.8z" fill="none" stroke="#5599dd" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- Rune marks at pentagram points -->
  <!-- Top -->
  <circle cx="12" cy="2.5" r="1" fill="#1a3a5c"/>
  <circle cx="12" cy="2.5" r="0.7" fill="#3366aa"/>
  <circle cx="11.8" cy="2.3" r="0.3" fill="#5599dd" opacity="0.7"/>

  <!-- Upper right -->
  <circle cx="19.5" cy="8.5" r="1" fill="#1a3a5c"/>
  <circle cx="19.5" cy="8.5" r="0.7" fill="#3366aa"/>
  <circle cx="19.3" cy="8.3" r="0.3" fill="#5599dd" opacity="0.7"/>

  <!-- Lower right -->
  <circle cx="17" cy="18" r="1" fill="#1a3a5c"/>
  <circle cx="17" cy="18" r="0.7" fill="#3366aa"/>
  <circle cx="16.8" cy="17.8" r="0.3" fill="#5599dd" opacity="0.7"/>

  <!-- Lower left -->
  <circle cx="7" cy="18" r="1" fill="#1a3a5c"/>
  <circle cx="7" cy="18" r="0.7" fill="#3366aa"/>
  <circle cx="6.8" cy="17.8" r="0.3" fill="#5599dd" opacity="0.7"/>

  <!-- Upper left -->
  <circle cx="4.5" cy="8.5" r="1" fill="#1a3a5c"/>
  <circle cx="4.5" cy="8.5" r="0.7" fill="#3366aa"/>
  <circle cx="4.3" cy="8.3" r="0.3" fill="#5599dd" opacity="0.7"/>

  <!-- Center focus - glowing core -->
  <circle cx="12" cy="12" r="2" fill="#1a3a5c"/>
  <circle cx="12" cy="12" r="1.5" fill="#3366aa"/>
  <circle cx="12" cy="12" r="1" fill="#5599dd"/>
  <circle cx="11.5" cy="11.5" r="0.5" fill="#88ccff" opacity="0.7"/>
  <circle cx="11.2" cy="11.2" r="0.25" fill="#ffffff" opacity="0.5"/>

  <!-- Magic energy lines -->
  <g fill="none" stroke="#88ccff" stroke-width="0.4" stroke-linecap="round" opacity="0.5">
    <path d="M12 7v-2"/>
    <path d="M15 10l1.5-1"/>
    <path d="M14 15l1 1.5"/>
    <path d="M10 15l-1 1.5"/>
    <path d="M9 10l-1.5-1"/>
  </g>
</svg>
