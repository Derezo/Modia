<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="22" rx="8" ry="2" fill="#1a1030" opacity="0.3"/>

  <!-- Void glow effect -->
  <circle cx="12" cy="13" r="9" fill="#1a0a20" opacity="0.3"/>

  <!-- Outer summoning circle - dark rim -->
  <circle cx="12" cy="13" r="9" fill="none" stroke="#3d2850" stroke-width="2"/>
  <!-- Outer summoning circle - main -->
  <circle cx="12" cy="13" r="8.5" fill="none" stroke="#6b4488" stroke-width="1.2"/>
  <!-- Outer summoning circle - bright -->
  <circle cx="12" cy="13" r="8" fill="none" stroke="#9966bb" stroke-width="0.6"/>

  <!-- Inner circle - portal void -->
  <circle cx="12" cy="13" r="5.5" fill="#0a0510"/>
  <circle cx="12" cy="13" r="5" fill="#1a0a20"/>
  <circle cx="12" cy="13" r="4.5" fill="none" stroke="#3d2850" stroke-width="1"/>
  <circle cx="12" cy="13" r="4" fill="none" stroke="#6b4488" stroke-width="0.6"/>

  <!-- Runes around outer circle -->
  <g fill="#6b4488">
    <circle cx="12" cy="4" r="0.8"/>
    <circle cx="12" cy="22" r="0.8"/>
    <circle cx="3" cy="13" r="0.8"/>
    <circle cx="21" cy="13" r="0.8"/>
  </g>
  <g fill="#9966bb" opacity="0.6">
    <circle cx="12" cy="4" r="0.4"/>
    <circle cx="12" cy="22" r="0.4"/>
    <circle cx="3" cy="13" r="0.4"/>
    <circle cx="21" cy="13" r="0.4"/>
  </g>

  <!-- Diagonal runes -->
  <g fill="#6b4488">
    <circle cx="6" cy="7" r="0.6"/>
    <circle cx="18" cy="7" r="0.6"/>
    <circle cx="6" cy="19" r="0.6"/>
    <circle cx="18" cy="19" r="0.6"/>
  </g>

  <!-- Creature emerging from portal -->
  <!-- Creature head - dark -->
  <ellipse cx="12" cy="7" r="2.5" ry="2" fill="#3d2850"/>
  <!-- Creature head - main -->
  <ellipse cx="12" cy="7" r="2" ry="1.6" fill="#6b4488"/>
  <!-- Creature head - bright -->
  <ellipse cx="11.5" cy="6.5" r="1.2" ry="1" fill="#9966bb" opacity="0.5"/>

  <!-- Creature horns/ears -->
  <path d="M9.5 5.5l-1-2.5" fill="none" stroke="#3d2850" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M14.5 5.5l1-2.5" fill="none" stroke="#3d2850" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M9.5 5.5l-.8-2" fill="none" stroke="#6b4488" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M14.5 5.5l.8-2" fill="none" stroke="#6b4488" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Creature eyes - glowing -->
  <circle cx="10.5" cy="7" r="0.8" fill="#1a0a20"/>
  <circle cx="10.5" cy="7" r="0.5" fill="#aa66cc"/>
  <circle cx="10.3" cy="6.8" r="0.2" fill="#ddaaff" opacity="0.7"/>

  <circle cx="13.5" cy="7" r="0.8" fill="#1a0a20"/>
  <circle cx="13.5" cy="7" r="0.5" fill="#aa66cc"/>
  <circle cx="13.3" cy="6.8" r="0.2" fill="#ddaaff" opacity="0.7"/>

  <!-- Portal energy wisps -->
  <g fill="none" stroke="#9966bb" stroke-width="0.5" stroke-linecap="round" opacity="0.6">
    <path d="M8 10l-1-1"/>
    <path d="M16 10l1-1"/>
    <path d="M9 16l-1 1"/>
    <path d="M15 16l1 1"/>
  </g>
</svg>
