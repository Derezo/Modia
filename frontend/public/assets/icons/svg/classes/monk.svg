<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="2" fill="#3d2a00" opacity="0.3"/>

  <!-- Fist - dark outer -->
  <path d="M7 7c0-1.5 1.5-2.5 3-2.5h4c1.5 0 3 1 3 2.5v7c0 2.5-2 4.5-5 4.5s-5-2-5-4.5V7z" fill="#8b6914"/>
  <!-- Fist - main -->
  <path d="M8 7.5c0-1 1-2 2.5-2h3c1.5 0 2.5 1 2.5 2v6c0 2-1.5 3.5-4 3.5s-4-1.5-4-3.5v-6z" fill="#daa520"/>
  <!-- Fist - bright inner -->
  <path d="M9 8c0-.8.8-1.5 2-1.5h2c1.2 0 2 .7 2 1.5v5c0 1.5-1 2.5-3 2.5s-3-1-3-2.5V8z" fill="#ffd700"/>
  <!-- Fist - highlight -->
  <path d="M9.5 8.5c0-.5.5-1 1.5-1h1.5c.8 0 1.2.4 1.2.8v3c0 .8-.5 1.2-2 1.2s-2.2-.4-2.2-1v-3z" fill="#ffe44d" opacity="0.5"/>

  <!-- Knuckle lines -->
  <path d="M9 10h6" fill="none" stroke="#8b6914" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M9 12h6" fill="none" stroke="#8b6914" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Wrist wrap - white -->
  <rect x="8" y="5" width="8" height="1.5" rx="0.5" fill="#c0c0c0"/>
  <rect x="8.3" y="5.2" width="7.4" height="1" rx="0.3" fill="#e0e0e0"/>
  <rect x="8.5" y="5.4" width="3" height="0.5" rx="0.2" fill="#f0f0f0" opacity="0.6"/>

  <!-- Prayer beads circle - outer -->
  <circle cx="12" cy="19" r="3" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Individual beads -->
  <circle cx="9" cy="19" r="1" fill="#8b6914"/>
  <circle cx="9" cy="19" r="0.6" fill="#daa520"/>
  <circle cx="9.2" cy="18.8" r="0.25" fill="#ffd700" opacity="0.6"/>

  <circle cx="12" cy="16" r="1" fill="#8b6914"/>
  <circle cx="12" cy="16" r="0.6" fill="#daa520"/>
  <circle cx="12.2" cy="15.8" r="0.25" fill="#ffd700" opacity="0.6"/>

  <circle cx="15" cy="19" r="1" fill="#8b6914"/>
  <circle cx="15" cy="19" r="0.6" fill="#daa520"/>
  <circle cx="15.2" cy="18.8" r="0.25" fill="#ffd700" opacity="0.6"/>

  <circle cx="12" cy="22" r="1" fill="#8b6914"/>
  <circle cx="12" cy="22" r="0.6" fill="#daa520"/>
  <circle cx="12.2" cy="21.8" r="0.25" fill="#ffd700" opacity="0.6"/>
</svg>
