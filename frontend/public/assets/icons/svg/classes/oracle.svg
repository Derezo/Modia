<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="2" fill="#3d2a00" opacity="0.3"/>

  <!-- Celestial glow -->
  <circle cx="12" cy="12" r="11" fill="#ffd700" opacity="0.1"/>
  <circle cx="12" cy="12" r="9" fill="#ffffff" opacity="0.08"/>

  <!-- Eye outline - outer dark -->
  <path d="M1 12c2.5-6 6-9 11-9s8.5 3 11 9c-2.5 6-6 9-11 9s-8.5-3-11-9z" fill="#c0c0c0"/>
  <!-- Eye outline - main -->
  <path d="M2 12c2.3-5.5 5.5-8 10-8s7.7 2.5 10 8c-2.3 5.5-5.5 8-10 8s-7.7-2.5-10-8z" fill="#e0e0e0"/>
  <!-- Eye outline - bright inner -->
  <path d="M3.5 12c2-4.5 5-7 8.5-7s6.5 2.5 8.5 7c-2 4.5-5 7-8.5 7s-6.5-2.5-8.5-7z" fill="#f0f0f0"/>
  <!-- Eye highlight -->
  <path d="M5 11c1.5-3 4-5 6-5s4 1.5 5.5 4" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Iris - outer dark gold -->
  <circle cx="12" cy="12" r="5" fill="#8b6914"/>
  <!-- Iris - main gold -->
  <circle cx="12" cy="12" r="4.3" fill="#daa520"/>
  <!-- Iris - bright gold -->
  <circle cx="12" cy="12" r="3.6" fill="#ffd700"/>
  <!-- Iris - highlight -->
  <circle cx="11" cy="11" r="2" fill="#ffe44d" opacity="0.5"/>

  <!-- Pupil -->
  <circle cx="12" cy="12" r="2.2" fill="#1a1a1a"/>
  <circle cx="12" cy="12" r="1.8" fill="#2a2a2a"/>
  <!-- Pupil depth -->
  <circle cx="12.3" cy="12.3" r="1.2" fill="#1a1a1a" opacity="0.5"/>

  <!-- Light reflection on pupil -->
  <circle cx="10.5" cy="10.5" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="10.2" cy="10.2" r="0.5" fill="#ffffff" opacity="0.6"/>

  <!-- Celestial rays - top -->
  <g fill="none" stroke="#8b6914" stroke-width="1" stroke-linecap="round">
    <path d="M12 1v2"/>
  </g>
  <g fill="none" stroke="#daa520" stroke-width="0.7" stroke-linecap="round">
    <path d="M12 1.2v1.6"/>
  </g>
  <circle cx="12" cy="1" r="0.5" fill="#ffd700"/>

  <!-- Celestial rays - diagonal top -->
  <g fill="none" stroke="#8b6914" stroke-width="0.8" stroke-linecap="round">
    <path d="M4 4l1.5 1.5"/>
    <path d="M20 4l-1.5 1.5"/>
  </g>
  <g fill="none" stroke="#daa520" stroke-width="0.5" stroke-linecap="round">
    <path d="M4.2 4.2l1.3 1.3"/>
    <path d="M19.8 4.2l-1.3 1.3"/>
  </g>
  <circle cx="4" cy="4" r="0.4" fill="#ffd700"/>
  <circle cx="20" cy="4" r="0.4" fill="#ffd700"/>

  <!-- Celestial rays - bottom -->
  <g fill="none" stroke="#8b6914" stroke-width="1" stroke-linecap="round">
    <path d="M12 21v2"/>
  </g>
  <g fill="none" stroke="#daa520" stroke-width="0.7" stroke-linecap="round">
    <path d="M12 21.2v1.6"/>
  </g>
  <circle cx="12" cy="23" r="0.5" fill="#ffd700"/>

  <!-- Celestial rays - diagonal bottom -->
  <g fill="none" stroke="#8b6914" stroke-width="0.8" stroke-linecap="round">
    <path d="M4 20l1.5-1.5"/>
    <path d="M20 20l-1.5-1.5"/>
  </g>
  <g fill="none" stroke="#daa520" stroke-width="0.5" stroke-linecap="round">
    <path d="M4.2 19.8l1.3-1.3"/>
    <path d="M19.8 19.8l-1.3-1.3"/>
  </g>
  <circle cx="4" cy="20" r="0.4" fill="#ffd700"/>
  <circle cx="20" cy="20" r="0.4" fill="#ffd700"/>
</svg>
