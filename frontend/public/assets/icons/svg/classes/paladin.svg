<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="22" rx="7" ry="2" fill="#3d2a00" opacity="0.3"/>

  <!-- Divine glow behind shield -->
  <circle cx="12" cy="11" r="9" fill="#ffd700" opacity="0.15"/>
  <circle cx="12" cy="11" r="7" fill="#ffd700" opacity="0.1"/>

  <!-- Shield - outer dark gold -->
  <path d="M12 2l9 3.5v7.5c0 5.5-4 9-9 11-5-2-9-5.5-9-11V5.5L12 2z" fill="#8b6914"/>
  <!-- Shield - main gold -->
  <path d="M12 3l8 3v7c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3z" fill="#daa520"/>
  <!-- Shield - inner bright -->
  <path d="M12 4.5l6.5 2.5v5.5c0 4-3 6.5-6.5 8-3.5-1.5-6.5-4-6.5-8V7l6.5-2.5z" fill="#ffd700"/>
  <!-- Shield - highlight -->
  <path d="M9 6l-2.5 1v4c0 2.5 1.5 4 4 5V6z" fill="#ffe44d" opacity="0.4"/>
  <!-- Shield - top shine -->
  <path d="M8 5.5l-1.5.5v2c0 1 .5 1.5 1.5 2V5.5z" fill="#fff4a3" opacity="0.3"/>

  <!-- Cross emblem - radiant sword -->
  <rect x="11" y="6" width="2" height="12" rx="0.3" fill="#8b6914"/>
  <rect x="11.2" y="6.2" width="1.6" height="11.6" rx="0.2" fill="#ffffff"/>
  <rect x="11.4" y="6.4" width="1.2" height="11.2" rx="0.1" fill="#fff4a3" opacity="0.6"/>

  <rect x="7" y="10" width="10" height="2" rx="0.3" fill="#8b6914"/>
  <rect x="7.2" y="10.2" width="9.6" height="1.6" rx="0.2" fill="#ffffff"/>
  <rect x="7.4" y="10.4" width="9.2" height="1.2" rx="0.1" fill="#fff4a3" opacity="0.6"/>

  <!-- Light rays from cross -->
  <g fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" opacity="0.5">
    <path d="M12 4.5v-1"/>
    <path d="M5 8l-1-.5"/>
    <path d="M19 8l1-.5"/>
    <path d="M6 15l-1 .5"/>
    <path d="M18 15l1 .5"/>
  </g>

  <!-- Shield rivets - gold -->
  <circle cx="8" cy="7" r="0.8" fill="#8b6914"/>
  <circle cx="8" cy="7" r="0.5" fill="#daa520"/>
  <circle cx="7.8" cy="6.8" r="0.2" fill="#ffd700" opacity="0.6"/>

  <circle cx="16" cy="7" r="0.8" fill="#8b6914"/>
  <circle cx="16" cy="7" r="0.5" fill="#daa520"/>
  <circle cx="15.8" cy="6.8" r="0.2" fill="#ffd700" opacity="0.6"/>

  <circle cx="12" cy="19" r="0.8" fill="#8b6914"/>
  <circle cx="12" cy="19" r="0.5" fill="#daa520"/>
  <circle cx="11.8" cy="18.8" r="0.2" fill="#ffd700" opacity="0.6"/>
</svg>
