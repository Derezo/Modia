<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Dual axes crossed - berserker class -->
  <!-- Left axe head -->
  <path class="stroke metallic" d="M4 4c-1 2-1 4 0 6l5-3-2-5c-2 0-3 1-3 2z"/>
  <!-- Left axe handle -->
  <path class="stroke" d="M9 7l6 6"/>
  <!-- Right axe head -->
  <path class="stroke metallic" d="M20 4c1 2 1 4 0 6l-5-3 2-5c2 0 3 1 3 2z"/>
  <!-- Right axe handle -->
  <path class="stroke" d="M15 7l-6 6"/>
  <!-- Axe blade details -->
  <path class="stroke" d="M5 6l2 1M19 6l-2 1" style="stroke-width: 1;"/>
  <!-- Handle wraps -->
  <path class="stroke" d="M11 11l2 2M13 9l-2 2" style="stroke-width: 1;"/>
  <!-- Pommel accents -->
  <circle cx="15" cy="13" r="0.75" fill="currentColor"/>
  <circle cx="9" cy="13" r="0.75" fill="currentColor"/>
</svg>
