<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="2" fill="#1a0505" opacity="0.3"/>

  <!-- Left axe head - outer dark -->
  <path d="M2 3c-1.5 2.5-1 5 0 7l6-3.5-2.5-5.5c-2 0-3 1-3.5 2z" fill="#4a1515"/>
  <!-- Left axe head - main -->
  <path d="M3 4c-1 2-.8 4 0 5.5l4.5-2.5-2-4.5c-1.5 0-2 .8-2.5 1.5z" fill="#662222"/>
  <!-- Left axe head - bright -->
  <path d="M3.5 5c-.5 1.2-.4 2.5.2 3.5l3-1.7-1.2-3c-.8 0-1.5.5-2 1.2z" fill="#884444"/>
  <!-- Left axe blade edge -->
  <path d="M3 4.5c-.5 1.5-.3 3 .5 4.5" fill="none" stroke="#aa6666" stroke-width="0.5" opacity="0.7"/>

  <!-- Right axe head - outer dark -->
  <path d="M22 3c1.5 2.5 1 5 0 7l-6-3.5 2.5-5.5c2 0 3 1 3.5 2z" fill="#4a1515"/>
  <!-- Right axe head - main -->
  <path d="M21 4c1 2 .8 4 0 5.5l-4.5-2.5 2-4.5c1.5 0 2 .8 2.5 1.5z" fill="#662222"/>
  <!-- Right axe head - bright -->
  <path d="M20.5 5c.5 1.2.4 2.5-.2 3.5l-3-1.7 1.2-3c.8 0 1.5.5 2 1.2z" fill="#884444"/>
  <!-- Right axe blade edge -->
  <path d="M21 4.5c.5 1.5.3 3-.5 4.5" fill="none" stroke="#aa6666" stroke-width="0.5" opacity="0.7"/>

  <!-- Left axe handle - dark -->
  <path d="M8 7l7 7" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left axe handle - main -->
  <path d="M8.2 7.2l6.6 6.6" fill="none" stroke="#3a3a3a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Left axe handle - highlight -->
  <path d="M8.4 7.4l6.2 6.2" fill="none" stroke="#5a5a5a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Right axe handle - dark -->
  <path d="M16 7l-7 7" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right axe handle - main -->
  <path d="M15.8 7.2l-6.6 6.6" fill="none" stroke="#3a3a3a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right axe handle - highlight -->
  <path d="M15.6 7.4l-6.2 6.2" fill="none" stroke="#5a5a5a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Handle wrap details -->
  <path d="M10.5 9.5l1 1" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
  <path d="M12.5 9.5l-1 1" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>

  <!-- Pommels - dark metal -->
  <circle cx="15" cy="14" r="1" fill="#1a1a1a"/>
  <circle cx="15" cy="14" r="0.6" fill="#3a3a3a"/>
  <circle cx="14.8" cy="13.8" r="0.25" fill="#5a5a5a" opacity="0.6"/>

  <circle cx="9" cy="14" r="1" fill="#1a1a1a"/>
  <circle cx="9" cy="14" r="0.6" fill="#3a3a3a"/>
  <circle cx="8.8" cy="13.8" r="0.25" fill="#5a5a5a" opacity="0.6"/>

  <!-- Rage effect - red glow -->
  <circle cx="12" cy="10" r="2" fill="#662222" opacity="0.3"/>
  <circle cx="12" cy="10" r="1" fill="#884444" opacity="0.4"/>
</svg>
