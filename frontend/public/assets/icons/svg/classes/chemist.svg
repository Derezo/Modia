<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="2" fill="#0a2210" opacity="0.3"/>

  <!-- Flask - outer dark -->
  <path d="M8.5 3h7v4l3.5 10.5c.5 2-1.5 4-7 4s-7.5-2-7-4L8.5 7V3z" fill="#2d5530"/>
  <!-- Flask - main -->
  <path d="M9 3.5h6v3.5l3 9.5c.4 1.5-1 3-6 3s-6.4-1.5-6-3l3-9.5V3.5z" fill="#448844"/>
  <!-- Flask - inner bright -->
  <path d="M9.5 4h5v3l2.5 8c.3 1-.5 2-5 2s-5.3-1-5-2l2.5-8V4z" fill="#66aa66"/>
  <!-- Flask - highlight -->
  <path d="M10 4.5h2v2l1.5 5c.2.5-.2 1-2.5 1s-2.7-.5-2.5-1l1.5-5V4.5z" fill="#88cc88" opacity="0.5"/>

  <!-- Flask neck rim -->
  <rect x="8.5" y="3" width="7" height="1" fill="#2d5530"/>
  <rect x="8.8" y="3.2" width="6.4" height="0.6" fill="#448844"/>

  <!-- Cork stopper - copper -->
  <rect x="9.5" y="1" width="5" height="2.5" rx="0.5" fill="#8b4513"/>
  <rect x="9.8" y="1.3" width="4.4" height="1.8" rx="0.3" fill="#b87333"/>
  <rect x="10" y="1.5" width="2" height="1" rx="0.2" fill="#d4956a" opacity="0.5"/>

  <!-- Liquid level -->
  <path d="M6.5 14c1.5 1.5 4 2 5.5 2s4-.5 5.5-2" fill="none" stroke="#2d5530" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Bubbles - bright green -->
  <circle cx="10" cy="16" r="1" fill="#88cc88"/>
  <circle cx="10" cy="16" r="0.6" fill="#aaddaa"/>
  <circle cx="10.2" cy="15.8" r="0.25" fill="#ccffcc" opacity="0.7"/>

  <circle cx="13.5" cy="15" r="0.7" fill="#88cc88"/>
  <circle cx="13.5" cy="15" r="0.4" fill="#aaddaa"/>

  <circle cx="11" cy="18" r="0.8" fill="#88cc88"/>
  <circle cx="11" cy="18" r="0.5" fill="#aaddaa"/>

  <circle cx="14" cy="17.5" r="0.5" fill="#88cc88"/>

  <!-- Steam wisps -->
  <g fill="none" stroke="#88cc88" stroke-width="0.6" stroke-linecap="round" opacity="0.5">
    <path d="M11 1c-.5-1 .5-1.5 0-2"/>
    <path d="M13 1c.5-1 -.5-1.5 0-2"/>
  </g>
</svg>
