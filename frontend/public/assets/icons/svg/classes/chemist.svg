<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Flask and mortar - chemist class -->
  <!-- Main flask -->
  <path class="stroke metallic" d="M9 3h6v4l3 10c0 2-2 4-6 4s-6-2-6-4l3-10V3z"/>
  <!-- Flask neck -->
  <path class="stroke" d="M9 3h6"/>
  <!-- Liquid level -->
  <path class="stroke" d="M7 14c1 1 3 1.5 5 1.5s4-.5 5-1.5" style="stroke-width: 1;"/>
  <!-- Bubbles -->
  <circle cx="10" cy="16" r="0.75" fill="currentColor"/>
  <circle cx="13" cy="15" r="0.5" fill="currentColor"/>
  <circle cx="11" cy="18" r="0.5" fill="currentColor"/>
  <!-- Cork stopper -->
  <path class="stroke" d="M10 2h4v1h-4z"/>
</svg>
