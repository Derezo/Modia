<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="22" rx="6" ry="1.5" fill="#1a1030" opacity="0.3"/>

  <!-- Staff - dark wood -->
  <path d="M7 21l5-17" fill="none" stroke="#3d2850" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Staff - main wood -->
  <path d="M7.3 20.5l4.7-16" fill="none" stroke="#6b4488" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Staff - highlight -->
  <path d="M7.5 20l4.5-15.5" fill="none" stroke="#9966bb" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Staff grip bands -->
  <path d="M8.5 16l.8-.3" fill="none" stroke="#3d2850" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M9 14l.8-.3" fill="none" stroke="#3d2850" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M9.5 12l.8-.3" fill="none" stroke="#3d2850" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Orb holder prongs -->
  <path d="M10 6c1-2 3-2 4 0" fill="none" stroke="#6b4488" stroke-width="1" stroke-linecap="round"/>

  <!-- Crystal orb - outer dark -->
  <circle cx="12" cy="5" r="3.5" fill="#1a3a5c"/>
  <!-- Crystal orb - main -->
  <circle cx="12" cy="5" r="3" fill="#3366aa"/>
  <!-- Crystal orb - inner bright -->
  <circle cx="11.5" cy="4.5" r="2.2" fill="#5599dd"/>
  <!-- Crystal orb - highlight -->
  <circle cx="10.5" cy="3.8" r="1.2" fill="#88ccff" opacity="0.7"/>
  <!-- Crystal orb - top shine -->
  <circle cx="10" cy="3.5" r="0.6" fill="#ffffff" opacity="0.5"/>

  <!-- Inner orb glow -->
  <circle cx="12" cy="5" r="1" fill="#aaddff" opacity="0.4"/>

  <!-- Magic sparkles -->
  <g fill="none" stroke="#88ccff" stroke-width="0.8" stroke-linecap="round">
    <path d="M16 3v-1.5"/>
    <path d="M17.5 4.5l1-1"/>
    <path d="M18 7h1.5"/>
  </g>
  <circle cx="16" cy="2" r="0.5" fill="#aaddff"/>
  <circle cx="18.5" cy="4" r="0.4" fill="#aaddff"/>
  <circle cx="19" cy="7" r="0.5" fill="#aaddff"/>

  <!-- Staff base cap -->
  <circle cx="7" cy="21" r="1" fill="#3d2850"/>
  <circle cx="7" cy="21" r="0.6" fill="#6b4488"/>
</svg>
