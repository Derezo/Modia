<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="22" rx="7" ry="2" fill="#3d2a00" opacity="0.3"/>

  <!-- Outer aura ring -->
  <circle cx="12" cy="12" r="11" fill="none" stroke="#c0c0c0" stroke-width="0.8" opacity="0.3"/>
  <circle cx="12" cy="12" r="10.5" fill="none" stroke="#e0e0e0" stroke-width="0.5" opacity="0.25"/>

  <!-- Inner aura ring -->
  <circle cx="12" cy="12" r="8" fill="none" stroke="#c0c0c0" stroke-width="0.6" opacity="0.35"/>
  <circle cx="12" cy="12" r="7.5" fill="none" stroke="#e0e0e0" stroke-width="0.4" opacity="0.3"/>

  <!-- Gold aura glow -->
  <circle cx="12" cy="12" r="9" fill="#ffd700" opacity="0.08"/>
  <circle cx="12" cy="12" r="6" fill="#ffd700" opacity="0.06"/>

  <!-- Seated figure head - outer dark white -->
  <circle cx="12" cy="5" r="3.2" fill="#c0c0c0"/>
  <!-- Head - main -->
  <circle cx="12" cy="5" r="2.8" fill="#e0e0e0"/>
  <!-- Head - bright -->
  <circle cx="12" cy="5" r="2.3" fill="#f0f0f0"/>
  <!-- Head - highlight -->
  <circle cx="11" cy="4" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- Third eye - gold -->
  <circle cx="12" cy="4" r="1" fill="#8b6914"/>
  <circle cx="12" cy="4" r="0.7" fill="#daa520"/>
  <circle cx="12" cy="4" r="0.4" fill="#ffd700"/>
  <circle cx="11.8" cy="3.8" r="0.15" fill="#ffffff" opacity="0.6"/>

  <!-- Body/robes - seated pose -->
  <!-- Robe outer dark -->
  <path d="M5 20c0-4 2.5-6 7-6s7 2 7 6" fill="#c0c0c0"/>
  <!-- Robe main -->
  <path d="M6 19.5c0-3.5 2.2-5.2 6-5.2s6 1.7 6 5.2" fill="#e0e0e0"/>
  <!-- Robe bright -->
  <path d="M7 19c0-3 2-4.5 5-4.5s5 1.5 5 4.5" fill="#f0f0f0"/>
  <!-- Robe highlight -->
  <path d="M8 18.5c0-2 1.5-3.2 4-3.2s4 1.2 4 3.2" fill="#ffffff" opacity="0.4"/>

  <!-- Crossed legs detail -->
  <path d="M7 18c2.5-1.5 7.5-1.5 10 0" fill="none" stroke="#c0c0c0" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M7.5 17.7c2.2-1.2 6.8-1.2 9 0" fill="none" stroke="#e0e0e0" stroke-width="0.5" stroke-linecap="round"/>

  <!-- Hands in prayer/meditation - gold tinge -->
  <path d="M10 11l2 3.5 2-3.5" fill="none" stroke="#c0c0c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10.2 11.2l1.8 3 1.8-3" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10.4 11.4l1.6 2.5 1.6-2.5" fill="none" stroke="#f0f0f0" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Energy point at heart -->
  <circle cx="12" cy="10" r="0.8" fill="#8b6914"/>
  <circle cx="12" cy="10" r="0.5" fill="#daa520"/>
  <circle cx="12" cy="10" r="0.3" fill="#ffd700"/>

  <!-- Floating energy particles -->
  <g fill="#ffd700" opacity="0.5">
    <circle cx="6" cy="8" r="0.4"/>
    <circle cx="18" cy="8" r="0.4"/>
    <circle cx="4" cy="12" r="0.3"/>
    <circle cx="20" cy="12" r="0.3"/>
    <circle cx="6" cy="16" r="0.35"/>
    <circle cx="18" cy="16" r="0.35"/>
  </g>

  <!-- Light rays from third eye -->
  <g fill="none" stroke="#daa520" stroke-width="0.4" stroke-linecap="round" opacity="0.4">
    <path d="M12 1.5v1"/>
    <path d="M9 2l.5.8"/>
    <path d="M15 2l-.5.8"/>
  </g>
</svg>
