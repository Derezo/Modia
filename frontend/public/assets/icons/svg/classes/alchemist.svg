<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="22" rx="8" ry="2" fill="#3d2a00" opacity="0.3"/>

  <!-- Outer transmutation circle - dark gold rim -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="#8b6914" stroke-width="2"/>
  <!-- Outer circle - main gold -->
  <circle cx="12" cy="12" r="9.5" fill="none" stroke="#daa520" stroke-width="1.2"/>
  <!-- Outer circle - bright gold -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="#ffd700" stroke-width="0.5"/>

  <!-- Inner circle - dark -->
  <circle cx="12" cy="12" r="4.5" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Inner circle - main -->
  <circle cx="12" cy="12" r="4" fill="none" stroke="#daa520" stroke-width="1"/>
  <!-- Inner circle - bright -->
  <circle cx="12" cy="12" r="3.5" fill="none" stroke="#ffd700" stroke-width="0.4"/>

  <!-- Triangle (philosopher's stone symbol) - green runes -->
  <!-- Triangle outer dark -->
  <path d="M12 3l8 14H4z" fill="none" stroke="#2d5530" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Triangle main -->
  <path d="M12 4l7 12H5z" fill="none" stroke="#448844" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Triangle bright -->
  <path d="M12 5l6 10H6z" fill="none" stroke="#66aa66" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Alchemical cross in center - gold -->
  <path d="M12 8v8" fill="none" stroke="#8b6914" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M8 12h8" fill="none" stroke="#8b6914" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M12 8.3v7.4" fill="none" stroke="#daa520" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M8.3 12h7.4" fill="none" stroke="#daa520" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Corner runes at triangle points - gold -->
  <!-- Top -->
  <circle cx="12" cy="3" r="1.2" fill="#8b6914"/>
  <circle cx="12" cy="3" r="0.8" fill="#daa520"/>
  <circle cx="12" cy="3" r="0.5" fill="#ffd700"/>
  <circle cx="11.8" cy="2.8" r="0.2" fill="#ffe44d" opacity="0.6"/>

  <!-- Bottom left -->
  <circle cx="4" cy="17" r="1.2" fill="#8b6914"/>
  <circle cx="4" cy="17" r="0.8" fill="#daa520"/>
  <circle cx="4" cy="17" r="0.5" fill="#ffd700"/>
  <circle cx="3.8" cy="16.8" r="0.2" fill="#ffe44d" opacity="0.6"/>

  <!-- Bottom right -->
  <circle cx="20" cy="17" r="1.2" fill="#8b6914"/>
  <circle cx="20" cy="17" r="0.8" fill="#daa520"/>
  <circle cx="20" cy="17" r="0.5" fill="#ffd700"/>
  <circle cx="19.8" cy="16.8" r="0.2" fill="#ffe44d" opacity="0.6"/>

  <!-- Center philosopher's stone - gold core with green accent -->
  <circle cx="12" cy="12" r="2" fill="#8b6914"/>
  <circle cx="12" cy="12" r="1.5" fill="#daa520"/>
  <circle cx="12" cy="12" r="1" fill="#ffd700"/>
  <!-- Green alchemical glow -->
  <circle cx="12" cy="12" r="0.6" fill="#66aa66"/>
  <circle cx="11.7" cy="11.7" r="0.25" fill="#88cc88" opacity="0.7"/>

  <!-- Green rune glow effects on triangle -->
  <g fill="#66aa66" opacity="0.5">
    <circle cx="8" cy="8" r="0.4"/>
    <circle cx="16" cy="8" r="0.4"/>
    <circle cx="7" cy="14" r="0.4"/>
    <circle cx="17" cy="14" r="0.4"/>
  </g>
</svg>
