<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#3a2010" opacity="0.25"/>

  <!-- Scroll body - dark parchment base -->
  <rect x="6" y="5" width="12" height="14" rx="1" fill="#5a4030"/>

  <!-- Scroll body - mid parchment -->
  <rect x="7" y="5.5" width="10" height="13" rx="0.5" fill="#8b7355"/>

  <!-- Scroll body - light parchment highlight -->
  <rect x="8" y="6" width="6" height="12" fill="#a89070"/>

  <!-- Top roll - dark -->
  <ellipse cx="12" cy="5" rx="6" ry="1.8" fill="#5a4030"/>

  <!-- Top roll - mid -->
  <ellipse cx="12" cy="4.8" rx="5.5" ry="1.5" fill="#8b7355"/>

  <!-- Top roll - light highlight -->
  <ellipse cx="11" cy="4.5" rx="3" ry="0.8" fill="#c9b899"/>

  <!-- Bottom roll - dark -->
  <ellipse cx="12" cy="19" rx="6" ry="1.8" fill="#5a4030"/>

  <!-- Bottom roll - mid -->
  <ellipse cx="12" cy="19.2" rx="5.5" ry="1.5" fill="#8b7355"/>

  <!-- Bottom roll - light highlight -->
  <ellipse cx="11" cy="19.5" rx="3" ry="0.8" fill="#c9b899"/>

  <!-- Text lines (hints) -->
  <line x1="9" y1="8" x2="15" y2="8" stroke="#5a4030" stroke-width="0.5" opacity="0.4"/>
  <line x1="9" y1="10" x2="14" y2="10" stroke="#5a4030" stroke-width="0.5" opacity="0.4"/>
  <line x1="9" y1="12" x2="15" y2="12" stroke="#5a4030" stroke-width="0.5" opacity="0.4"/>
  <line x1="9" y1="14" x2="13" y2="14" stroke="#5a4030" stroke-width="0.5" opacity="0.4"/>
  <line x1="9" y1="16" x2="15" y2="16" stroke="#5a4030" stroke-width="0.5" opacity="0.4"/>

  <!-- Gold wax seal - dark rim -->
  <circle cx="15" cy="15" r="2.5" fill="#8b6914"/>

  <!-- Gold wax seal - mid -->
  <circle cx="15" cy="15" r="2" fill="#daa520"/>

  <!-- Gold wax seal - bright center -->
  <circle cx="14.5" cy="14.5" r="1.2" fill="#ffd700"/>

  <!-- Seal highlight -->
  <circle cx="14" cy="14" r="0.5" fill="#ffe44d" opacity="0.6"/>

  <!-- Seal emblem (simple cross) -->
  <path d="M14 15.5v-1M13.5 15h1" stroke="#8b6914" stroke-width="0.5" stroke-linecap="round"/>
</svg>
