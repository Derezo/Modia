<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#2a2a2a" opacity="0.3"/>

  <!-- Sole base (dark) -->
  <path d="M4 18v2c0 1 0.5 1.5 1.5 1.5h13c1 0 1.5-0.5 1.5-1.5v-1H10c-1.5 0-2.5-0.5-3-1H4z" fill="#2a2a2a"/>

  <!-- Sole main -->
  <path d="M4.5 18.5v1.5c0 0.5 0.3 0.8 1 0.8h12.5c0.7 0 1-0.3 1-0.8v-0.5H10c-1.5 0-2.5-0.5-3-1H4.5z" fill="#3d3d3d"/>

  <!-- Boot body base (dark leather) -->
  <path d="M7 3v12c0 1.5-1.5 2.5-3 3.5v0.5h3c1 0 2-0.5 2.5-1.5l0.5-1V3H7z" fill="#4a3018"/>

  <!-- Boot body main (mid leather) -->
  <path d="M7.5 3.5v11c0 1.5-1.5 2.5-3 3.5h2.5c0.8 0 1.5-0.5 2-1.5l0.5-1V3.5H7.5z" fill="#6b4423"/>

  <!-- Boot body bright (highlight side) -->
