  <!-- Boot toe section (dark) -->
  <path d="M10 15v2c0 1 0.5 1.5 1.5 1.5h7c1 0 1.5-0.5 1.5-1.5v-2H10z" fill="#4a3018"/>

  <!-- Boot toe main -->
  <path d="M10.5 15v1.8c0 0.7 0.4 1 1 1h6.5c0.6 0 1-0.3 1-1V15H10.5z" fill="#6b4423"/>

  <!-- Boot toe highlight -->
  <path d="M11 15v1.5c0 0.5 0.3 0.8 0.8 0.8h2.2v-2.3H11z" fill="#8b5a30"/>

  <!-- Top cuff (dark leather) -->
  <rect x="6" y="3" width="4.5" height="1.5" rx="0.3" fill="#4a3018"/>

  <!-- Top cuff main -->
  <rect x="6.2" y="3.2" width="4.1" height="1" rx="0.2" fill="#6b4423"/>

  <!-- Second cuff line -->
  <rect x="6" y="5" width="4.5" height="0.8" rx="0.2" fill="#4a3018"/>
  <rect x="6.2" y="5.1" width="4.1" height="0.5" rx="0.15" fill="#6b4423"/>

  <!-- Buckle strap -->
  <rect x="6.5" y="8" width="4" height="1.2" rx="0.2" fill="#4a3018"/>
  <rect x="6.7" y="8.2" width="3.6" height="0.8" rx="0.15" fill="#6b4423"/>

  <!-- Bronze buckle frame -->
  <rect x="6.5" y="7.5" width="2.5" height="2.2" rx="0.3" fill="#8b5514"/>
  <rect x="6.8" y="7.8" width="1.9" height="1.6" rx="0.2" fill="#cd7f32"/>

  <!-- Buckle inner (hole) -->
  <rect x="7.2" y="8.2" width="1.1" height="0.8" rx="0.1" fill="#4a3018"/>

  <!-- Buckle prong -->
  <rect x="7.8" y="7.8" width="0.4" height="1.2" rx="0.1" fill="#e6a852"/>

  <!-- Buckle highlight -->
  <rect x="6.9" y="7.9" width="0.4" height="0.4" rx="0.1" fill="#e6a852"/>

  <!-- Stitching details -->
  <path d="M9 11v2" stroke="#4a3018" stroke-width="0.4" stroke-dasharray="0.5,0.5"/>
  <path d="M9 6v1" stroke="#4a3018" stroke-width="0.4" stroke-dasharray="0.5,0.5"/>

  <!-- Boot toe reinforcement line -->
  <path d="M18.5 15.5v2" stroke="#4a3018" stroke-width="0.5"/>

  <!-- Heel detail -->
  <rect x="4" y="19" width="3" height="1.5" rx="0.2" fill="#2a2a2a"/>
  <rect x="4.2" y="19.2" width="2.6" height="1" rx="0.15" fill="#3d3d3d"/>

  <!-- Ankle bronze buckle -->
  <circle cx="7" cy="12" r="0.7" fill="#8b5514"/>
  <circle cx="7" cy="12" r="0.45" fill="#cd7f32"/>
  <circle cx="6.9" cy="11.9" r="0.2" fill="#e6a852"/>
