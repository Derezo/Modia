<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="13" cy="21" rx="6" ry="1.5" fill="#2a2a2a" opacity="0.3"/>

  <!-- Helmet base (dark steel) -->
  <path d="M5 11c0-5 3-8 7-8s7 3 7 8v6c0 1.5-1 2.5-2.5 2.5h-9C6 19.5 5 18.5 5 17v-6z" fill="#5a5a5a"/>

  <!-- Main helmet body (mid steel) -->
  <path d="M6 11c0-4.5 2.5-7 6-7s6 2.5 6 7v5.5c0 1-0.5 1.5-1.5 1.5h-9c-1 0-1.5-0.5-1.5-1.5V11z" fill="#a0a0a0"/>

  <!-- Bright inner area -->
  <path d="M7 10c0-3.5 2-5.5 5-5.5s5 2 5 5.5v4c0 0.5-0.3 1-1 1H8c-0.7 0-1-0.5-1-1v-4z" fill="#d0d0d0"/>

  <!-- Top highlight -->
  <ellipse cx="10" cy="7" rx="3" ry="1.5" fill="#e8e8e8" opacity="0.5"/>

  <!-- Face guard bar (horizontal) -->
  <rect x="7" y="13" width="10" height="1.5" rx="0.3" fill="#5a5a5a"/>

  <!-- Eye slits -->
  <rect x="7.5" y="10" width="3.5" height="1" rx="0.2" fill="#2a2a2a"/>
  <rect x="13" y="10" width="3.5" height="1" rx="0.2" fill="#2a2a2a"/>

  <!-- Breathing holes -->
  <circle cx="9" cy="16" r="0.6" fill="#2a2a2a"/>
  <circle cx="12" cy="16" r="0.6" fill="#2a2a2a"/>
  <circle cx="15" cy="16" r="0.6" fill="#2a2a2a"/>

  <!-- Crown ridge detail -->
  <path d="M8 5.5c2-0.8 6-0.8 8 0" fill="none" stroke="#5a5a5a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Bronze rivets -->
  <circle cx="6.5" cy="11" r="0.9" fill="#8b5514"/>
  <circle cx="6.5" cy="11" r="0.6" fill="#cd7f32"/>
  <circle cx="6.5" cy="10.8" r="0.3" fill="#e6a852"/>

  <circle cx="17.5" cy="11" r="0.9" fill="#8b5514"/>
  <circle cx="17.5" cy="11" r="0.6" fill="#cd7f32"/>
  <circle cx="17.5" cy="10.8" r="0.3" fill="#e6a852"/>

  <!-- Side rivets -->
  <circle cx="6.5" cy="15" r="0.7" fill="#8b5514"/>
  <circle cx="6.5" cy="15" r="0.45" fill="#cd7f32"/>

  <circle cx="17.5" cy="15" r="0.7" fill="#8b5514"/>
  <circle cx="17.5" cy="15" r="0.45" fill="#cd7f32"/>

  <!-- Bottom shadow for depth -->
  <path d="M6 17 Q12 19 18 17" fill="#5a5a5a" opacity="0.4"/>
</svg>
