  <circle cx="8" cy="6" r="0.8" fill="#8b5514"/>
  <circle cx="8" cy="6" r="0.5" fill="#cd7f32"/>
  <circle cx="8" cy="5.8" r="0.25" fill="#e6a852"/>

  <circle cx="16" cy="6" r="0.8" fill="#8b5514"/>
  <circle cx="16" cy="6" r="0.5" fill="#cd7f32"/>
