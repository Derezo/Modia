  <path d="M18 4l3 3v3l-4-2V5z" fill="#5a5a5a"/>

  <!-- Shoulder guards (mid steel) -->
  <path d="M6.5 4.5L4 7v2l3.5-1.5V5z" fill="#a0a0a0"/>
  <path d="M17.5 4.5L20 7v2l-3.5-1.5V5z" fill="#a0a0a0"/>

  <!-- Breastplate base (dark steel) -->
  <path d="M6 4c2-1 8-1 12 0l1 8c0 4-2 8-7 10-5-2-7-6-7-10L6 4z" fill="#5a5a5a"/>

