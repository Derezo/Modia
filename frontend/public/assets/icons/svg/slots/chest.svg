  <path d="M8 13h8" fill="none" stroke="#5a5a5a" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M9 16.5h6" fill="none" stroke="#5a5a5a" stroke-width="0.6" stroke-linecap="round"/>

