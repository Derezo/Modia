<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#1a3355" opacity="0.3"/>

  <!-- Wing boot - dark base -->
  <path d="M6 12c0 4 2 7 6 8 1 0 4-1 5-3 0-1-1-2-2-2l-4-1-2-4c-2-1-3 1-3 2z" fill="#4a6688"/>

  <!-- Wing boot - mid tone -->
  <path d="M7 12.5c0 3 1.5 5.5 5 6.5 1 0 3-.8 4-2.5 0-.8-.8-1.5-1.5-1.5l-3.5-1-2-3.5c-1.5-.8-2 .8-2 2z" fill="#6699cc"/>

  <!-- Wing boot - highlight -->
  <path d="M8 13c0 2.5 1.2 4.5 4 5.5.8 0 2.5-.6 3.2-2 0-.6-.6-1.2-1.2-1.2l-3-.8-1.5-3c-1.2-.6-1.5.6-1.5 1.5z" fill="#88bbee"/>

  <!-- Boot toe -->
  <ellipse cx="17" cy="17.5" rx="2" ry="1.2" fill="#4a6688"/>
  <ellipse cx="17" cy="17.3" rx="1.6" ry="1" fill="#6699cc"/>

  <!-- Wing feathers outer -->
  <path d="M5 8l-2-5" fill="none" stroke="#4a6688" stroke-width="2" stroke-linecap="round"/>
  <path d="M7 7l-1-6" fill="none" stroke="#4a6688" stroke-width="2" stroke-linecap="round"/>
  <path d="M9 7l1-5" fill="none" stroke="#4a6688" stroke-width="2" stroke-linecap="round"/>

  <!-- Wing feathers mid -->
  <path d="M5 8l-1.5-4" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M7 7l-.8-5" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M9 7l.8-4" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wing feathers bright -->
  <path d="M5 8l-1-3" fill="none" stroke="#aaddff" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M7 7l-.5-4" fill="none" stroke="#aaddff" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M9 7l.5-3" fill="none" stroke="#aaddff" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Speed lines -->
  <path d="M20 10l-4 0" fill="none" stroke="#88bbee" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M21 13l-3 0" fill="none" stroke="#88bbee" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M20 16l-4 0" fill="none" stroke="#88bbee" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
</svg>
