<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="5" ry="1.5" fill="#2a1515" opacity="0.3"/>

  <!-- Gauntlet main body outer (dark red-brown) -->
  <path d="M6 7v11c0 2.5 2.5 4 6 4s6-1.5 6-4V7c0-2.5-2.5-4-6-4S6 4.5 6 7z" fill="#5a2d2d"/>

  <!-- Gauntlet main body mid -->
  <path d="M7 7.5v10c0 2 2 3 5 3s5-1 5-3v-10c0-2-2-3-5-3s-5 1-5 3z" fill="#8b4444"/>

  <!-- Gauntlet main body bright -->
  <path d="M8 8v9c0 1.5 1.5 2.5 4 2.5s4-1 4-2.5V8c0-1.5-1.5-2.5-4-2.5S8 6.5 8 8z" fill="#b05555"/>

  <!-- Highlight -->
  <ellipse cx="10" cy="8" rx="2" ry="1.5" fill="#cc7777" opacity="0.5"/>

  <!-- Wrist plate outer -->
  <path d="M6 9h12" fill="none" stroke="#5a2d2d" stroke-width="2"/>

  <!-- Wrist plate mid -->
  <path d="M7 9h10" fill="none" stroke="#8b4444" stroke-width="1.5"/>

  <!-- Wrist plate highlight -->
  <path d="M8 8.5h8" fill="none" stroke="#b05555" stroke-width="0.8"/>

  <!-- Finger plate 1 -->
  <path d="M7.5 12h9" fill="none" stroke="#5a2d2d" stroke-width="1.5"/>
  <path d="M8 12h8" fill="none" stroke="#8b4444" stroke-width="1"/>

  <!-- Finger plate 2 -->
  <path d="M7.5 15h9" fill="none" stroke="#5a2d2d" stroke-width="1.5"/>
  <path d="M8 15h8" fill="none" stroke="#8b4444" stroke-width="1"/>

  <!-- Knuckle segment lines -->
  <g fill="none" stroke="#5a2d2d" stroke-width="0.8">
    <path d="M9 12v3"/>
    <path d="M12 12v3"/>
    <path d="M15 12v3"/>
  </g>

  <!-- Armor rivets -->
  <circle cx="8" cy="7" r="0.9" fill="#5a2d2d"/>
  <circle cx="8" cy="7" r="0.6" fill="#8b4444"/>
  <circle cx="12" cy="6.5" r="0.9" fill="#5a2d2d"/>
  <circle cx="12" cy="6.5" r="0.6" fill="#8b4444"/>
  <circle cx="16" cy="7" r="0.9" fill="#5a2d2d"/>
  <circle cx="16" cy="7" r="0.6" fill="#8b4444"/>

  <!-- Knuckle plate -->
  <path d="M8 18h8" fill="none" stroke="#5a2d2d" stroke-width="1"/>
  <path d="M9 18h6" fill="none" stroke="#8b4444" stroke-width="0.6"/>

  <!-- Clenched fist indicator -->
  <path d="M10 19.5h4" fill="none" stroke="#5a2d2d" stroke-width="0.8"/>

  <!-- Metal sheen highlights -->
  <path d="M9 10v4" fill="none" stroke="#cc7777" stroke-width="0.5" opacity="0.4"/>
  <path d="M15 10v4" fill="none" stroke="#cc7777" stroke-width="0.5" opacity="0.4"/>

  <!-- Bottom shadow -->
  <path d="M8 19 A4 4 0 0 0 16 19" fill="#5a2d2d" opacity="0.3"/>
</svg>
