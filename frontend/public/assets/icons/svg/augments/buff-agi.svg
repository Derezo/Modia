  <!-- Speed lines -->
  <path d="M2 9l3 0" fill="none" stroke="#66aaaa" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M1 12l3 0" fill="none" stroke="#66aaaa" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M2 15l3 0" fill="none" stroke="#66aaaa" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>

  <!-- Sparkle -->
