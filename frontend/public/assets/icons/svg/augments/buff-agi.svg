  <!-- Boot - highlight -->
  <path d="M6 12c0 2 1 3 2.5 4" fill="none" stroke="#66aaaa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Boot toe -->
  <ellipse cx="14" cy="16" rx="2" ry="1.2" fill="#336666"/>
  <ellipse cx="14" cy="15.8" rx="1.6" ry="1" fill="#448888"/>

  <!-- Up arrow - dark green/blue -->
