<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="5" ry="1.2" fill="#112211" opacity="0.3"/>

  <!-- Small leaf/sprout - stem dark -->
