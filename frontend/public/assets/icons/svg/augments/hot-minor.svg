  <!-- Stem mid -->
  <path d="M12 20v-8" fill="none" stroke="#44aa44" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Left leaf - dark -->
  <path d="M12 14c-5-1-6-5-4-8 3 2 5 5 4 8z" fill="#336633"/>

  <!-- Left leaf - mid -->
  <path d="M12 14c-4-.8-5-4-3.5-7 2.5 1.5 4 4 3.5 7z" fill="#44aa44"/>

  <!-- Left leaf - highlight -->
  <path d="M12 14c-3-.5-4-3-3-5.5" fill="none" stroke="#66cc66" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Right leaf - dark -->
  <path d="M12 16c5-1 6-5 4-8-3 2-5 5-4 8z" fill="#336633"/>

  <!-- Right leaf - mid -->
  <path d="M12 16c4-.8 5-4 3.5-7-2.5 1.5-4 4-3.5 7z" fill="#44aa44"/>

  <!-- Right leaf - highlight -->
