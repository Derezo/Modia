  <!-- Leaf vein details -->
  <path d="M10 11c1 1 2 2 2 3" fill="none" stroke="#336633" stroke-width="0.5"/>
  <path d="M14 11c-1 1-2 2-2 5" fill="none" stroke="#336633" stroke-width="0.5"/>

  <!-- Small healing sparkle -->
