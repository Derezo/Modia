<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#222211" opacity="0.3"/>

  <!-- Shield - dark gold base -->
  <path d="M5 4v10c0 4 3 6 7 7 4-1 7-3 7-7V4l-7-2-7 2z" fill="#8b6914"/>

  <!-- Shield - mid gold -->
  <path d="M6 5v9c0 3.5 2.5 5 6 6 3.5-1 6-2.5 6-6V5l-6-1.5-6 1.5z" fill="#daa520"/>

  <!-- Shield - highlight edge -->
  <path d="M7 6v8c0 3 2 4 5 5" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>

  <!-- Phoenix silhouette - dark -->
  <path d="M12 15c-2 0-3-1.2-3-3 0-2.5 2-5 3-6 1 1 3 3.5 3 6 0 1.8-1 3-3 3z" fill="#8b6914"/>

  <!-- Phoenix silhouette - bright -->
  <path d="M12 14c-1.5 0-2.2-1-2.2-2.2 0-2 1.5-4 2.2-5 .7.8 2.2 3 2.2 5 0 1.2-.7 2.2-2.2 2.2z" fill="#cc6600"/>

  <!-- Phoenix highlight -->
