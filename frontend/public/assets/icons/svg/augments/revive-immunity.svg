  <!-- Wings on shield -->
  <path d="M8 10c-1.5 0-2.5.8-2.2 2l2.2-2z" fill="#cc6600"/>
  <path d="M16 10c1.5 0 2.5.8 2.2 2l-2.2-2z" fill="#cc6600"/>

  <!-- Phoenix crest -->
