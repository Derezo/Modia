  <!-- Electric sparks -->
  <circle cx="3" cy="10" r="0.7" fill="#ffff44"/>
  <circle cx="19" cy="13" r="0.6" fill="#cccc00"/>
  <circle cx="5" cy="15" r="0.8" fill="#ffff88"/>
  <circle cx="17" cy="9" r="0.9" fill="#ffff44"/>

