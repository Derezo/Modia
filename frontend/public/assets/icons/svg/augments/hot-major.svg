<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#112211" opacity="0.3"/>

  <!-- Large leaf - stem dark -->
  <path d="M12 20v-6" fill="none" stroke="#336633" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stem mid -->
  <path d="M12 20v-6" fill="none" stroke="#44aa44" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Main leaf - dark -->
  <path d="M12 14c-7-2-8-8-5-12 5 3 7 8 5 12z" fill="#336633"/>

  <!-- Main leaf - mid -->
  <path d="M12 14c-6-1.5-7-7-4.5-10.5 4.5 2.5 6 7 4.5 10.5z" fill="#44aa44"/>

  <!-- Main leaf - highlight -->
  <path d="M12 14c-5-1-6-5.5-4-9" fill="none" stroke="#66cc66" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right secondary leaf - dark -->
  <path d="M12 16c5-1 7-4 5-7-3 1.5-5.5 4-5 7z" fill="#336633"/>

  <!-- Right secondary leaf - mid -->
  <path d="M12 16c4-.8 6-3.5 4.5-6-2.5 1.2-5 3.5-4.5 6z" fill="#44aa44"/>

  <!-- Leaf vein details -->
  <path d="M9 6c1 2 2.5 5 3 8" fill="none" stroke="#336633" stroke-width="0.6"/>
  <path d="M14 11c-1 1.5-2 3.5-2 5" fill="none" stroke="#336633" stroke-width="0.5"/>

  <!-- Gold sparkles -->
  <circle cx="8" cy="4" r="0.8" fill="#ffd700" opacity="0.8"/>
  <circle cx="5" cy="8" r="0.6" fill="#ffd700" opacity="0.6"/>
  <circle cx="16" cy="10" r="0.6" fill="#ffd700" opacity="0.7"/>

  <!-- Healing aura -->
  <circle cx="10" cy="8" r="1" fill="#88ff88" opacity="0.5"/>
  <circle cx="14" cy="12" r="0.8" fill="#88ff88" opacity="0.4"/>
</svg>
