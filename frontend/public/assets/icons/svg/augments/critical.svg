<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Sword piercing target - critical augment (medieval object) -->
  <!-- Target rings -->
  <circle class="stroke metallic" cx="12" cy="14" r="7"/>
  <circle class="stroke" cx="12" cy="14" r="4"/>
  <!-- Sword blade piercing through -->
  <path class="stroke metallic" d="M12 2v10"/>
  <!-- Sword tip -->
  <path class="stroke" d="M10 3l2-1 2 1"/>
  <!-- Cross guard -->
  <path class="stroke" d="M9 10h6"/>
  <path class="stroke" d="M9 9v2M15 9v2" style="stroke-width: 1;"/>
  <!-- Impact marks -->
  <path class="stroke" d="M8 11l-2-1M16 11l2-1" style="stroke-width: 1;"/>
  <!-- Bullseye -->
  <circle cx="12" cy="14" r="1.5" fill="currentColor"/>
  <!-- Target ring detail -->
  <path class="stroke" d="M12 10v1M12 17v1" style="stroke-width: 1;"/>
</svg>
