<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#220033" opacity="0.3"/>

  <!-- Wand - dark base -->
  <path d="M4 20l12-12" fill="none" stroke="#553311" stroke-width="3" stroke-linecap="round"/>

  <!-- Wand - mid tone -->
  <path d="M4 20l12-12" fill="none" stroke="#885533" stroke-width="2" stroke-linecap="round"/>

  <!-- Wand - highlight -->
  <path d="M4.5 19.5l11-11" fill="none" stroke="#aa7755" stroke-width="1" stroke-linecap="round"/>

  <!-- Wand tip glow -->
  <circle cx="16" cy="8" r="3" fill="#6b4488" opacity="0.5"/>
  <circle cx="16" cy="8" r="2" fill="#9966bb"/>
  <circle cx="16" cy="8" r="1" fill="#bb99dd"/>

  <!-- Gold discount symbol (coin with minus) -->
  <circle cx="18" cy="4" r="3.5" fill="#8b6914"/>
  <circle cx="18" cy="4" r="2.8" fill="#daa520"/>
  <circle cx="18" cy="4" r="2" fill="#ffd700"/>

  <!-- Minus sign on coin -->
  <path d="M16 4h4" fill="none" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Magic sparkles -->
  <circle cx="14" cy="6" r="0.6" fill="#ddbbff" opacity="0.8"/>
  <circle cx="18" cy="10" r="0.5" fill="#ddbbff" opacity="0.6"/>
  <circle cx="12" cy="4" r="0.5" fill="#ddbbff" opacity="0.7"/>

  <!-- Wand handle detail -->
  <circle cx="5" cy="19" r="1" fill="#664422"/>
  <circle cx="5" cy="19" r="0.6" fill="#886644"/>
</svg>
