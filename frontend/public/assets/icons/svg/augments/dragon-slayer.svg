<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#331111" opacity="0.3"/>

  <!-- Dragon head outer (dark red) -->
  <path d="M5 10c0-3 1.5-5 4-6l3-1 4 1.5c2.5 1.5 4 3.5 4 6 0 2.5-1.5 4-3 5l-2 1.5-4 1c-3 0-5-1.5-5-4l-1-4z" fill="#662222"/>

  <!-- Dragon head mid -->
  <path d="M6 10c0-2.5 1.2-4 3.2-5l2.8-1 3.5 1.3c2 1.2 3.2 3 3.2 5 0 2-1.2 3.2-2.5 4l-1.7 1.2-3.5 1c-2.5 0-4-1.2-4-3.2l-.8-3.3z" fill="#884444"/>

  <!-- Dragon head bright -->
  <path d="M7 10c0-2 1-3.2 2.5-4l2.5-.8 3 1c1.5 1 2.5 2.5 2.5 4 0 1.5-1 2.5-2 3.2l-1.5 1-3 .8c-2 0-3.2-1-3.2-2.5l-.8-2.7z" fill="#aa5555"/>

  <!-- Dragon snout -->
  <path d="M6 12l3 2 2-.5" fill="none" stroke="#662222" stroke-width="1"/>

  <!-- Dragon eye outer -->
  <circle cx="14" cy="9" r="1.5" fill="#662222"/>

  <!-- Dragon eye inner -->
  <circle cx="14" cy="9" r="1" fill="#ffdd44"/>

  <!-- Dragon pupil -->
  <ellipse cx="14.2" cy="9" rx="0.4" ry="0.8" fill="#331111"/>

  <!-- Dragon horns (dark) -->
  <path d="M8 3l-3-2" fill="none" stroke="#662222" stroke-width="2" stroke-linecap="round"/>
  <path d="M11 3l1.5-2" fill="none" stroke="#662222" stroke-width="2" stroke-linecap="round"/>

  <!-- Dragon horns (mid) -->
  <path d="M8 3l-2.5-1.5" fill="none" stroke="#884444" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M11 3l1.2-1.5" fill="none" stroke="#884444" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dragon scales detail -->
  <g fill="none" stroke="#662222" stroke-width="0.8">
    <path d="M8 8c.8.5 2 .5 2.5 0"/>
    <path d="M10 11c.8.5 2 .5 2.5 0"/>
  </g>

  <!-- Dragon nostril -->
  <circle cx="7" cy="11" r="0.5" fill="#662222"/>

  <!-- Lance outer (gold dark) -->
  <path d="M19 3l-9 10" fill="none" stroke="#8b6914" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lance mid (gold) -->
  <path d="M19 3l-9 10" fill="none" stroke="#daa520" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Lance bright -->
  <path d="M19 3l-8 9" fill="none" stroke="#ffd700" stroke-width="1" stroke-linecap="round"/>

  <!-- Lance head -->
  <path d="M21 1l-2 2 2 1-1 1" fill="#8b6914"/>
  <path d="M20.5 1.5l-1.5 1.5 1.5 .8" fill="#daa520"/>

  <!-- Lance pommel detail -->
  <circle cx="10" cy="13" r="0.8" fill="#8b6914"/>
  <circle cx="10" cy="13" r="0.5" fill="#daa520"/>

  <!-- Blood droplets -->
  <circle cx="11" cy="15" r="0.7" fill="#aa2222"/>
  <circle cx="14" cy="17" r="0.5" fill="#882222"/>
  <circle cx="9" cy="18" r="0.8" fill="#aa2222"/>

  <!-- Dragon head highlight -->
  <path d="M8 7c1-1 2.5-1.5 4-1.5" fill="none" stroke="#cc7777" stroke-width="0.6" opacity="0.5"/>

  <!-- Lance highlight -->
  <path d="M18.5 3.5l-6 6.5" fill="none" stroke="#ffe44d" stroke-width="0.4" opacity="0.6"/>
</svg>
