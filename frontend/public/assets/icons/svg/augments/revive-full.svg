<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#331100" opacity="0.3"/>

  <!-- Phoenix body - dark base -->
  <path d="M12 18c-3 0-5-2-5-5 0-4 3-8 5-10 2 2 5 6 5 10 0 3-2 5-5 5z" fill="#884400"/>

  <!-- Phoenix body - mid orange -->
  <path d="M12 17c-2.5 0-4-1.5-4-4 0-3.5 2.5-7 4-8.5 1.5 1.5 4 5 4 8.5 0 2.5-1.5 4-4 4z" fill="#cc6600"/>

  <!-- Phoenix body - bright -->
  <path d="M12 16c-2 0-3-1.2-3-3 0-3 2-5.5 3-7" fill="none" stroke="#ff8833" stroke-width="2" stroke-linecap="round"/>

  <!-- Wings left - dark -->
  <path d="M7 10c-4 0-6 2-5 5l5-5z" fill="#884400"/>

  <!-- Wings left - mid -->
  <path d="M7 10.5c-3 .2-4.5 1.8-4 4l4-4z" fill="#cc6600"/>

  <!-- Wings right - dark -->
  <path d="M17 10c4 0 6 2 5 5l-5-5z" fill="#884400"/>

  <!-- Wings right - mid -->
  <path d="M17 10.5c3 .2 4.5 1.8 4 4l-4-4z" fill="#cc6600"/>

  <!-- Tail feathers - dark -->
  <path d="M10 18l-3 3" fill="none" stroke="#884400" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M12 18l0 4" fill="none" stroke="#884400" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 18l3 3" fill="none" stroke="#884400" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tail feathers - bright -->
  <path d="M10 18l-2.5 2.5" fill="none" stroke="#ff8833" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M12 18l0 3.5" fill="none" stroke="#ff8833" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M14 18l2.5 2.5" fill="none" stroke="#ff8833" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Head crest -->
  <path d="M12 3l-1 2 1 1 1-1-1-2z" fill="#ffd700"/>

  <!-- Eyes -->
  <circle cx="11" cy="7" r="0.5" fill="#ffd700"/>
  <circle cx="13" cy="7" r="0.5" fill="#ffd700"/>

  <!-- Fire aura -->
  <circle cx="4" cy="12" r="0.6" fill="#ff4400" opacity="0.6"/>
  <circle cx="20" cy="12" r="0.6" fill="#ff4400" opacity="0.6"/>
  <circle cx="12" cy="2" r="0.8" fill="#ffd700" opacity="0.8"/>
</svg>
