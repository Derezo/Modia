<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="13" cy="21" rx="6" ry="1.5" fill="#3d2200" opacity="0.3"/>

  <!-- Brazier bowl (dark outer) -->
  <path d="M5 14c0 3 3 5 7 5s7-2 7-5l-1-3H6l-1 3z" fill="#8b4400"/>

  <!-- Brazier bowl (mid tone) -->
  <path d="M6 13.5c0 2.5 2.5 4 6 4s6-1.5 6-4l-.8-2.5H6.8l-.8 2.5z" fill="#cc5500"/>

  <!-- Brazier bowl highlight -->
  <path d="M7 13c0 2 2 3 5 3s5-1 5-3l-.5-2H7.5l-.5 2z" fill="#dd6620" opacity="0.5"/>

  <!-- Brazier legs -->
  <rect x="7" y="18" width="1.5" height="3" rx="0.3" fill="#8b4400"/>
  <rect x="11.25" y="18" width="1.5" height="3" rx="0.3" fill="#8b4400"/>
  <rect x="15.5" y="18" width="1.5" height="3" rx="0.3" fill="#8b4400"/>

  <!-- Main flame outer (dark orange) -->
  <path d="M12 3c-3 3-5 5-5 8.5 0 2.5 2.5 4 5 4s5-1.5 5-4c0-3.5-2-5.5-5-8.5z" fill="#cc5500"/>

  <!-- Main flame mid -->
  <path d="M12 4.5c-2.5 2.5-4 4.5-4 7 0 2 2 3 4 3s4-1 4-3c0-2.5-1.5-4.5-4-7z" fill="#ff8800"/>

  <!-- Main flame bright inner -->
  <path d="M12 7c-1.5 1.5-2.5 3-2.5 5 0 1.5 1 2 2.5 2s2.5-.5 2.5-2c0-2-1-3.5-2.5-5z" fill="#ffaa33"/>

  <!-- Flame core (yellow) -->
  <path d="M12 9c-1 1-1.5 2-1.5 3.5 0 1 .5 1.5 1.5 1.5s1.5-.5 1.5-1.5c0-1.5-.5-2.5-1.5-3.5z" fill="#ffdd44"/>

  <!-- Flame highlight -->
  <ellipse cx="11" cy="11" rx="1" ry="1.5" fill="#fff4a3" opacity="0.5"/>

  <!-- Flame flicker left -->
  <path d="M8 5l-1.5-2.5" fill="none" stroke="#ff8800" stroke-width="1" stroke-linecap="round"/>
  <path d="M7 4l-1-1.5" fill="none" stroke="#ffaa33" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Flame flicker right -->
  <path d="M16 5l1.5-2.5" fill="none" stroke="#ff8800" stroke-width="1" stroke-linecap="round"/>
  <path d="M17 4l1-1.5" fill="none" stroke="#ffaa33" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Embers -->
  <circle cx="7" cy="4" r="0.8" fill="#ffdd44"/>
  <circle cx="17" cy="3" r="0.6" fill="#ffaa33"/>
  <circle cx="12" cy="1.5" r="0.7" fill="#ff8800"/>

  <!-- Brazier rim detail -->
  <path d="M5.5 11h13" fill="none" stroke="#5a2800" stroke-width="0.5"/>

  <!-- Coal glow inside brazier -->
  <ellipse cx="12" cy="14" rx="4" ry="1" fill="#ff4400" opacity="0.4"/>
</svg>
