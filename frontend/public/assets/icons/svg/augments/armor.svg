<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#222222" opacity="0.3"/>

  <!-- Shield - dark steel base -->
  <path d="M5 4v10c0 4 3 6 7 7 4-1 7-3 7-7V4l-7-2-7 2z" fill="#4a4a4a"/>

  <!-- Shield - mid steel -->
  <path d="M6 5v9c0 3.5 2.5 5 6 6 3.5-1 6-2.5 6-6V5l-6-1.5-6 1.5z" fill="#666666"/>

  <!-- Shield - highlight edge -->
  <path d="M7 6v8c0 3 2 4 5 5" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round"/>

  <!-- Shield center boss - dark -->
  <circle cx="12" cy="10" r="4" fill="#555555"/>

  <!-- Shield center boss - mid -->
  <circle cx="12" cy="10" r="3" fill="#777777"/>

  <!-- Shield center boss - bright -->
  <circle cx="12" cy="10" r="2" fill="#999999"/>

  <!-- Boss highlight -->
  <circle cx="11" cy="9" r="0.8" fill="#bbbbbb" opacity="0.6"/>

  <!-- Rivets -->
  <circle cx="8" cy="6" r="0.8" fill="#888888"/>
  <circle cx="16" cy="6" r="0.8" fill="#888888"/>
  <circle cx="8" cy="14" r="0.8" fill="#888888"/>
  <circle cx="16" cy="14" r="0.8" fill="#888888"/>

  <!-- Rivet highlights -->
  <circle cx="7.8" cy="5.8" r="0.4" fill="#aaaaaa"/>
  <circle cx="15.8" cy="5.8" r="0.4" fill="#aaaaaa"/>

  <!-- Edge detail -->
  <path d="M5 4l7-2 7 2" fill="none" stroke="#777777" stroke-width="0.5"/>
</svg>
