<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#1a1428" opacity="0.3"/>

  <!-- Book cover outer (dark purple) -->
  <path d="M2 4c2.5 0 5 .5 7 2 .8.6 2 1 3 1s2.2-.4 3-1c2-1.5 4.5-2 7-2v14c-2.5 0-5 .5-7 2-.8.6-2 1-3 1s-2.2-.4-3-1c-2-1.5-4.5-2-7-2V4z" fill="#3d2850"/>

  <!-- Book cover mid -->
  <path d="M3 5c2 0 4 .4 6 1.5.8.5 2 1 3 1s2.2-.5 3-1c2-1.1 4-1.5 6-1.5v12c-2 0-4 .4-6 1.5-.8.5-2 1-3 1s-2.2-.5-3-1c-2-1.1-4-1.5-6-1.5V5z" fill="#6b4488"/>

  <!-- Book cover bright inner -->
  <path d="M4 6c1.5 0 3.5.3 5 1.2.7.4 2 .8 3 .8s2.3-.4 3-.8c1.5-.9 3.5-1.2 5-1.2v10c-1.5 0-3.5.3-5 1.2-.7.4-2 .8-3 .8s-2.3-.4-3-.8c-1.5-.9-3.5-1.2-5-1.2V6z" fill="#9966bb"/>

  <!-- Highlight on left page -->
  <path d="M5 7c1 0 2.5.2 4 1" fill="none" stroke="#bb88dd" stroke-width="0.8" opacity="0.5"/>

  <!-- Center spine (dark) -->
  <path d="M12 7v12" fill="none" stroke="#3d2850" stroke-width="1.5"/>

  <!-- Center spine (mid) -->
  <path d="M12 7.5v11" fill="none" stroke="#6b4488" stroke-width="1"/>

  <!-- Page edges left -->
  <path d="M4 6c1.5 0 3 .2 4.5.8" fill="none" stroke="#9966bb" stroke-width="0.5"/>

  <!-- Page edges right -->
  <path d="M20 6c-1.5 0-3 .2-4.5.8" fill="none" stroke="#9966bb" stroke-width="0.5"/>

  <!-- Runic symbols left page -->
  <g fill="none" stroke="#3d2850" stroke-width="1" stroke-linecap="round">
    <path d="M5 9l2 1.5-1 2"/>
    <path d="M6 13.5l1.5-1 1.5 1"/>
  </g>

  <!-- Runic symbols right page -->
  <g fill="none" stroke="#3d2850" stroke-width="1" stroke-linecap="round">
    <path d="M17 9l-2 1.5 1 2"/>
    <path d="M18 13.5l-1.5-1-1.5 1"/>
  </g>

  <!-- Bookmark ribbon -->
  <path d="M12 3v-1" fill="none" stroke="#daa520" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="1.5" r="0.7" fill="#ffd700"/>

  <!-- Wisdom sparkles -->
  <circle cx="8" cy="11" r="0.6" fill="#bb88dd"/>
  <circle cx="16" cy="11" r="0.6" fill="#bb88dd"/>
  <circle cx="6" cy="15" r="0.4" fill="#9966bb"/>
  <circle cx="18" cy="15" r="0.4" fill="#9966bb"/>

  <!-- Magic glow from pages -->
  <ellipse cx="8" cy="10" rx="2" ry="1" fill="#bb88dd" opacity="0.2"/>
  <ellipse cx="16" cy="10" rx="2" ry="1" fill="#bb88dd" opacity="0.2"/>

  <!-- Bottom shadow for depth -->
  <path d="M4 17c3 0 5.5 1 8 2 2.5-1 5-2 8-2" fill="none" stroke="#3d2850" stroke-width="0.5" opacity="0.5"/>
</svg>
