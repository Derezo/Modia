<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Open tome with runes - intelligence augment (medieval object) -->
  <!-- Book covers -->
  <path class="stroke metallic" d="M2 4c2 0 4 .5 5.5 1.5C9 6.5 11 7 12 7s3-.5 4.5-1.5C18 4.5 20 4 22 4v14c-2 0-4 .5-5.5 1.5-1.5 1-3.5 1.5-4.5 1.5s-3-.5-4.5-1.5C6 18.5 4 18 2 18V4z"/>
  <!-- Center spine -->
  <path class="stroke" d="M12 7v14"/>
