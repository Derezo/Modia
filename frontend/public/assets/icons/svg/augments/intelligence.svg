  <path class="stroke" d="M4 6c1 0 2 .25 3 .5M20 6c-1 0-2 .25-3 .5" style="stroke-width: 1;"/>
  <!-- Runic symbols left page -->
  <path class="stroke" d="M5 9l2 1-1 2M6 14l1-1 1 1" style="stroke-width: 1;"/>
  <!-- Runic symbols right page -->
  <path class="stroke" d="M17 9l-2 1 1 2M18 14l-1-1-1 1" style="stroke-width: 1;"/>
  <!-- Bookmark ribbon -->
