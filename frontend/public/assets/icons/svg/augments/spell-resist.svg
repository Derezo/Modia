<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#220033" opacity="0.3"/>

  <!-- Magic circle - breaking apart -->
  <path d="M4 11a8 8 0 0 1 4-7" fill="none" stroke="#6b4488" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1"/>
  <path d="M16 4a8 8 0 0 1 4 7" fill="none" stroke="#6b4488" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1"/>
  <path d="M20 14a8 8 0 0 1-6 5" fill="none" stroke="#6b4488" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1"/>
  <path d="M10 19a8 8 0 0 1-6-5" fill="none" stroke="#6b4488" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1"/>

  <!-- Inner runes dispersing -->
  <circle cx="12" cy="11" r="4" fill="none" stroke="#9966bb" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Center resistance symbol -->
  <circle cx="12" cy="11" r="2.5" fill="#4a3366"/>
  <circle cx="12" cy="11" r="1.8" fill="#6b4488"/>

  <!-- X symbol (resist/block) -->
  <path d="M10 9l4 4M14 9l-4 4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dispersing particles -->
  <circle cx="5" cy="6" r="0.8" fill="#bb99dd" opacity="0.7"/>
  <circle cx="19" cy="6" r="0.6" fill="#bb99dd" opacity="0.6"/>
  <circle cx="3" cy="14" r="0.7" fill="#9966bb" opacity="0.5"/>
  <circle cx="21" cy="14" r="0.5" fill="#9966bb" opacity="0.4"/>
  <circle cx="7" cy="19" r="0.6" fill="#6b4488" opacity="0.5"/>
  <circle cx="17" cy="19" r="0.7" fill="#6b4488" opacity="0.6"/>

  <!-- White sparkle bursts -->
  <circle cx="6" cy="4" r="0.4" fill="#ffffff" opacity="0.8"/>
  <circle cx="18" cy="5" r="0.35" fill="#ffffff" opacity="0.7"/>
  <circle cx="20" cy="16" r="0.4" fill="#ffffff" opacity="0.6"/>
</svg>
