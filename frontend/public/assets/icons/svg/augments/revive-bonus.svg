<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#331100" opacity="0.3"/>

  <!-- Phoenix feather - quill dark -->
  <path d="M8 20l4-16" fill="none" stroke="#884400" stroke-width="2" stroke-linecap="round"/>

  <!-- Quill mid -->
  <path d="M8.3 19.5l3.7-15" fill="none" stroke="#cc6600" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Feather vanes - left dark -->
  <path d="M12 4c-5 2-7 6-6 10l6-10z" fill="#884400"/>

  <!-- Feather vanes - left mid -->
  <path d="M12 5c-4 1.5-5.5 5-5 8.5l5-8.5z" fill="#cc6600"/>

  <!-- Feather vanes - left highlight -->
  <path d="M12 6c-3 1.2-4.5 4-4 7" fill="none" stroke="#ff8833" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Feather vanes - right dark -->
  <path d="M12 4c4 2 6 6 5 10l-5-10z" fill="#884400"/>

  <!-- Feather vanes - right mid -->
  <path d="M12 5c3 1.5 5 5 4 8.5l-4-8.5z" fill="#cc6600"/>

  <!-- Feather vanes - right highlight -->
  <path d="M12 6c2.5 1.2 4 4 3.5 7" fill="none" stroke="#ff8833" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Barb details -->
  <g fill="none" stroke="#ffaa44" stroke-width="0.5" opacity="0.6">
    <path d="M9 8l3-3"/>
    <path d="M8 11l4-5"/>
    <path d="M15 8l-3-3"/>
    <path d="M16 11l-4-5"/>
  </g>

  <!-- Gold tip glow -->
  <circle cx="12" cy="4" r="1.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="12" cy="4" r="0.8" fill="#ffffff" opacity="0.7"/>
</svg>
