<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#0a0a15" opacity="0.4"/>

  <!-- Void background glow -->
  <circle cx="8" cy="12" r="5" fill="#1a1a2a" opacity="0.5"/>

  <!-- Moon crescent outer (dark purple/black) -->
  <path d="M20 12c0 5-4 9-9 9-1.8 0-3.5-.5-5-1.3 2.5-1 4.5-4 4.5-7.7s-2-6.7-4.5-7.7c1.5-.8 3.2-1.3 5-1.3 5 0 9 4 9 9z" fill="#1a1a2a"/>

  <!-- Moon crescent mid -->
  <path d="M19 12c0 4.4-3.5 8-8 8-1.5 0-2.9-.4-4.2-1.1 2.2-.9 4-3.5 4-6.9s-1.8-6-4-6.9c1.3-.7 2.7-1.1 4.2-1.1 4.5 0 8 3.6 8 8z" fill="#3d2850"/>

  <!-- Moon crescent bright -->
  <path d="M18 12c0 3.8-3 7-7 7-1.2 0-2.4-.3-3.4-.9 1.8-.7 3.2-3 3.2-6.1s-1.4-5.4-3.2-6.1c1-.6 2.2-.9 3.4-.9 4 0 7 3.2 7 7z" fill="#6b4488"/>

  <!-- Moon highlight -->
  <path d="M16 9c.8 0 1.5.8 1.5 2" fill="none" stroke="#9966bb" stroke-width="0.8" opacity="0.6"/>

  <!-- Eclipse void center -->
  <circle cx="8" cy="12" r="4" fill="#0a0a15"/>
  <circle cx="8" cy="12" r="3" fill="#1a1a2a"/>
  <circle cx="8" cy="12" r="1.5" fill="#000000"/>

  <!-- Void edge glow -->
  <circle cx="8" cy="12" r="3.5" fill="none" stroke="#3d2850" stroke-width="0.5"/>

  <!-- Stars in darkness -->
  <circle cx="3" cy="6" r="1.2" fill="#9966bb"/>
  <circle cx="5" cy="18" r="0.9" fill="#6b4488"/>
  <circle cx="2" cy="12" r="0.7" fill="#9966bb"/>
  <circle cx="4" cy="9" r="0.5" fill="#bb88dd"/>

  <!-- Star twinkles -->
  <g fill="none" stroke="#bb88dd" stroke-width="0.5">
    <path d="M3 5v2"/>
    <path d="M2 6h2"/>
  </g>
  <g fill="none" stroke="#9966bb" stroke-width="0.4">
    <path d="M5 17v2"/>
    <path d="M4 18h2"/>
  </g>

  <!-- Wisp trails from void -->
  <path d="M6 10c-1-1-2-.5-2.5 0" fill="none" stroke="#3d2850" stroke-width="0.6" opacity="0.7"/>
  <path d="M6 14c-1 1-2 .5-2.5 0" fill="none" stroke="#3d2850" stroke-width="0.6" opacity="0.7"/>

  <!-- Moon surface details -->
  <circle cx="14" cy="10" r="0.8" fill="#3d2850" opacity="0.5"/>
  <circle cx="16" cy="14" r="0.6" fill="#3d2850" opacity="0.4"/>

  <!-- Faint outer glow on moon -->
  <path d="M11 5c3 0 6 2 7 5" fill="none" stroke="#9966bb" stroke-width="0.3" opacity="0.4"/>
</svg>
