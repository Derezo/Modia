<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="5" ry="1.5" fill="#3a2510" opacity="0.3"/>

  <!-- Heart outer (dark orange-brown) -->
  <path d="M12 21c-7-5-9-9-9-12.5 0-3 2.5-5.5 5.5-5.5 2 0 3 .5 3.5 1.5 .5-1 1.5-1.5 3.5-1.5 3 0 5.5 2.5 5.5 5.5 0 3.5-2 7.5-9 12.5z" fill="#775020"/>

  <!-- Heart mid -->
  <path d="M12 19.5c-6-4.5-8-8-8-11 0-2.5 2-4.5 4.5-4.5 1.5 0 2.5.5 3 1.2.3.5.5.8.5.8s.2-.3.5-.8c.5-.7 1.5-1.2 3-1.2 2.5 0 4.5 2 4.5 4.5 0 3-2 6.5-8 11z" fill="#aa7733"/>

  <!-- Heart bright inner -->
  <path d="M12 17.5c-5-4-6.5-6.5-6.5-9 0-2 1.5-3.5 3.5-3.5 1 0 2 .4 2.5 1 .3.4.5.5.5.5s.2-.1.5-.5c.5-.6 1.5-1 2.5-1 2 0 3.5 1.5 3.5 3.5 0 2.5-1.5 5-6.5 9z" fill="#cc9955"/>

  <!-- Heart highlight -->
  <ellipse cx="9" cy="8" rx="2" ry="1.5" fill="#ddbb77" opacity="0.5"/>
  <ellipse cx="8" cy="7" rx="1" ry="0.8" fill="#eedd99" opacity="0.4"/>

  <!-- Center line -->
  <path d="M12 8v8" fill="none" stroke="#775020" stroke-width="1"/>

  <!-- Thorny vine wrapping horizontal -->
  <path d="M7 10c2 0 3.5 2 5 2s3-2 5-2" fill="none" stroke="#2d5530" stroke-width="1" stroke-linecap="round"/>
  <path d="M6.5 14c3 0 4 2 5.5 2s2.5-2 5.5-2" fill="none" stroke="#2d5530" stroke-width="1" stroke-linecap="round"/>

  <!-- Vine texture (darker green) -->
  <path d="M8 10c1.5 0 2.5 1.5 4 1.5s2.5-1.5 4-1.5" fill="none" stroke="#448844" stroke-width="0.6"/>
  <path d="M7.5 14c2 0 3.5 1.5 4.5 1.5s2.5-1.5 4.5-1.5" fill="none" stroke="#448844" stroke-width="0.6"/>

  <!-- Thorns -->
  <g fill="none" stroke="#2d5530" stroke-width="0.8" stroke-linecap="round">
    <path d="M8.5 9l-1-1.5"/>
    <path d="M15.5 9l1-1.5"/>
    <path d="M7 13l-1.5 0"/>
    <path d="M17 13l1.5 0"/>
  </g>

  <!-- Life energy center -->
  <circle cx="12" cy="12" r="1.5" fill="#775020"/>
  <circle cx="12" cy="12" r="1" fill="#aa7733"/>
  <circle cx="12" cy="12" r="0.5" fill="#ffdd88"/>

  <!-- Small leaf details -->
  <ellipse cx="8" cy="6" rx="0.8" ry="0.5" fill="#448844" transform="rotate(-30 8 6)"/>
  <ellipse cx="16" cy="6" rx="0.8" ry="0.5" fill="#448844" transform="rotate(30 16 6)"/>

  <!-- Energy sparkles -->
  <circle cx="7.5" cy="7" r="0.5" fill="#ffdd88" opacity="0.7"/>
  <circle cx="16.5" cy="7" r="0.5" fill="#ffdd88" opacity="0.7"/>

  <!-- Bottom shadow -->
  <path d="M8 18 A5 5 0 0 0 16 18" fill="#775020" opacity="0.3"/>
</svg>
