<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="11" cy="21" rx="6" ry="1.5" fill="#1a1428" opacity="0.3"/>

  <!-- Demon horn outer (dark purple) -->
  <path d="M5 19c0-4 1.5-8 4-12 1.5-2.5 4-5 6-7" fill="none" stroke="#3d2850" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Demon horn mid -->
  <path d="M5.5 18.5c0-3.5 1.3-7 3.5-10.5 1.3-2.2 3.5-4.5 5.5-6.5" fill="none" stroke="#6b4488" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Demon horn bright -->
  <path d="M6 18c0-3 1-6 3-9 1.2-2 3-4 5-6" fill="none" stroke="#9966bb" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Horn ridges -->
  <g fill="none" stroke="#3d2850" stroke-width="0.8">
    <path d="M6 15c1.5-.5 2.5-.5 3.5 0"/>
    <path d="M7 12c1.2-.5 2-.5 3 0"/>
    <path d="M8 9c1-.4 1.5-.4 2.2 0"/>
    <path d="M9.5 6c.5-.2 1-.2 1.5 0"/>
  </g>

  <!-- Second horn segment (broken/severed) -->
  <path d="M9.5 19c0-2.5 .8-5 2-7.5 .8-1.5 2-3.5 3.5-5" fill="none" stroke="#3d2850" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 18.5c0-2 .7-4.5 1.8-6.5 .7-1.3 1.8-3 3-4.5" fill="none" stroke="#6b4488" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Blessed blade outer (gold dark) -->
  <path d="M13 5l8 14" fill="none" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>

  <!-- Blessed blade mid (gold) -->
  <path d="M13.5 5.5l7.5 13" fill="none" stroke="#daa520" stroke-width="2" stroke-linecap="round"/>

  <!-- Blessed blade bright -->
  <path d="M14 6l7 12" fill="none" stroke="#ffd700" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Blade highlight -->
  <path d="M14.5 7l5.5 9.5" fill="none" stroke="#ffe44d" stroke-width="0.5" opacity="0.6"/>

  <!-- Sword hilt -->
  <path d="M12 4l2 1.5" fill="none" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14.5 4.5l-1 2.5" fill="none" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hilt detail (gold) -->
  <path d="M12.5 4.5l1.5 1" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  <path d="M14.2 5l-.8 2" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>

  <!-- Cross guard (holy symbol) -->
  <path d="M15.5 8.5l2.5-1.5" fill="none" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15.5 8.5l-1.5 2.5" fill="none" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cross guard detail -->
  <path d="M16 8.5l2-1.2" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>
  <path d="M16 8.5l-1 2" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round"/>

  <!-- Holy energy at cut point -->
  <circle cx="12" cy="10" r="1.5" fill="#ffe44d" opacity="0.7"/>
  <circle cx="12" cy="10" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- Energy sparkles -->
  <g fill="none" stroke="#ffe44d" stroke-width="0.6">
    <path d="M12 8v-.8"/>
    <path d="M10.5 9.5l-.6-.6"/>
    <path d="M13.5 9.5l.6-.6"/>
  </g>

  <!-- Severed horn piece falling -->
  <path d="M8 16c-.5 1-1 2-1.5 3" fill="none" stroke="#3d2850" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8.3 16.2c-.4.8-.8 1.6-1.2 2.5" fill="none" stroke="#6b4488" stroke-width="1" stroke-linecap="round"/>

  <!-- Demon essence particles -->
  <circle cx="7" cy="20" r="0.8" fill="#6b4488"/>
  <circle cx="18" cy="20" r="0.8" fill="#6b4488"/>
  <circle cx="4" cy="18" r="0.5" fill="#9966bb"/>

  <!-- Horn texture highlight -->
  <path d="M7 14c.5-.2 1-.2 1.5 0" fill="none" stroke="#bb88dd" stroke-width="0.4" opacity="0.5"/>
</svg>
