<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="5" ry="1.5" fill="#2a2010" opacity="0.3"/>

  <!-- Sunburst rays (behind skull) -->
  <g fill="none" stroke="#daa520" stroke-width="1.2" stroke-linecap="round">
    <path d="M12 1v3"/>
    <path d="M12 20v3"/>
    <path d="M3 12h3"/>
    <path d="M18 12h3"/>
  </g>

  <!-- Diagonal rays -->
  <g fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round">
    <path d="M5 5l2.5 2.5"/>
    <path d="M16.5 16.5l2.5 2.5"/>
    <path d="M19 5l-2.5 2.5"/>
    <path d="M7.5 16.5l-2.5 2.5"/>
  </g>

  <!-- Ray tips glow -->
  <circle cx="12" cy="1" r="0.7" fill="#fff4a3"/>
  <circle cx="12" cy="23" r="0.7" fill="#fff4a3"/>
  <circle cx="3" cy="12" r="0.7" fill="#fff4a3"/>
  <circle cx="21" cy="12" r="0.7" fill="#fff4a3"/>

  <!-- Skull outer (dark bone) -->
  <circle cx="12" cy="12" r="6" fill="#8b8070"/>

  <!-- Skull mid (bone) -->
  <circle cx="12" cy="12" r="5.2" fill="#c4b8a8"/>

  <!-- Skull bright (light bone) -->
  <circle cx="12" cy="12" r="4.5" fill="#e8ddd0"/>

  <!-- Skull highlight -->
  <circle cx="10" cy="10" r="2" fill="#f5f0e8" opacity="0.5"/>
  <circle cx="9" cy="9" r="1" fill="#ffffff" opacity="0.4"/>

  <!-- Eye socket left (dark) -->
  <ellipse cx="10" cy="11" rx="1.5" ry="1.8" fill="#2a2520"/>

  <!-- Eye socket right (dark) -->
  <ellipse cx="14" cy="11" rx="1.5" ry="1.8" fill="#2a2520"/>

  <!-- Eye socket glow (holy light in eyes) -->
  <ellipse cx="10" cy="11.2" rx="0.8" ry="1" fill="#daa520" opacity="0.5"/>
  <ellipse cx="14" cy="11.2" rx="0.8" ry="1" fill="#daa520" opacity="0.5"/>

  <!-- Nose cavity -->
  <path d="M12 12.5v2" fill="none" stroke="#5a5040" stroke-width="1"/>
  <path d="M11.5 14l1 .5 1-.5" fill="none" stroke="#5a5040" stroke-width="0.6"/>

  <!-- Jaw line -->
  <path d="M8.5 15.5h7" fill="none" stroke="#8b8070" stroke-width="1.2"/>

  <!-- Teeth -->
  <g fill="none" stroke="#8b8070" stroke-width="0.8">
    <path d="M9.5 15.5v1.2"/>
    <path d="M11 15.5v1.2"/>
    <path d="M12.5 15.5v1.2"/>
    <path d="M14 15.5v1.2"/>
  </g>

  <!-- Skull brow ridge -->
  <path d="M8 9.5c1-.5 2-.8 4-.8s3 .3 4 .8" fill="none" stroke="#c4b8a8" stroke-width="0.6"/>

  <!-- Temple details -->
  <circle cx="7.5" cy="12" r="0.5" fill="#8b8070"/>
  <circle cx="16.5" cy="12" r="0.5" fill="#8b8070"/>

  <!-- Holy light accent sparkles -->
  <circle cx="4" cy="5" r="0.5" fill="#ffe44d"/>
  <circle cx="20" cy="5" r="0.5" fill="#ffe44d"/>
  <circle cx="4" cy="19" r="0.5" fill="#ffe44d"/>
  <circle cx="20" cy="19" r="0.5" fill="#ffe44d"/>

  <!-- Star twinkle at top -->
  <g fill="none" stroke="#ffe44d" stroke-width="0.5">
    <path d="M12 0v1.5"/>
    <path d="M11.5 0.75h1"/>
  </g>

  <!-- Skull cracks (age/decay) -->
  <path d="M9 8l-.5-1" fill="none" stroke="#8b8070" stroke-width="0.4"/>
  <path d="M15 8l.5-1" fill="none" stroke="#8b8070" stroke-width="0.4"/>

  <!-- Bottom shadow -->
  <path d="M8 16 A5 5 0 0 0 16 16" fill="#8b8070" opacity="0.25"/>
</svg>
