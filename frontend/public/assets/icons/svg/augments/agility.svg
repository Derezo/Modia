<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="13" cy="21" rx="6" ry="1.5" fill="#152a15" opacity="0.3"/>

  <!-- Boot body outer (dark green) -->
