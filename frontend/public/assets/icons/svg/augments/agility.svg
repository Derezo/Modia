  <!-- Boot body mid -->
  <path d="M7 7.5v8c0 1 .8 2 2 3l3.5 2h4.5c1 0 2-.8 2-2v-1.5c0-1-.8-2-2-2h-2.5l-2.5-2.5V7.5c0-1-.8-2-2-2h-1c-.8 0-2 .8-2 2z" fill="#448844"/>

  <!-- Boot body bright -->
