  <!-- Boot cuff outer -->
  <path d="M6 9h5" fill="none" stroke="#2d5530" stroke-width="1.5"/>

  <!-- Boot cuff mid -->
  <path d="M7 9h4" fill="none" stroke="#448844" stroke-width="1"/>

  <!-- Wing feather 1 (back, largest) -->
  <path d="M5 5c-2.5-1.5-4-4-3-5 2.5.5 5 3 6 5.5" fill="#2d5530"/>
  <path d="M5 5c-2-1.2-3-3-2.5-4 2 .4 4 2.5 5 4.5" fill="#448844"/>
  <path d="M5 5c-1.5-1-2-2.5-2-3 1.5.3 3 2 4 3.5" fill="#66aa66"/>

  <!-- Wing feather 2 (middle) -->
  <path d="M4 8c-2.5-.5-4-2-3.5-3 2 .5 4 2 5 3.5" fill="#2d5530"/>
  <path d="M4 8c-2-.3-3-1.5-2.5-2.5 1.5.4 3 1.5 4 3" fill="#448844"/>
  <path d="M4 8c-1.5-.2-2-1-2-1.5 1 .3 2.5 1 3 2" fill="#66aa66"/>

  <!-- Wing feather 3 (front, smallest) -->
  <path d="M5 11c-2.5.5-4 0-3.5-1 1.5.2 3 .5 4 1.5" fill="#2d5530"/>
  <path d="M5 11c-2 .3-3 0-2.5-.5 1 .1 2.5.3 3 1" fill="#448844"/>

