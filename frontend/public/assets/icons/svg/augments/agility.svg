  <circle cx="8.5" cy="10" r="0.6" fill="#448844"/>

  <!-- Speed lines -->
  <g fill="none" stroke="#66aa66" stroke-width="0.8" stroke-linecap="round" opacity="0.6">
    <path d="M18 12h3"/>
    <path d="M17 15h4"/>
    <path d="M18 18h3"/>
  </g>

  <!-- Boot sole -->
