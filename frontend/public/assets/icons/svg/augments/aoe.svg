<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#112233" opacity="0.3"/>

  <!-- Outer ring - dark -->
  <circle cx="12" cy="11" r="9" fill="none" stroke="#336644" stroke-width="1.5" opacity="0.5"/>

  <!-- Middle ring - mid -->
  <circle cx="12" cy="11" r="6.5" fill="none" stroke="#44aa66" stroke-width="1.8" opacity="0.7"/>

  <!-- Inner ring - bright -->
  <circle cx="12" cy="11" r="4" fill="none" stroke="#66cc88" stroke-width="2"/>

  <!-- Center filled circle -->
  <circle cx="12" cy="11" r="2" fill="#336644"/>
  <circle cx="12" cy="11" r="1.5" fill="#44aa66"/>
  <circle cx="12" cy="11" r="0.8" fill="#66cc88"/>

  <!-- Radial lines -->
  <g fill="none" stroke="#44aa66" stroke-width="0.8" opacity="0.5">
    <path d="M12 2v5"/>
    <path d="M12 15v5"/>
    <path d="M3 11h5"/>
    <path d="M16 11h5"/>
    <path d="M5.5 5l3.5 3.5"/>
    <path d="M15 14.5l3.5 3.5"/>
    <path d="M5.5 17l3.5-3.5"/>
    <path d="M15 7.5l3.5-3.5"/>
  </g>

  <!-- Pulse effect dots -->
  <circle cx="12" cy="2" r="0.6" fill="#88ffaa" opacity="0.7"/>
  <circle cx="21" cy="11" r="0.6" fill="#88ffaa" opacity="0.6"/>
  <circle cx="12" cy="20" r="0.6" fill="#88ffaa" opacity="0.5"/>
  <circle cx="3" cy="11" r="0.6" fill="#88ffaa" opacity="0.6"/>

  <!-- Center highlight -->
  <circle cx="11.5" cy="10.5" r="0.4" fill="#ffffff" opacity="0.6"/>
</svg>
