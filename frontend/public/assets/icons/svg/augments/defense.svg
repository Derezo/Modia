<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#2a2a2a" opacity="0.3"/>

  <!-- Shield body outer (dark steel) -->
  <path d="M12 2l9 3.5v9c0 5-4 8-9 9-5-1-9-4-9-9v-9L12 2z" fill="#5a5a5a"/>

  <!-- Shield body mid -->
  <path d="M12 3l8 3v8c0 4.5-3.5 7-8 8-4.5-1-8-3.5-8-8V6l8-3z" fill="#a0a0a0"/>

  <!-- Shield body bright -->
  <path d="M12 4l7 2.5v7c0 4-3 6-7 7-4-1-7-3-7-7v-7L12 4z" fill="#d0d0d0"/>

  <!-- Shield highlight -->
  <path d="M7 7l5-2 2 .7v5c0 2-1 3-3 4" fill="#e8e8e8" opacity="0.4"/>

  <!-- Top highlight spot -->
  <ellipse cx="9" cy="7" rx="2" ry="1.2" fill="#ffffff" opacity="0.3"/>

  <!-- Shield border detail -->
  <path d="M12 4.5l6 2.3v6.5c0 3.5-2.5 5.5-6 6.5" fill="none" stroke="#5a5a5a" stroke-width="0.6"/>

  <!-- Chevron band 1 -->
  <path d="M6 8l6 5 6-5" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
  <path d="M6.5 8l5.5 4.5 5.5-4.5" fill="none" stroke="#7a7a7a" stroke-width="1"/>

  <!-- Chevron band 2 -->
  <path d="M6 13l6 5 6-5" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
  <path d="M6.5 13l5.5 4.5 5.5-4.5" fill="none" stroke="#7a7a7a" stroke-width="1"/>

  <!-- Center boss outer -->
  <circle cx="12" cy="11" r="2.5" fill="#5a5a5a"/>

  <!-- Center boss mid -->
  <circle cx="12" cy="11" r="2" fill="#a0a0a0"/>

  <!-- Center boss bright -->
  <circle cx="12" cy="11" r="1.5" fill="#d0d0d0"/>

  <!-- Center boss highlight -->
  <circle cx="11.5" cy="10.5" r="0.7" fill="#ffffff" opacity="0.5"/>

  <!-- Corner rivets -->
  <g>
    <circle cx="8" cy="6" r="1" fill="#5a5a5a"/>
    <circle cx="8" cy="6" r="0.6" fill="#a0a0a0"/>
  </g>
  <g>
    <circle cx="16" cy="6" r="1" fill="#5a5a5a"/>
    <circle cx="16" cy="6" r="0.6" fill="#a0a0a0"/>
  </g>
  <g>
    <circle cx="5.5" cy="10" r="1" fill="#5a5a5a"/>
    <circle cx="5.5" cy="10" r="0.6" fill="#a0a0a0"/>
  </g>
  <g>
    <circle cx="18.5" cy="10" r="1" fill="#5a5a5a"/>
    <circle cx="18.5" cy="10" r="0.6" fill="#a0a0a0"/>
  </g>

  <!-- Inner rim detail -->
  <path d="M12 5l5.5 2v5.5c0 3-2 4.5-5.5 5.5" fill="none" stroke="#7a7a7a" stroke-width="0.4"/>

  <!-- Bottom shadow for depth -->
  <path d="M6 16 A7 7 0 0 0 18 16" fill="#5a5a5a" opacity="0.25"/>
</svg>
