<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#3a2a10" opacity="0.3"/>

  <!-- Decorative circular frame outer (dark gold-green) -->
  <circle cx="12" cy="11" r="9" fill="#775522"/>

  <!-- Frame mid -->
  <circle cx="12" cy="11" r="8" fill="#aa8833"/>

  <!-- Frame bright inner -->
  <circle cx="12" cy="11" r="7" fill="#ccaa55"/>

  <!-- Frame highlight -->
  <circle cx="9" cy="8" r="3" fill="#ddbb66" opacity="0.5"/>
  <circle cx="8" cy="7" r="1.5" fill="#eedd88" opacity="0.4"/>

  <!-- Inner frame ring -->
  <circle cx="12" cy="11" r="5.5" fill="none" stroke="#775522" stroke-width="0.8"/>

  <!-- Clover leaf 1 (left) -->
  <path d="M12 11c-2-2-5-2-5 1s3 3 5 3" fill="#2d5530"/>
  <path d="M12 11c-1.5-1.5-4-1.5-4 .8s2.5 2.5 4 2.5" fill="#448844"/>
  <path d="M12 11c-1-1-3-1-3 .5s2 2 3 2" fill="#66aa66"/>

  <!-- Clover leaf 2 (right) -->
  <path d="M12 11c2-2 5-2 5 1s-3 3-5 3" fill="#2d5530"/>
  <path d="M12 11c1.5-1.5 4-1.5 4 .8s-2.5 2.5-4 2.5" fill="#448844"/>
  <path d="M12 11c1-1 3-1 3 .5s-2 2-3 2" fill="#66aa66"/>

  <!-- Clover leaf 3 (top left) -->
  <path d="M12 11c-2 2-5 2-5-1s3-3 5-3" fill="#2d5530"/>
  <path d="M12 11c-1.5 1.5-4 1.5-4-.8s2.5-2.5 4-2.5" fill="#448844"/>
  <path d="M12 11c-1 1-3 1-3-.5s2-2 3-2" fill="#66aa66"/>

  <!-- Clover leaf 4 (top right) -->
  <path d="M12 11c2 2 5 2 5-1s-3-3-5-3" fill="#2d5530"/>
  <path d="M12 11c1.5 1.5 4 1.5 4-.8s-2.5-2.5-4-2.5" fill="#448844"/>
  <path d="M12 11c1 1 3 1 3-.5s-2-2-3-2" fill="#66aa66"/>

  <!-- Clover center -->
  <circle cx="12" cy="11" r="1" fill="#2d5530"/>
  <circle cx="12" cy="11" r="0.6" fill="#448844"/>

  <!-- Stem -->
  <path d="M12 14.5v5" fill="none" stroke="#2d5530" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M12 15v4.5" fill="none" stroke="#448844" stroke-width="1" stroke-linecap="round"/>

  <!-- Leaf vein details -->
  <g fill="none" stroke="#2d5530" stroke-width="0.5">
    <path d="M10 10l2 1"/>
    <path d="M14 10l-2 1"/>
    <path d="M10 12l2-1"/>
    <path d="M14 12l-2-1"/>
  </g>

  <!-- Frame decoration dots -->
  <circle cx="12" cy="2" r="1" fill="#775522"/>
  <circle cx="12" cy="2" r="0.6" fill="#aa8833"/>
  <circle cx="3" cy="11" r="1" fill="#775522"/>
  <circle cx="3" cy="11" r="0.6" fill="#aa8833"/>
  <circle cx="21" cy="11" r="1" fill="#775522"/>
  <circle cx="21" cy="11" r="0.6" fill="#aa8833"/>

  <!-- Luck sparkles -->
  <circle cx="8" cy="7" r="0.4" fill="#ffdd88"/>
  <circle cx="16" cy="7" r="0.4" fill="#ffdd88"/>
  <circle cx="6" cy="12" r="0.3" fill="#eedd88"/>
  <circle cx="18" cy="12" r="0.3" fill="#eedd88"/>

  <!-- Bottom shadow -->
  <path d="M5 15 A8 8 0 0 0 19 15" fill="#775522" opacity="0.25"/>
</svg>
