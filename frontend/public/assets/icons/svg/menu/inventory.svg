<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="1.5" fill="#3d2a1a" opacity="0.25"/>

  <!-- Chest back (dark bronze) -->
  <path d="M3 9h18v11a1 1 0 01-1 1H4a1 1 0 01-1-1V9z" fill="#8b5514"/>

  <!-- Chest body (mid bronze) -->
  <path d="M4 10h16v9a1 1 0 01-1 1H5a1 1 0 01-1-1V10z" fill="#cd7f32"/>

  <!-- Chest body bright area -->
  <path d="M5 11h14v7H5z" fill="#e6a852"/>

  <!-- Chest lid (open, angled back) -->
  <path d="M2 9l2-5h16l2 5H2z" fill="#8b5514"/>
  <path d="M4 8l1.5-3h13l1.5 3H4z" fill="#cd7f32"/>
  <path d="M5.5 7l1-2h11l1 2H5.5z" fill="#e6a852"/>

  <!-- Lid highlight -->
  <ellipse cx="8" cy="6" rx="2" ry="0.8" fill="#f0c060" opacity="0.5"/>

  <!-- Chest interior shadow -->
  <path d="M5 10h14v2H5z" fill="#5a3a10" opacity="0.3"/>

  <!-- Items inside (gold coins/gems) -->
  <circle cx="8" cy="15" r="1.5" fill="#8b6914"/>
  <circle cx="8" cy="15" r="1.2" fill="#daa520"/>
  <circle cx="8" cy="15" r="0.8" fill="#ffd700"/>

  <circle cx="11" cy="16" r="1.2" fill="#8b6914"/>
  <circle cx="11" cy="16" r="0.9" fill="#daa520"/>
  <circle cx="11" cy="16" r="0.6" fill="#ffd700"/>

  <!-- Gem -->
  <path d="M15 14l1.5 2.5L15 19l-1.5-2.5z" fill="#446688"/>
  <path d="M15 14.5l1 1.8-1 2-1-1.8z" fill="#668aaa"/>

  <!-- Gold clasp/lock -->
  <rect x="10" y="9" width="4" height="2.5" rx="0.5" fill="#8b6914"/>
  <rect x="10.5" y="9.3" width="3" height="1.9" rx="0.3" fill="#daa520"/>
  <circle cx="12" cy="10.2" r="0.5" fill="#ffd700"/>

  <!-- Metal bands -->
  <path d="M3 12h18M3 17h18" fill="none" stroke="#8b5514" stroke-width="0.6"/>

  <!-- Edge detail -->
  <path d="M3 9h18v11a1 1 0 01-1 1H4a1 1 0 01-1-1V9z" fill="none" stroke="#5a3a10" stroke-width="0.4"/>
</svg>
