<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="1.5" fill="#3d2a00" opacity="0.25"/>

  <!-- Second place podium (left) - shorter -->
  <rect x="2" y="14" width="6" height="7" fill="#5a4030"/>
  <rect x="2.5" y="14.5" width="5" height="6" fill="#8b7355"/>
  <rect x="3" y="15" width="4" height="5" fill="#a89070"/>
  <ellipse cx="4.5" cy="15.5" rx="1" ry="0.5" fill="#c9b899" opacity="0.5"/>
  <!-- 2nd place number -->
  <circle cx="5" cy="17.5" r="1.2" fill="#8b6914"/>
  <circle cx="5" cy="17.5" r="0.9" fill="#daa520"/>
  <text x="5" y="18.3" font-size="1.8" fill="#8b6914" text-anchor="middle" font-family="serif" font-weight="bold">2</text>

  <!-- First place podium (center) - tallest -->
  <rect x="9" y="8" width="6" height="13" fill="#5a4030"/>
  <rect x="9.5" y="8.5" width="5" height="12" fill="#8b7355"/>
  <rect x="10" y="9" width="4" height="11" fill="#a89070"/>
  <ellipse cx="11.5" cy="9.5" rx="1" ry="0.5" fill="#c9b899" opacity="0.5"/>
  <!-- 1st place number -->
  <circle cx="12" cy="14" r="1.5" fill="#8b6914"/>
  <circle cx="12" cy="14" r="1.1" fill="#daa520"/>
  <circle cx="12" cy="14" r="0.7" fill="#ffd700"/>
  <text x="12" y="14.8" font-size="2" fill="#8b6914" text-anchor="middle" font-family="serif" font-weight="bold">1</text>

  <!-- Third place podium (right) - shortest -->
  <rect x="16" y="16" width="6" height="5" fill="#5a4030"/>
  <rect x="16.5" y="16.5" width="5" height="4" fill="#8b7355"/>
  <rect x="17" y="17" width="4" height="3" fill="#a89070"/>
  <ellipse cx="18.5" cy="17.5" rx="1" ry="0.5" fill="#c9b899" opacity="0.5"/>
  <!-- 3rd place number -->
  <circle cx="19" cy="18.5" r="1" fill="#8b6914"/>
  <circle cx="19" cy="18.5" r="0.7" fill="#daa520"/>
  <text x="19" y="19.2" font-size="1.6" fill="#8b6914" text-anchor="middle" font-family="serif" font-weight="bold">3</text>

  <!-- Crown on first place (gold primary) -->
  <path d="M8 7h8l-1 -4.5 -1.5 2 -1.5 -3 -1.5 3 -1.5 -2z" fill="#8b6914"/>
  <path d="M8.5 6.5h7l-0.8 -3.8 -1.4 1.8 -1.3 -2.5 -1.3 2.5 -1.4 -1.8z" fill="#daa520"/>
  <path d="M9 6h6l-0.6 -3 -1.2 1.5 -1.2 -2 -1.2 2 -1.2 -1.5z" fill="#ffd700"/>

  <!-- Crown jewels -->
  <circle cx="12" cy="4.5" r="0.6" fill="#884444"/>
  <circle cx="12" cy="4.5" r="0.4" fill="#aa5555"/>
  <circle cx="10" cy="5.5" r="0.4" fill="#446688"/>
  <circle cx="14" cy="5.5" r="0.4" fill="#446688"/>

  <!-- Crown highlight -->
  <ellipse cx="10" cy="3" rx="0.8" ry="0.4" fill="#ffe44d" opacity="0.6"/>

  <!-- Red ribbon/banner beneath crown -->
  <path d="M8 7h8v1H8z" fill="#662222"/>
  <path d="M8.3 7.2h7.4v0.6H8.3z" fill="#884444"/>

  <!-- Edge details -->
  <rect x="2" y="14" width="6" height="7" fill="none" stroke="#5a4030" stroke-width="0.3"/>
  <rect x="9" y="8" width="6" height="13" fill="none" stroke="#5a4030" stroke-width="0.3"/>
  <rect x="16" y="16" width="6" height="5" fill="none" stroke="#5a4030" stroke-width="0.3"/>
</svg>
