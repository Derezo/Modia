<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#3d2a1a" opacity="0.25"/>

  <!-- Bell body (dark bronze) -->
  <path d="M12 2c-4 0-7 3-7 7v6c0 1-1 2-2 2h18c-1 0-2-1-2-2V9c0-4-3-7-7-7z" fill="#8b5514"/>

  <!-- Bell body (mid bronze) -->
  <path d="M12 3c-3.5 0-6 2.5-6 6v5.5c0 0.8-0.5 1.5-1 2h14c-0.5-0.5-1-1.2-1-2V9c0-3.5-2.5-6-6-6z" fill="#cd7f32"/>

  <!-- Bell body (bright) -->
  <path d="M12 4c-3 0-5 2-5 5v5c0 0.5-0.3 1-0.5 1.5h11c-0.2-0.5-0.5-1-0.5-1.5V9c0-3-2-5-5-5z" fill="#e6a852"/>

  <!-- Bell highlight -->
  <ellipse cx="9" cy="7" rx="2" ry="1.5" fill="#f0c060" opacity="0.5"/>
  <circle cx="8" cy="6" r="1" fill="#f0c060" opacity="0.4"/>

  <!-- Bell crown/top -->
  <rect x="10" y="1" width="4" height="2" rx="0.5" fill="#8b5514"/>
  <rect x="10.5" y="1.3" width="3" height="1.4" rx="0.3" fill="#cd7f32"/>

  <!-- Bell ring/loop at top -->
  <circle cx="12" cy="1.5" r="1" fill="none" stroke="#8b5514" stroke-width="0.8"/>
  <circle cx="12" cy="1.5" r="0.6" fill="none" stroke="#cd7f32" stroke-width="0.5"/>

  <!-- Bell rim (bottom) -->
  <path d="M3 17h18v1H3z" fill="#8b5514"/>
  <path d="M4 17h16v0.6H4z" fill="#cd7f32"/>

  <!-- Gold clapper -->
  <circle cx="12" cy="19" r="2" fill="#8b6914"/>
  <circle cx="12" cy="19" r="1.6" fill="#daa520"/>
  <circle cx="12" cy="19" r="1.1" fill="#ffd700"/>
  <ellipse cx="11.5" cy="18.5" rx="0.5" ry="0.4" fill="#ffe44d" opacity="0.6"/>

  <!-- Clapper connector -->
  <rect x="11.5" y="16" width="1" height="2" fill="#8b6914"/>
  <rect x="11.7" y="16.2" width="0.6" height="1.6" fill="#daa520"/>

  <!-- Bell surface detail lines -->
  <path d="M8 10c1 0.5 3 0.8 4 0.8s3-0.3 4-0.8" fill="none" stroke="#8b5514" stroke-width="0.4" opacity="0.5"/>
  <path d="M7 13c1.5 0.5 3.5 0.8 5 0.8s3.5-0.3 5-0.8" fill="none" stroke="#8b5514" stroke-width="0.4" opacity="0.5"/>

  <!-- Edge detail -->
  <path d="M12 2c-4 0-7 3-7 7v6c0 1-1 2-2 2h18c-1 0-2-1-2-2V9c0-4-3-7-7-7z" fill="none" stroke="#5a3a10" stroke-width="0.3"/>
</svg>
