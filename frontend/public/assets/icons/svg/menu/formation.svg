<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#3d2a1a" opacity="0.2"/>

  <!-- Grid base (dark) -->
  <rect x="2" y="3" width="20" height="16" rx="1" fill="#5a4030"/>

  <!-- Grid mid layer -->
  <rect x="3" y="4" width="18" height="14" rx="0.5" fill="#8b7355"/>

  <!-- Grid cells (3x3) - bright -->
  <rect x="4" y="5" width="5" height="4" rx="0.3" fill="#a89070"/>
  <rect x="10" y="5" width="5" height="4" rx="0.3" fill="#a89070"/>
  <rect x="16" y="5" width="4" height="4" rx="0.3" fill="#a89070"/>
  <rect x="4" y="10" width="5" height="4" rx="0.3" fill="#a89070"/>
  <rect x="10" y="10" width="5" height="4" rx="0.3" fill="#a89070"/>
  <rect x="16" y="10" width="4" height="4" rx="0.3" fill="#a89070"/>
  <rect x="4" y="15" width="5" height="2" rx="0.3" fill="#a89070"/>
  <rect x="10" y="15" width="5" height="2" rx="0.3" fill="#a89070"/>
  <rect x="16" y="15" width="4" height="2" rx="0.3" fill="#a89070"/>

  <!-- Highlight on top-left -->
  <ellipse cx="6" cy="6" rx="2" ry="1" fill="#c9b899" opacity="0.5"/>

  <!-- Chess piece markers (gold accents) -->
  <!-- King piece (center) -->
  <circle cx="12" cy="12" r="1.5" fill="#8b6914"/>
  <circle cx="12" cy="12" r="1.2" fill="#daa520"/>
  <path d="M12 10.5v-0.8M11.4 11l0.6-0.5 0.6 0.5" fill="none" stroke="#8b6914" stroke-width="0.5"/>

  <!-- Knight piece (left) -->
  <circle cx="6" cy="7" r="1.2" fill="#8b6914"/>
  <circle cx="6" cy="7" r="0.9" fill="#daa520"/>

  <!-- Pawn pieces -->
  <circle cx="18" cy="7" r="1" fill="#8b6914"/>
  <circle cx="18" cy="7" r="0.7" fill="#daa520"/>
  <circle cx="6" cy="12" r="1" fill="#8b6914"/>
  <circle cx="6" cy="12" r="0.7" fill="#daa520"/>

  <!-- Edge detail stroke -->
  <rect x="2" y="3" width="20" height="16" rx="1" fill="none" stroke="#5a4030" stroke-width="0.4"/>
</svg>
