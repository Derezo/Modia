<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#3d2a1a" opacity="0.2"/>

  <!-- Outer gear (dark) -->
  <circle cx="12" cy="12" r="9" fill="#5a4030"/>

  <!-- Gear teeth (dark layer) -->
  <rect x="10.5" y="1" width="3" height="4" rx="0.5" fill="#5a4030"/>
  <rect x="10.5" y="19" width="3" height="4" rx="0.5" fill="#5a4030"/>
  <rect x="1" y="10.5" width="4" height="3" rx="0.5" fill="#5a4030"/>
  <rect x="19" y="10.5" width="4" height="3" rx="0.5" fill="#5a4030"/>

  <!-- Diagonal teeth -->
  <rect x="3.5" y="3.5" width="3" height="3" rx="0.5" transform="rotate(45 5 5)" fill="#5a4030"/>
  <rect x="17.5" y="3.5" width="3" height="3" rx="0.5" transform="rotate(45 19 5)" fill="#5a4030"/>
  <rect x="3.5" y="17.5" width="3" height="3" rx="0.5" transform="rotate(45 5 19)" fill="#5a4030"/>
  <rect x="17.5" y="17.5" width="3" height="3" rx="0.5" transform="rotate(45 19 19)" fill="#5a4030"/>

  <!-- Mid gear layer -->
  <circle cx="12" cy="12" r="7.5" fill="#8b7355"/>

  <!-- Gear teeth mid -->
  <rect x="10.8" y="2" width="2.4" height="3" rx="0.3" fill="#8b7355"/>
  <rect x="10.8" y="19" width="2.4" height="3" rx="0.3" fill="#8b7355"/>
  <rect x="2" y="10.8" width="3" height="2.4" rx="0.3" fill="#8b7355"/>
  <rect x="19" y="10.8" width="3" height="2.4" rx="0.3" fill="#8b7355"/>

  <!-- Bright inner gear -->
  <circle cx="12" cy="12" r="6" fill="#a89070"/>

  <!-- Highlight -->
  <ellipse cx="9" cy="9" rx="2.5" ry="2" fill="#c9b899" opacity="0.5"/>

  <!-- Inner ring (dark) -->
  <circle cx="12" cy="12" r="4" fill="#5a4030"/>

  <!-- Inner ring (mid) -->
  <circle cx="12" cy="12" r="3.3" fill="#8b7355"/>

  <!-- Center hole -->
  <circle cx="12" cy="12" r="2.5" fill="#a89070"/>

  <!-- Gold center dot accent -->
  <circle cx="12" cy="12" r="1.5" fill="#8b6914"/>
  <circle cx="12" cy="12" r="1.1" fill="#daa520"/>
  <circle cx="12" cy="12" r="0.7" fill="#ffd700"/>
  <circle cx="11.5" cy="11.5" r="0.4" fill="#ffe44d" opacity="0.6"/>

  <!-- Edge detail -->
  <circle cx="12" cy="12" r="6" fill="none" stroke="#5a4030" stroke-width="0.4"/>
</svg>
