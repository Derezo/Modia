<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Magic wand with star burst - abilities/skills -->
  <!-- Wand body with metallic fill -->
  <path class="stroke metallic" d="M4 20l10-10"/>
  <!-- Wand crystal tip -->
  <path class="stroke metallic" d="M14 10l2-2 2 2-2 2z"/>
  <!-- Star burst at tip -->
  <path class="stroke metallic" d="M18 6l.5-3 .5 3 3-.5-.5.5.5 3-.5-3-3 .5z"/>
  <!-- Handle grip detail -->
  <path class="stroke" d="M6 18l1-1M8 16l1-1" style="stroke-width: 1;"/>
  <!-- Sparkles around wand -->
  <circle cx="14" cy="4" r="0.75" fill="currentColor"/>
  <circle cx="21" cy="9" r="0.75" fill="currentColor"/>
  <!-- Pommel decoration -->
  <circle cx="3" cy="21" r="1" fill="currentColor"/>
</svg>
