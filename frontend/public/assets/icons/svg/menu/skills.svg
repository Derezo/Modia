<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="10" cy="21" rx="6" ry="1.5" fill="#3d2850" opacity="0.25"/>

  <!-- Wand body (dark purple) -->
  <path d="M3 21l12-12" fill="none" stroke="#3d2850" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Wand body (mid purple) -->
  <path d="M3 21l12-12" fill="none" stroke="#6b4488" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wand body (bright purple) -->
  <path d="M4 20l10-10" fill="none" stroke="#9966bb" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wand highlight -->
  <path d="M5 19l4-4" fill="none" stroke="#bb99dd" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Wand grip rings -->
  <circle cx="5" cy="19" r="1" fill="#3d2850"/>
  <circle cx="5" cy="19" r="0.7" fill="#6b4488"/>
  <circle cx="7" cy="17" r="0.8" fill="#3d2850"/>
  <circle cx="7" cy="17" r="0.5" fill="#6b4488"/>

  <!-- Wand pommel -->
  <circle cx="3" cy="21" r="1.5" fill="#3d2850"/>
  <circle cx="3" cy="21" r="1.1" fill="#6b4488"/>
  <circle cx="3" cy="21" r="0.7" fill="#9966bb"/>

  <!-- Crystal tip (diamond shape) -->
  <path d="M14 10l2-2 2 2-2 2z" fill="#3d2850"/>
  <path d="M14.3 10l1.7-1.7 1.7 1.7-1.7 1.7z" fill="#6b4488"/>
  <path d="M14.6 10l1.4-1.4 1.4 1.4-1.4 1.4z" fill="#9966bb"/>
  <ellipse cx="15.5" cy="9.5" rx="0.6" ry="0.4" fill="#bb99dd" opacity="0.6"/>

  <!-- Gold sparkles around tip -->
  <!-- Main sparkle (top right) -->
  <circle cx="19" cy="5" r="1.5" fill="#8b6914"/>
  <circle cx="19" cy="5" r="1.1" fill="#daa520"/>
  <circle cx="19" cy="5" r="0.7" fill="#ffd700"/>
  <circle cx="18.7" cy="4.7" r="0.3" fill="#ffe44d" opacity="0.7"/>

  <!-- Star burst rays from main sparkle -->
  <path d="M19 3v1M19 6v1M17.5 5h1M20 5h1M17.8 3.8l0.7 0.7M20.5 6.5l-0.7-0.7M17.8 6.2l0.7-0.7M20.5 3.5l-0.7 0.7" fill="none" stroke="#ffd700" stroke-width="0.5" stroke-linecap="round"/>

  <!-- Secondary sparkles -->
  <circle cx="21" cy="8" r="1" fill="#8b6914"/>
  <circle cx="21" cy="8" r="0.7" fill="#daa520"/>
  <circle cx="21" cy="8" r="0.4" fill="#ffd700"/>

  <circle cx="16" cy="3" r="1" fill="#8b6914"/>
  <circle cx="16" cy="3" r="0.7" fill="#daa520"/>
  <circle cx="16" cy="3" r="0.4" fill="#ffd700"/>

  <!-- Tiny sparkle dots -->
  <circle cx="18" cy="2" r="0.5" fill="#ffd700" opacity="0.8"/>
  <circle cx="22" cy="6" r="0.5" fill="#ffd700" opacity="0.8"/>
  <circle cx="14" cy="5" r="0.4" fill="#ffe44d" opacity="0.6"/>

  <!-- Magic trail from crystal -->
  <path d="M16 8c1-1 2-1.5 3-1" fill="none" stroke="#daa520" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
</svg>
