<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#2a2a2a" opacity="0.25"/>

  <!-- Anvil base - dark steel -->
  <path d="M5 19h14v2H5z" fill="#3a3a3a"/>

  <!-- Anvil base - mid steel -->
  <path d="M5.5 19h13v1.5H5.5z" fill="#5a5a5a"/>

  <!-- Anvil body - dark steel -->
  <path d="M3 15h18v4H3z" fill="#4a4a4a"/>

  <!-- Anvil body - mid steel -->
  <path d="M3.5 15.2h17v3H3.5z" fill="#6a6a6a"/>

  <!-- Anvil body - bright highlight -->
  <path d="M4 15.5h16v1.5H4z" fill="#909090"/>

  <!-- Anvil top surface - dark -->
  <path d="M2 14h20v1.5H2z" fill="#5a5a5a"/>

  <!-- Anvil top surface - mid -->
  <path d="M2.5 14h19v1H2.5z" fill="#8a8a8a"/>

  <!-- Anvil top surface - bright -->
  <path d="M3 14.2h18v0.5H3z" fill="#b0b0b0"/>

  <!-- Anvil horn (left) -->
  <path d="M1 14l-0.5 1.5h2L2 14z" fill="#5a5a5a"/>
  <path d="M1.2 14.2l-0.3 1h1.2l-0.3-1z" fill="#8a8a8a"/>

  <!-- Orange glow under anvil -->
  <ellipse cx="12" cy="18" rx="5" ry="1" fill="#ff8800" opacity="0.3"/>

  <!-- Hammer handle - dark brown -->
  <path d="M16 9l-3 2" fill="none" stroke="#4a3018" stroke-width="2" stroke-linecap="round"/>

  <!-- Hammer handle - mid brown -->
  <path d="M16.2 8.8l-2.7 1.8" fill="none" stroke="#6b4423" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Hammer head - dark steel -->
  <rect x="14" y="4" width="6" height="5" rx="0.5" fill="#4a4a4a"/>

  <!-- Hammer head - mid steel -->
  <rect x="14.5" y="4.3" width="5" height="4" rx="0.3" fill="#6a6a6a"/>

  <!-- Hammer head - bright highlight -->
  <rect x="15" y="4.5" width="4" height="2" rx="0.2" fill="#909090"/>

  <!-- Hot metal on anvil - dark orange -->
  <rect x="8" y="13.5" width="6" height="1.5" rx="0.3" fill="#cc5500"/>

  <!-- Hot metal - bright orange -->
  <rect x="8.3" y="13.7" width="5.4" height="1" rx="0.2" fill="#ff8800"/>

  <!-- Hot metal - yellow core -->
  <rect x="9" y="14" width="4" height="0.5" rx="0.2" fill="#ffaa00"/>

  <!-- Sparks -->
  <circle cx="7" cy="11" r="0.6" fill="#ff8800"/>
  <circle cx="9" cy="10" r="0.5" fill="#ffaa00"/>
  <circle cx="11" cy="11" r="0.4" fill="#ffcc00"/>
  <circle cx="8" cy="12" r="0.4" fill="#ff8800"/>

  <!-- Spark trails -->
  <path d="M7 11l-1-1.5" fill="none" stroke="#ff8800" stroke-width="0.3" opacity="0.6"/>
  <path d="M9 10l0-1.5" fill="none" stroke="#ffaa00" stroke-width="0.3" opacity="0.6"/>
  <path d="M11 11l1-1" fill="none" stroke="#ffcc00" stroke-width="0.3" opacity="0.6"/>
</svg>
