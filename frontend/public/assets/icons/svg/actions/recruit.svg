<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#2a1515" opacity="0.2"/>

  <!-- Banner pole - dark brown -->
  <rect x="14.5" y="3" width="1.5" height="18" fill="#4a3018"/>

  <!-- Banner pole - mid brown -->
  <rect x="14.7" y="3" width="1" height="18" fill="#6b4423"/>

  <!-- Banner pole - highlight -->
  <rect x="14.8" y="3" width="0.4" height="18" fill="#8b5c30"/>

  <!-- Pole finial top - gold dark -->
  <circle cx="15.25" cy="3" r="1.5" fill="#8b6914"/>
  <!-- Pole finial - gold mid -->
  <circle cx="15.1" cy="2.9" r="1.2" fill="#daa520"/>
  <!-- Pole finial - gold bright -->
  <circle cx="14.9" cy="2.7" r="0.6" fill="#ffd700"/>

  <!-- Pole base decoration -->
  <circle cx="15.25" cy="20.5" r="1" fill="#4a3018"/>
  <circle cx="15.1" cy="20.4" r="0.7" fill="#6b4423"/>

  <!-- Banner - dark red -->
  <path d="M15 4h6v8l-3-2-3 2V4z" fill="#662222"/>

  <!-- Banner - mid red -->
  <path d="M15.3 4.3h5.4v7l-2.7-1.8-2.7 1.8V4.3z" fill="#884444"/>

  <!-- Banner - bright red highlight -->
  <path d="M15.8 4.8h3v5l-1.5-1-1.5 1V4.8z" fill="#aa5555"/>

  <!-- Banner wave shadow -->
  <path d="M15.5 6c1 0.3 4 0.3 5 0" fill="none" stroke="#552222" stroke-width="0.4" opacity="0.5"/>

  <!-- Banner gold trim - top -->
  <path d="M15 4h6" fill="none" stroke="#daa520" stroke-width="0.8"/>

  <!-- Banner gold trim - sides -->
  <path d="M15 4v7.5M21 4v7.5" fill="none" stroke="#8b6914" stroke-width="0.5"/>

  <!-- Banner emblem - gold shield -->
  <path d="M18 5.5l1.5 0.5v1.5c0 1-0.5 1.5-1.5 2-1-0.5-1.5-1-1.5-2V6l1.5-0.5z" fill="#8b6914"/>
  <path d="M18 5.8l1.2 0.4v1.3c0 0.8-0.4 1.2-1.2 1.7-0.8-0.5-1.2-0.9-1.2-1.7V6.2l1.2-0.4z" fill="#daa520"/>
  <path d="M18 6.2l0.8 0.3v0.8c0 0.5-0.3 0.8-0.8 1.1-0.5-0.3-0.8-0.6-0.8-1.1V6.5l0.8-0.3z" fill="#ffd700" opacity="0.6"/>

  <!-- Person head - dark brown/skin -->
  <circle cx="8" cy="8" r="3" fill="#5a4030"/>
  <!-- Person head - mid -->
  <circle cx="7.8" cy="7.8" r="2.7" fill="#8b6a50"/>
  <!-- Person head - highlight -->
  <circle cx="7.4" cy="7.4" r="1.5" fill="#a88060"/>

  <!-- Person tunic - dark brown -->
  <path d="M3 21v-2c0-2.5 2-4 5-4s5 1.5 5 4v2z" fill="#4a3018"/>

  <!-- Person tunic - mid brown -->
  <path d="M3.5 21v-1.8c0-2 1.8-3.5 4.5-3.5s4.5 1.5 4.5 3.5v1.8z" fill="#6b4423"/>

  <!-- Person tunic - highlight -->
  <path d="M5 21v-1c0-1.5 1.2-2.5 3-2.5s3 1 3 2.5v1z" fill="#8b5c30"/>

  <!-- Tunic collar -->
  <path d="M6.5 15c0.8-0.3 2.2-0.3 3 0" fill="none" stroke="#4a3018" stroke-width="0.6"/>

  <!-- Belt -->
  <rect x="4" y="18" width="8" height="1" fill="#4a3018"/>
  <rect x="4.2" y="18.1" width="7.6" height="0.6" fill="#6b4423"/>

  <!-- Belt buckle - gold -->
  <rect x="7" y="17.8" width="2" height="1.4" rx="0.2" fill="#8b6914"/>
  <rect x="7.2" y="18" width="1.6" height="1" rx="0.1" fill="#daa520"/>
  <rect x="7.4" y="18.1" width="0.6" height="0.8" rx="0.1" fill="#ffd700" opacity="0.5"/>
</svg>
