<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#221100" opacity="0.3"/>

  <!-- Compass outer ring - dark -->
  <circle cx="12" cy="11" r="9" fill="#553311"/>

  <!-- Compass outer ring - mid brown -->
  <circle cx="12" cy="11" r="8" fill="#885533"/>

  <!-- Compass face - parchment -->
  <circle cx="12" cy="11" r="7" fill="#f5e6c8"/>

  <!-- Compass inner ring - gold -->
  <circle cx="12" cy="11" r="6.5" fill="none" stroke="#daa520" stroke-width="0.8"/>

  <!-- Cardinal direction marks -->
  <g fill="#553311">
    <rect x="11.5" y="4.5" width="1" height="2"/>
    <rect x="11.5" y="15.5" width="1" height="2"/>
    <rect x="4.5" y="10.5" width="2" height="1"/>
    <rect x="15.5" y="10.5" width="2" height="1"/>
  </g>

  <!-- N marker -->
  <text x="12" y="7" font-family="serif" font-size="2.5" fill="#884422" text-anchor="middle">N</text>

  <!-- Compass needle - north (red) -->
  <path d="M12 5l-2 6 2-1 2 1-2-6z" fill="#cc3333"/>

  <!-- Compass needle - south (white/silver) -->
  <path d="M12 17l2-6-2 1-2-1 2 6z" fill="#888888"/>

  <!-- Compass center pivot -->
  <circle cx="12" cy="11" r="1.5" fill="#8b6914"/>
  <circle cx="12" cy="11" r="1" fill="#daa520"/>
  <circle cx="12" cy="11" r="0.5" fill="#ffd700"/>

  <!-- Glass reflection -->
  <ellipse cx="9" cy="8" rx="2" ry="1.5" fill="#ffffff" opacity="0.2"/>

  <!-- Footprints (exploration) -->
  <ellipse cx="19" cy="17" rx="1.2" ry="1.8" fill="#664422" opacity="0.6"/>
  <ellipse cx="21" cy="19" rx="1" ry="1.5" fill="#664422" opacity="0.5"/>

  <!-- Gold detail on rim -->
  <circle cx="12" cy="2" r="0.6" fill="#ffd700"/>
</svg>
