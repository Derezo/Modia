  <path class="stroke" d="M10 3h4v2h-4z"/>
  <!-- Liquid level -->
  <path class="stroke" d="M7 15c2 1 8 1 10 0"/>
  <!-- Bubbles -->
  <circle class="stroke" cx="10" cy="17" r="1" style="stroke-width: 1;"/>
  <circle class="stroke" cx="14" cy="16" r="0.75" style="stroke-width: 1;"/>
  <circle class="stroke" cx="12" cy="19" r="0.5" style="stroke-width: 1;"/>
  <!-- Label -->
  <rect class="stroke" x="10" y="10" width="4" height="3" style="stroke-width: 1;"/>
</svg>
