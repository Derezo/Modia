<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="5" ry="1.5" fill="#1a2a1a" opacity="0.25"/>

  <!-- Flask body - dark green glass -->
  <path d="M9 9V6h6v3l3 9c0 2-2 3-6 3s-6-1-6-3l3-9z" fill="#2d5530"/>

  <!-- Flask body - mid green glass -->
  <path d="M9.5 9V6.5h5v2.5l2.7 8.5c0 1.5-1.5 2.5-5.2 2.5s-5.2-1-5.2-2.5l2.7-8.5z" fill="#448844"/>

  <!-- Flask body - bright green highlight -->
  <path d="M10 9V7h2v2l1.5 6c-0.5 0.5-1.5 1-2.5 1s-2-0.5-2.5-1l1.5-6z" fill="#66aa66" opacity="0.7"/>

  <!-- Flask glass highlight -->
  <path d="M10.5 8l-1.5 6" fill="none" stroke="#88cc88" stroke-width="0.6" opacity="0.5"/>

  <!-- Liquid - dark purple -->
  <path d="M7 15c0 0 1 3 5 3s5-3 5-3l-1-3c-1 0.5-3 1-4 1s-3-0.5-4-1l-1 3z" fill="#4a3060"/>

  <!-- Liquid - mid purple -->
  <path d="M7.5 15c0 0 1 2.5 4.5 2.5s4.5-2.5 4.5-2.5l-0.8-2.5c-1 0.4-2.5 0.8-3.7 0.8s-2.7-0.4-3.7-0.8l-0.8 2.5z" fill="#6b4488"/>

  <!-- Liquid surface line -->
  <path d="M7 15c2 0.8 8 0.8 10 0" fill="none" stroke="#8855aa" stroke-width="0.5"/>

  <!-- Bubbles -->
  <circle cx="9.5" cy="16.5" r="0.8" fill="#8855aa" opacity="0.6"/>
  <circle cx="14" cy="16" r="0.6" fill="#9966bb" opacity="0.5"/>
  <circle cx="11.5" cy="18" r="0.5" fill="#8855aa" opacity="0.4"/>

  <!-- Bubble highlights -->
  <circle cx="9.2" cy="16.2" r="0.25" fill="#aa77cc" opacity="0.7"/>
  <circle cx="13.8" cy="15.8" r="0.2" fill="#aa77cc" opacity="0.7"/>

  <!-- Flask neck - dark green -->
  <rect x="9" y="4" width="6" height="2" fill="#2d5530"/>

  <!-- Flask neck - mid green -->
  <rect x="9.3" y="4.2" width="5.4" height="1.6" fill="#448844"/>

  <!-- Flask neck rim -->
  <path d="M9 5.8c0-0.8 1-1.5 3-1.5s3 0.7 3 1.5" fill="none" stroke="#2d5530" stroke-width="0.8"/>

  <!-- Cork - dark brown -->
  <rect x="10" y="2" width="4" height="2.5" rx="0.3" fill="#4a3018"/>

  <!-- Cork - mid brown -->
  <rect x="10.3" y="2.2" width="3.4" height="2" rx="0.2" fill="#6b4423"/>

  <!-- Cork - highlight -->
  <rect x="10.5" y="2.3" width="1.5" height="1.5" rx="0.2" fill="#8b5c30" opacity="0.6"/>

  <!-- Cork grain lines -->
  <path d="M11 2.5v1.5M12.5 2.5v1.5" fill="none" stroke="#4a3018" stroke-width="0.3" opacity="0.5"/>

  <!-- Label on flask -->
  <rect x="10" y="9.5" width="4" height="2.5" rx="0.3" fill="#d4c4a4"/>
  <rect x="10.2" y="9.7" width="3.6" height="2.1" rx="0.2" fill="#e8dcc8"/>

  <!-- Label symbol (mortar pestle hint) -->
  <circle cx="12" cy="10.7" r="0.6" fill="#6b4423"/>
</svg>
