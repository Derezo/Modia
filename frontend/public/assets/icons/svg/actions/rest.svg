<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="1.5" fill="#1a2a1a" opacity="0.2"/>

  <!-- Ground grass - dark -->
  <ellipse cx="12" cy="20" rx="9" ry="2" fill="#2d5530"/>

  <!-- Ground grass - mid -->
  <ellipse cx="12" cy="20" rx="8" ry="1.5" fill="#448844"/>

  <!-- Tent - dark base (back) -->
  <path d="M5 19l7-11 7 11z" fill="#5a4030"/>

  <!-- Tent - mid brown (front face) -->
  <path d="M6 19l6-9.5 6 9.5z" fill="#8b6a50"/>

  <!-- Tent - light highlight (left side) -->
  <path d="M6 19l6-9.5-2 9.5z" fill="#a88060"/>

  <!-- Tent opening - dark -->
  <path d="M10 19v-5l2-3 2 3v5" fill="#3a2820"/>

  <!-- Tent opening - slightly lighter interior -->
  <path d="M10.5 19v-4.5l1.5-2.5 1.5 2.5v4.5" fill="#4a3830"/>

  <!-- Tent pole hint -->
  <line x1="12" y1="8" x2="12" y2="6" stroke="#5a4030" stroke-width="0.8"/>

  <!-- Campfire logs - dark -->
  <ellipse cx="18" cy="18.5" rx="2" ry="0.8" fill="#4a3018"/>

  <!-- Campfire ember base -->
  <ellipse cx="18" cy="17.5" rx="1.5" ry="1" fill="#662222"/>

  <!-- Campfire flame - orange -->
  <path d="M17 17c0.3-1 0.8-1.5 1-2s0.7 1 1 2c-0.3-0.3-1.7-0.3-2 0z" fill="#cc4400"/>

  <!-- Campfire flame - yellow core -->
  <path d="M17.5 17c0.2-0.6 0.4-1 0.5-1.3s0.3 0.7 0.5 1.3c-0.2-0.2-0.8-0.2-1 0z" fill="#ffaa00"/>

  <!-- Fire sparks -->
  <circle cx="17.5" cy="15" r="0.3" fill="#ffaa00" opacity="0.8"/>
  <circle cx="18.5" cy="14.5" r="0.25" fill="#ff6600" opacity="0.7"/>
  <circle cx="18" cy="14" r="0.2" fill="#ffcc00" opacity="0.6"/>

  <!-- Crescent moon -->
  <path d="M4 4a3 3 0 0 0 0 4 2.5 2.5 0 0 1 0-4z" fill="#c9b899"/>

  <!-- Stars -->
  <circle cx="7" cy="3" r="0.4" fill="#c9b899" opacity="0.8"/>
  <circle cx="20" cy="5" r="0.35" fill="#c9b899" opacity="0.7"/>
  <circle cx="3" cy="9" r="0.3" fill="#c9b899" opacity="0.6"/>
</svg>
