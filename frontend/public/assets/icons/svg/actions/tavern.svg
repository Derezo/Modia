<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#3a2010" opacity="0.25"/>

  <!-- Mug body - dark copper base -->
  <path d="M5 8h10v11c0 1.5-1.5 2.5-3 2.5H8c-1.5 0-3-1-3-2.5V8z" fill="#8b4513"/>

  <!-- Mug body - mid copper -->
  <path d="M6 8.5h8v10c0 1-1 2-2.5 2H8.5c-1.5 0-2.5-1-2.5-2V8.5z" fill="#b87333"/>

  <!-- Mug body - bright copper highlight -->
  <path d="M7 9h4v9c0 0.8-0.5 1.5-1.5 1.5H8.5c-1 0-1.5-0.7-1.5-1.5V9z" fill="#cd9966"/>

  <!-- Mug rim - dark -->
  <ellipse cx="10" cy="8" rx="5" ry="1.5" fill="#8b4513"/>

  <!-- Mug rim - mid -->
  <ellipse cx="10" cy="7.8" rx="4.5" ry="1.2" fill="#b87333"/>

  <!-- Handle - dark copper -->
  <path d="M15 10h2c1.5 0 2.5 1 2.5 2.5v1c0 1.5-1 2.5-2.5 2.5h-2" fill="none" stroke="#8b4513" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Handle - bright copper highlight -->
  <path d="M15 10.5h1.5c1 0 2 0.8 2 2v0.5c0 1.2-1 2-2 2H15" fill="none" stroke="#cd9966" stroke-width="1" stroke-linecap="round"/>

  <!-- Foam base - tan -->
  <path d="M5.5 8c0-0.5 0.5-1.5 1.5-2 1-0.5 2.5-0.5 3 0s1 1 2 1 2-0.5 2.5 0c0.5 0.5 0.5 1 0 1.5" fill="#d4b896"/>

  <!-- Foam bubbles - light tan/white -->
  <ellipse cx="7" cy="6.5" rx="1.5" ry="1" fill="#f5e6d3"/>
  <ellipse cx="10" cy="6" rx="2" ry="1.2" fill="#f5e6d3"/>
  <ellipse cx="13" cy="6.5" rx="1.5" ry="1" fill="#f5e6d3"/>

  <!-- Foam highlights -->
  <circle cx="7" cy="6.2" r="0.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="10" cy="5.7" r="0.6" fill="#ffffff" opacity="0.5"/>
  <circle cx="13" cy="6.2" r="0.4" fill="#ffffff" opacity="0.5"/>

  <!-- Mug bands -->
  <path d="M5.5 12h9" fill="none" stroke="#8b4513" stroke-width="0.8"/>
  <path d="M5.5 16h9" fill="none" stroke="#8b4513" stroke-width="0.8"/>

  <!-- Steam wisps -->
  <path d="M8 4c0.3-0.8 0.3-1.5 0-2" fill="none" stroke="#d4b896" stroke-width="0.6" opacity="0.6"/>
  <path d="M12 3.5c0.3-0.8 0.3-1.5 0-2" fill="none" stroke="#d4b896" stroke-width="0.6" opacity="0.6"/>
</svg>
