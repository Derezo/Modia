<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="5" ry="1.5" fill="#3d2a00" opacity="0.2"/>

  <!-- Left stalk - dark brown -->
  <path d="M9 21V11" fill="none" stroke="#5a4020" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left stalk - mid brown -->
  <path d="M9 21V11" fill="none" stroke="#8b6914" stroke-width="1" stroke-linecap="round"/>

  <!-- Center stalk - dark brown -->
  <path d="M12 21V8" fill="none" stroke="#5a4020" stroke-width="2" stroke-linecap="round"/>

  <!-- Center stalk - mid brown -->
  <path d="M12 21V8" fill="none" stroke="#8b6914" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right stalk - dark brown -->
  <path d="M15 21V11" fill="none" stroke="#5a4020" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right stalk - mid brown -->
  <path d="M15 21V11" fill="none" stroke="#8b6914" stroke-width="1" stroke-linecap="round"/>

  <!-- Left wheat head - dark gold -->
  <ellipse cx="9" cy="9" rx="1.8" ry="3" fill="#8b6914"/>
  <!-- Left wheat head - mid gold -->
  <ellipse cx="8.8" cy="8.8" rx="1.5" ry="2.7" fill="#daa520"/>
  <!-- Left wheat head - bright gold -->
  <ellipse cx="8.6" cy="8.5" rx="1" ry="2" fill="#ffd700"/>

  <!-- Left grain detail lines -->
  <path d="M8 7l1 0.5M8 8.5l1 0.5M8 10l1 0.5" fill="none" stroke="#8b6914" stroke-width="0.5"/>

  <!-- Center wheat head - dark gold -->
  <ellipse cx="12" cy="6" rx="2" ry="3.5" fill="#8b6914"/>
  <!-- Center wheat head - mid gold -->
  <ellipse cx="11.8" cy="5.8" rx="1.7" ry="3.2" fill="#daa520"/>
  <!-- Center wheat head - bright gold -->
  <ellipse cx="11.5" cy="5.5" rx="1.2" ry="2.5" fill="#ffd700"/>
  <!-- Center wheat head - highlight -->
  <ellipse cx="11" cy="5" rx="0.6" ry="1.5" fill="#ffe44d" opacity="0.6"/>

  <!-- Center grain detail lines -->
  <path d="M11 4l1 0.5M11 5.5l1 0.5M11 7l1 0.5" fill="none" stroke="#8b6914" stroke-width="0.5"/>

  <!-- Right wheat head - dark gold -->
  <ellipse cx="15" cy="9" rx="1.8" ry="3" fill="#8b6914"/>
  <!-- Right wheat head - mid gold -->
  <ellipse cx="15.2" cy="8.8" rx="1.5" ry="2.7" fill="#daa520"/>
  <!-- Right wheat head - bright gold -->
  <ellipse cx="15.4" cy="8.5" rx="1" ry="2" fill="#ffd700"/>

  <!-- Right grain detail lines -->
  <path d="M16 7l-1 0.5M16 8.5l-1 0.5M16 10l-1 0.5" fill="none" stroke="#8b6914" stroke-width="0.5"/>

  <!-- Awns (wheat whiskers) -->
  <path d="M8 5l-1-2M9 4l0-2M10 5l1-2" fill="none" stroke="#daa520" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M11 3l-0.5-1.5M12 2l0-1.5M13 3l0.5-1.5" fill="none" stroke="#daa520" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M14 5l-1-2M15 4l0-2M16 5l1-2" fill="none" stroke="#daa520" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Tie band - dark brown -->
  <ellipse cx="12" cy="17" rx="4.5" ry="1.8" fill="#5a4020"/>
  <!-- Tie band - mid brown -->
  <ellipse cx="12" cy="16.8" rx="4" ry="1.5" fill="#8b6914"/>
  <!-- Tie band - bright highlight -->
  <ellipse cx="11.5" cy="16.5" rx="2.5" ry="1" fill="#daa520" opacity="0.5"/>

  <!-- Tie knot -->
  <circle cx="12" cy="17" r="1" fill="#5a4020"/>
  <circle cx="11.8" cy="16.8" r="0.7" fill="#8b6914"/>
  <circle cx="11.6" cy="16.6" r="0.35" fill="#daa520"/>
</svg>
