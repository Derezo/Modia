<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="1.5" fill="#2a2020" opacity="0.2"/>

  <!-- Left person body - dark brown -->
  <path d="M1 21v-2.5c0-2 1.5-3 4-3s3.5 1.3 4 2.5" fill="#4a3018"/>
  <!-- Left person body - mid brown -->
  <path d="M1.5 21v-2.2c0-1.7 1.3-2.6 3.5-2.6s3 1.1 3.5 2.2" fill="#6b4423"/>
  <!-- Left person body - highlight -->
  <path d="M2.5 21v-1.5c0-1.2 1-1.8 2.5-1.8s2.2 0.8 2.5 1.5" fill="#8b5c30"/>

  <!-- Left person head - dark -->
  <circle cx="5" cy="11" r="2.8" fill="#5a4030"/>
  <!-- Left person head - mid -->
  <circle cx="4.8" cy="10.8" r="2.5" fill="#8b6a50"/>
  <!-- Left person head - highlight -->
  <circle cx="4.4" cy="10.4" r="1.3" fill="#a88060"/>

  <!-- Right person body - dark brown -->
  <path d="M23 21v-2.5c0-2-1.5-3-4-3s-3.5 1.3-4 2.5" fill="#4a3018"/>
  <!-- Right person body - mid brown -->
  <path d="M22.5 21v-2.2c0-1.7-1.3-2.6-3.5-2.6s-3 1.1-3.5 2.2" fill="#6b4423"/>
  <!-- Right person body - highlight -->
  <path d="M21.5 21v-1.5c0-1.2-1-1.8-2.5-1.8s-2.2 0.8-2.5 1.5" fill="#8b5c30"/>

  <!-- Right person head - dark -->
  <circle cx="19" cy="11" r="2.8" fill="#5a4030"/>
  <!-- Right person head - mid -->
  <circle cx="19.2" cy="10.8" r="2.5" fill="#8b6a50"/>
  <!-- Right person head - highlight -->
  <circle cx="19.6" cy="10.4" r="1.3" fill="#a88060"/>

  <!-- Center person body (forward) - dark brown -->
  <path d="M6 21v-3c0-2.5 2.5-4 6-4s6 1.5 6 4v3z" fill="#4a3018"/>
  <!-- Center person body - mid brown -->
  <path d="M6.5 21v-2.7c0-2.2 2.2-3.5 5.5-3.5s5.5 1.3 5.5 3.5v2.7z" fill="#6b4423"/>
  <!-- Center person body - highlight -->
  <path d="M8 21v-2c0-1.5 1.8-2.5 4-2.5s4 1 4 2.5v2z" fill="#8b5c30"/>

  <!-- Center person head - dark -->
  <circle cx="12" cy="7" r="3.5" fill="#5a4030"/>
  <!-- Center person head - mid -->
  <circle cx="11.8" cy="6.8" r="3.2" fill="#8b6a50"/>
  <!-- Center person head - highlight -->
  <circle cx="11.3" cy="6.3" r="1.8" fill="#a88060"/>

  <!-- Conversation indicators - blue speech accents -->
  <!-- Left speech bubble hint -->
  <ellipse cx="8" cy="8" rx="1.5" ry="1" fill="#446688" opacity="0.6"/>
  <ellipse cx="7.8" cy="7.8" rx="1" ry="0.7" fill="#5588aa" opacity="0.5"/>

  <!-- Right speech bubble hint -->
  <ellipse cx="16" cy="8" rx="1.5" ry="1" fill="#446688" opacity="0.6"/>
  <ellipse cx="16.2" cy="7.8" rx="1" ry="0.7" fill="#5588aa" opacity="0.5"/>

  <!-- Connection dots -->
  <circle cx="9" cy="9" r="0.4" fill="#5588aa" opacity="0.7"/>
  <circle cx="15" cy="9" r="0.4" fill="#5588aa" opacity="0.7"/>

  <!-- Center tunic detail lines -->
  <path d="M10 15v3M14 15v3" fill="none" stroke="#4a3018" stroke-width="0.5" opacity="0.5"/>

  <!-- Belt -->
  <rect x="9" y="17" width="6" height="0.8" fill="#4a3018"/>
  <rect x="9.2" y="17.1" width="5.6" height="0.5" fill="#6b4423"/>

  <!-- Belt buckle - blue accent -->
  <rect x="11" y="16.8" width="2" height="1.2" rx="0.2" fill="#446688"/>
  <rect x="11.2" y="16.9" width="1.6" height="0.9" rx="0.1" fill="#5588aa"/>
  <rect x="11.4" cy="17" width="0.5" height="0.6" rx="0.1" fill="#6699bb" opacity="0.6"/>
</svg>
