<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#2a1830" opacity="0.25"/>

  <!-- Stone arch - dark base -->
  <path d="M4 20V8a8 8 0 0 1 16 0v12" fill="#4a4a4a"/>

  <!-- Stone arch - mid gray -->
  <path d="M5 20V8.5a7 7 0 0 1 14 0V20" fill="#606060"/>

  <!-- Stone arch - light highlight on left -->
  <path d="M5 20V9a6.5 6.5 0 0 1 3-5.5" fill="none" stroke="#808080" stroke-width="1.5"/>

  <!-- Portal void - dark purple base -->
  <ellipse cx="12" cy="12" rx="5" ry="7" fill="#3d2850"/>

  <!-- Portal swirl - mid purple -->
  <ellipse cx="12" cy="12" rx="4" ry="6" fill="#6b4488"/>

  <!-- Portal swirl - lighter purple -->
  <ellipse cx="12" cy="12" rx="3" ry="4.5" fill="#9966bb"/>

  <!-- Portal center - lightest -->
  <ellipse cx="12" cy="12" rx="1.5" ry="2.5" fill="#bb99dd"/>

  <!-- Swirl lines -->
  <path d="M9 8c2 1 4 1 6 0" fill="none" stroke="#bb99dd" stroke-width="0.6" opacity="0.6"/>
  <path d="M8 12c3 1.5 5 1.5 8 0" fill="none" stroke="#bb99dd" stroke-width="0.6" opacity="0.6"/>
  <path d="M9 16c2-1 4-1 6 0" fill="none" stroke="#bb99dd" stroke-width="0.6" opacity="0.6"/>

  <!-- Gold rune accents on arch -->
  <circle cx="6" cy="10" r="0.8" fill="#daa520"/>
  <circle cx="18" cy="10" r="0.8" fill="#daa520"/>
  <circle cx="12" cy="4" r="0.8" fill="#ffd700"/>

  <!-- Gold keystone -->
  <path d="M10 3.5l2-1.5 2 1.5" fill="none" stroke="#daa520" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Portal sparkles -->
  <circle cx="10" cy="9" r="0.4" fill="#ffffff" opacity="0.7"/>
  <circle cx="14" cy="14" r="0.3" fill="#ffffff" opacity="0.6"/>
  <circle cx="11" cy="16" r="0.35" fill="#ffffff" opacity="0.5"/>
</svg>
