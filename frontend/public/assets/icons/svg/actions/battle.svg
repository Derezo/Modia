<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="6" ry="1.5" fill="#3a3a3a" opacity="0.2"/>

  <!-- Sword 1 blade (left to right) - dark to bright steel -->
  <path d="M4 4l10 10-1 1-10-10z" fill="#5a5a5a"/>
  <path d="M5 4l9 9-.5.5-9-9z" fill="#a0a0a0"/>
  <path d="M6 4.5l7.5 7.5-.3.3-7.5-7.5z" fill="#d0d0d0"/>

  <!-- Sword 1 guard -->
  <rect x="13" y="13" width="4" height="2" rx="0.5" transform="rotate(45 15 14)" fill="#8b5514"/>
  <rect x="13.5" y="13.3" width="3" height="1.4" rx="0.3" transform="rotate(45 15 14)" fill="#cd7f32"/>

  <!-- Sword 1 pommel -->
  <circle cx="3.5" cy="3.5" r="1.8" fill="#8b5514"/>
  <circle cx="3.2" cy="3.2" r="1.3" fill="#cd7f32"/>
  <circle cx="2.8" cy="2.8" r="0.6" fill="#e6a852"/>

  <!-- Sword 2 blade (right to left) - dark to bright steel -->
  <path d="M20 4l-10 10 1 1 10-10z" fill="#5a5a5a"/>
  <path d="M19 4l-9 9 .5.5 9-9z" fill="#a0a0a0"/>
  <path d="M18 4.5l-7.5 7.5 .3.3 7.5-7.5z" fill="#d0d0d0"/>

  <!-- Sword 2 guard -->
  <rect x="7" y="13" width="4" height="2" rx="0.5" transform="rotate(-45 9 14)" fill="#8b5514"/>
  <rect x="7.5" y="13.3" width="3" height="1.4" rx="0.3" transform="rotate(-45 9 14)" fill="#cd7f32"/>

  <!-- Sword 2 pommel -->
  <circle cx="20.5" cy="3.5" r="1.8" fill="#8b5514"/>
  <circle cx="20.8" cy="3.2" r="1.3" fill="#cd7f32"/>
  <circle cx="21.2" cy="2.8" r="0.6" fill="#e6a852"/>

  <!-- Center crossing highlight -->
  <circle cx="12" cy="12" r="1.5" fill="#ffffff" opacity="0.2"/>

  <!-- Blade edge highlights -->
  <path d="M5.5 5l6 6" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.4"/>
  <path d="M18.5 5l-6 6" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.4"/>
</svg>
