<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Crossed swords - medieval combat -->
  <!-- Sword 1 (left to right) -->
  <path class="stroke metallic" d="M4 4l12 12"/>
  <path class="stroke" d="M4 4l2-1 1 2"/>
  <path class="stroke" d="M14 14l2 2-2 2-2-2"/>
  <!-- Sword 2 (right to left) -->
  <path class="stroke metallic" d="M20 4L8 16"/>
  <path class="stroke" d="M20 4l-2-1-1 2"/>
  <path class="stroke" d="M10 14l-2 2 2 2 2-2"/>
  <!-- Blade detail -->
  <path class="stroke" d="M7 7l1 1M16 7l1 1" style="stroke-width: 1;"/>
  <!-- Pommel dots -->
  <circle cx="3" cy="3" r="1" fill="currentColor"/>
  <circle cx="21" cy="3" r="1" fill="currentColor"/>
</svg>
