<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="2" fill="#1a1a20" opacity="0.3"/>

  <!-- Helmet -->
  <ellipse cx="12" cy="10.1" rx="5.5" ry="4.5" fill="#4a4a50"/>
  <ellipse cx="12" cy="9.875" rx="4.95" ry="4.05" fill="#6a6a70"/>
  <ellipse cx="12" cy="9.65" rx="4.125" ry="3.375" fill="#8a8a90"/>
  <!-- Highlight -->
  <ellipse cx="10.9" cy="8.75" rx="1.65" ry="0.9" fill="#aaaaaa" opacity="0.5"/>
  <!-- Visor slit -->
  <path d="M8.7 11.45h6.6" fill="none" stroke="#4a4a50" stroke-width="1.5"/>

  <!-- Golden crest -->
  <path d="M12 1l-2 4h4z" fill="#8b6914"/>
  <path d="M12 1.5l-1.5 3h3z" fill="#daa520"/>
  <path d="M12 2l-1 2h2z" fill="#ffd700"/>

  <!-- Golden trim around helmet -->
  <ellipse cx="12" cy="6" rx="5" ry="1" fill="#8b6914"/>
  <ellipse cx="12" cy="5.8" rx="4.5" ry="0.7" fill="#daa520"/>

  <!-- Cheek guards with gold trim -->
  <path d="M5 12l-1 6h3z" fill="#6a6a70"/>
  <path d="M19 12l1 6h-3z" fill="#6a6a70"/>
  <path d="M5.3 12.5l-0.8 5h2.3z" fill="#8a8a90"/>
  <path d="M18.7 12.5l0.8 5h-2.3z" fill="#8a8a90"/>

  <!-- Gold rivets -->
  <circle cx="5" cy="13" r="0.7" fill="#daa520"/>
  <circle cx="19" cy="13" r="0.7" fill="#daa520"/>
  <circle cx="5" cy="13" r="0.4" fill="#ffd700"/>
  <circle cx="19" cy="13" r="0.4" fill="#ffd700"/>

  <!-- Royal emblem on forehead -->
  <circle cx="12" cy="8" r="1.5" fill="#8b6914"/>
  <circle cx="12" cy="8" r="1.1" fill="#daa520"/>
  <circle cx="12" cy="8" r="0.6" fill="#ffd700"/>

</svg>