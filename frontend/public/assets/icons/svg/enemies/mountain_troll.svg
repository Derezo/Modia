<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="2" fill="#1a1a20" opacity="0.3"/>

  <!-- Large brutish head -->
  <ellipse cx="12" cy="11" rx="8" ry="7" fill="#3a4a2a"/>
  <ellipse cx="12" cy="10.5" rx="7.5" ry="6.5" fill="#5a6a4a"/>
  <ellipse cx="12" cy="10" rx="6.5" ry="5.5" fill="#7a8a6a"/>

  <!-- Heavy brow -->
  <path d="M5 8q7-3 14 0" fill="#3a4a2a"/>
  <path d="M6 8.5q6-2.5 12 0" fill="#5a6a4a"/>

  <!-- Small angry eyes under brow -->
  <circle cx="9" cy="10" r="1.2" fill="#2a2a2a"/>
  <circle cx="15" cy="10" r="1.2" fill="#2a2a2a"/>
  <circle cx="9" cy="10" r="0.6" fill="#884400"/>
  <circle cx="15" cy="10" r="0.6" fill="#884400"/>

  <!-- Big nose -->
  <ellipse cx="12" cy="13" rx="2" ry="1.5" fill="#3a4a2a"/>
  <ellipse cx="12" cy="12.8" rx="1.7" ry="1.2" fill="#5a6a4a"/>
  <circle cx="10.5" cy="13" r="0.5" fill="#3a4a2a"/>
  <circle cx="13.5" cy="13" r="0.5" fill="#3a4a2a"/>

  <!-- Tusks -->
  <path d="M8 16l-1 3" stroke="#f0e8d8" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 16l1 3" stroke="#f0e8d8" stroke-width="2" stroke-linecap="round"/>
  <path d="M8.2 16.2l-0.8 2.5" stroke="#ddd8c8" stroke-width="1" stroke-linecap="round"/>
  <path d="M15.8 16.2l0.8 2.5" stroke="#ddd8c8" stroke-width="1" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="4" cy="10" rx="2" ry="3" fill="#5a6a4a"/>
  <ellipse cx="20" cy="10" rx="2" ry="3" fill="#5a6a4a"/>
  <ellipse cx="4.3" cy="10" rx="1.3" ry="2" fill="#7a8a6a"/>
  <ellipse cx="19.7" cy="10" rx="1.3" ry="2" fill="#7a8a6a"/>

</svg>