<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Shadow -->
  <ellipse cx="12" cy="20" rx="7" ry="2" fill="#1a1a20" opacity="0.3"/>

  <!-- Slime body -->
  <ellipse cx="12" cy="14" rx="8" ry="6" fill="#1a4a4a"/>
  <ellipse cx="12" cy="13.5" rx="7.5" ry="5.5" fill="#2a8a7a"/>
  <ellipse cx="12" cy="13" rx="6.5" ry="4.5" fill="#4abaaa"/>

  <!-- Top bulge -->
  <ellipse cx="10" cy="10" rx="4" ry="3" fill="#2a8a7a"/>
  <ellipse cx="10" cy="9.5" rx="3.5" ry="2.5" fill="#4abaaa"/>

  <!-- Shine highlights -->
  <ellipse cx="8" cy="8" rx="2" ry="1.5" fill="#6adaca" opacity="0.6"/>
  <circle cx="7" cy="7" r="1" fill="#fff" opacity="0.5"/>

  <!-- Eyes (cute slime eyes) -->
  <ellipse cx="9" cy="12" rx="1.5" ry="2" fill="#1a2a2a"/>
  <ellipse cx="14" cy="12" rx="1.5" ry="2" fill="#1a2a2a"/>
  <circle cx="9.3" cy="11.5" r="0.6" fill="#fff" opacity="0.7"/>
  <circle cx="14.3" cy="11.5" r="0.6" fill="#fff" opacity="0.7"/>

</svg>