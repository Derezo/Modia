<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="2" fill="#1a1a20" opacity="0.3"/>

  <!-- Hood -->
  <path d="M12 1
    Q9.6 3 4 11
    L9.6 13
    Q12 9 14.4 13
    L20 11
    Q14.4 3 12 1
    Z" fill="#1a1a20"/>
  <path d="M12 2
    Q10 4 5.2 10
    L10 12
    Q12 8.5 14 12
    L18.8 10
    Q14 4 12 2
    Z" fill="#2a2a35"/>

  <!-- Face completely in shadow -->
  <ellipse cx="12" cy="13" rx="4" ry="3.5" fill="#0a0a10"/>

  <!-- Glowing Eyes -->
  <circle cx="9.5" cy="12" r="1.5" fill="#6b2d4d" opacity="0.3"/>
  <circle cx="14.5" cy="12" r="1.5" fill="#6b2d4d" opacity="0.3"/>
  <circle cx="9.5" cy="12" r="1" fill="#6b2d4d"/>
  <circle cx="14.5" cy="12" r="1" fill="#6b2d4d"/>
  <circle cx="9.5" cy="12" r="0.5" fill="#fff" opacity="0.7"/>
  <circle cx="14.5" cy="12" r="0.5" fill="#fff" opacity="0.7"/>

  <!-- Mask/scarf -->
  <path d="M8 14q4 3 8 0" fill="#1a1a25"/>

  <!-- Dagger crossed -->
  <line x1="4" y1="17" x2="9" y2="12" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="17" x2="15" y2="12" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4.3" y1="16.7" x2="8.7" y2="12.3" stroke="#7a7a7a" stroke-width="0.8"/>
  <line x1="19.7" y1="16.7" x2="15.3" y2="12.3" stroke="#7a7a7a" stroke-width="0.8"/>

  <!-- Shadow wisps -->
  <path d="M6 18q-2 2-3 0" fill="none" stroke="#6b2d4d" stroke-width="0.5" opacity="0.5"/>
  <path d="M18 18q2 2 3 0" fill="none" stroke="#6b2d4d" stroke-width="0.5" opacity="0.5"/>

</svg>