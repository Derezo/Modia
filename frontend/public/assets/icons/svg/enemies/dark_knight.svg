<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="2" fill="#1a1a20" opacity="0.3"/>

  <!-- Helmet -->
  <ellipse cx="12" cy="10" rx="6" ry="5" fill="#1a1a20"/>
  <ellipse cx="12" cy="9.75" rx="5.4" ry="4.5" fill="#2a2a35"/>
  <ellipse cx="12" cy="9.5" rx="4.5" ry="3.75" fill="#3a3a45"/>
  <!-- Highlight -->
  <ellipse cx="10.8" cy="8.5" rx="1.7999999999999998" ry="1" fill="#4a4a55" opacity="0.5"/>

  <!-- Visor (T-shaped, glowing) -->
  <path d="M7 10h10" stroke="#1a0010" stroke-width="2"/>
  <path d="M12 10v4" stroke="#1a0010" stroke-width="2"/>

  <!-- Visor glow -->
  <path d="M7.5 10h9" stroke="#6b2d4d" stroke-width="1" opacity="0.8"/>
  <path d="M12 10.5v3" stroke="#6b2d4d" stroke-width="1" opacity="0.8"/>

  <!-- Helmet crest -->
  <path d="M12 2v4" stroke="#2a2a35" stroke-width="3"/>
  <path d="M12 2v4" stroke="#3a3a45" stroke-width="1.5"/>

  <!-- Shoulder armor hints -->
  <ellipse cx="4" cy="18" rx="3" ry="2" fill="#1a1a20"/>
  <ellipse cx="20" cy="18" rx="3" ry="2" fill="#1a1a20"/>
  <ellipse cx="4" cy="17.7" rx="2.5" ry="1.5" fill="#2a2a35"/>
  <ellipse cx="20" cy="17.7" rx="2.5" ry="1.5" fill="#2a2a35"/>

  <!-- Dark aura -->
  <circle cx="12" cy="12" r="11" fill="none" stroke="#6b2d4d" stroke-width="0.5" opacity="0.3"/>

</svg>