<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="2" fill="#1a1a20" opacity="0.3"/>

  <!-- Troll head (smaller, wiser look) -->
  <ellipse cx="10" cy="11" rx="6" ry="5.5" fill="#3a4a2a"/>
  <ellipse cx="10" cy="10.5" rx="5.5" ry="5" fill="#5a6a4a"/>
  <ellipse cx="10" cy="10" rx="4.5" ry="4" fill="#7a8a6a"/>

  <!-- Wise squinting eyes -->
  <path d="M7 9q1.5 1 3 0" fill="none" stroke="#3a4a2a" stroke-width="1.5"/>
  <path d="M11 9q1.5 1 3 0" fill="none" stroke="#3a4a2a" stroke-width="1.5"/>
  <circle cx="8.5" cy="9.5" r="0.4" fill="#6a4a8a"/>
  <circle cx="12.5" cy="9.5" r="0.4" fill="#6a4a8a"/>

  <!-- Big nose -->
  <ellipse cx="10" cy="12" rx="1.5" ry="1" fill="#3a4a2a"/>

  <!-- Small tusks -->
  <path d="M7 14l-0.3 1.5" stroke="#f0e8d8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M13 14l0.3 1.5" stroke="#f0e8d8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Staff -->
  <line x1="18" y1="3" x2="18" y2="20" stroke="#5a4030" stroke-width="2"/>
  <line x1="18.3" y1="4" x2="18.3" y2="19" stroke="#7a6050" stroke-width="1"/>

  <!-- Magic orb on staff -->
  <circle cx="18" cy="4" r="3" fill="#3a2a4a" opacity="0.5"/>
  <circle cx="18" cy="4" r="2.5" fill="#6a4a8a"/>
  <circle cx="18" cy="4" r="1.8" fill="#9a6aba"/>
  <circle cx="17.5" cy="3.5" r="0.8" fill="#ba8ada" opacity="0.7"/>

  <!-- Magic sparkles -->
  <circle cx="16" cy="2" r="0.4" fill="#cc99ff"/>
  <circle cx="20" cy="5" r="0.3" fill="#cc99ff"/>
  <circle cx="19" cy="2.5" r="0.25" fill="#cc99ff"/>

</svg>