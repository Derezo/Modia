  <ellipse cx="12" cy="10" rx="5.5" ry="4.5" fill="#448844"/>
  <ellipse cx="12" cy="9.5" rx="5" ry="4" fill="#66aa66"/>

  <!-- Pointed Ears -->
  <path d="M6 8l-3-4 2 5z" fill="#448844"/>
  <path d="M18 8l3-4-2 5z" fill="#448844"/>
  <path d="M6.5 8.5l-2-3 1.5 3.5z" fill="#66aa66"/>
  <path d="M17.5 8.5l2-3-1.5 3.5z" fill="#66aa66"/>

  <!-- Eyes -->
  <ellipse cx="9" cy="9" rx="1.5" ry="1.7999999999999998" fill="#2a2a2a"/>
  <ellipse cx="15" cy="9" rx="1.5" ry="1.7999999999999998" fill="#2a2a2a"/>
  <circle cx="9" cy="9" r="0.75" fill="#ffd700"/>
  <circle cx="15" cy="9" r="0.75" fill="#ffd700"/>
  <circle cx="8.775" cy="8.775" r="0.30000000000000004" fill="#fff" opacity="0.6"/>
  <circle cx="14.775" cy="8.775" r="0.30000000000000004" fill="#fff" opacity="0.6"/>

  <!-- Nose -->
  <ellipse cx="12" cy="11.5" rx="1" ry="0.7" fill="#2a4a2a"/>

  <!-- Mouth with fangs -->
