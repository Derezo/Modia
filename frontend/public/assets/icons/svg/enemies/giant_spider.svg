<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="7" ry="1.5" fill="#1a1a20" opacity="0.3"/>

  <!-- Abdomen hint -->
  <ellipse cx="12" cy="17" rx="5" ry="3" fill="#1a1a1a"/>

  <!-- Cephalothorax (head) -->
  <ellipse cx="12" cy="11" rx="6" ry="5" fill="#1a1a1a"/>
  <ellipse cx="12" cy="10.5" rx="5.5" ry="4.5" fill="#3a2a2a"/>
  <ellipse cx="12" cy="10" rx="4.5" ry="3.5" fill="#5a4a3a"/>

  <!-- 8 Eyes (2 large center, 6 small around) -->
  <!-- Large center eyes -->
  <circle cx="10" cy="9" r="1.5" fill="#1a0000"/>
  <circle cx="14" cy="9" r="1.5" fill="#1a0000"/>
  <circle cx="10" cy="9" r="1" fill="#aa0000"/>
  <circle cx="14" cy="9" r="1" fill="#aa0000"/>
  <circle cx="9.7" cy="8.7" r="0.4" fill="#ff6666"/>

  <!-- Small eyes row 1 -->
  <circle cx="8" cy="8" r="0.8" fill="#aa0000"/>
  <circle cx="16" cy="8" r="0.8" fill="#aa0000"/>

  <!-- Small eyes row 2 -->
  <circle cx="9" cy="6.5" r="0.6" fill="#aa0000" opacity="0.8"/>
  <circle cx="12" cy="6" r="0.6" fill="#aa0000" opacity="0.8"/>
  <circle cx="15" cy="6.5" r="0.6" fill="#aa0000" opacity="0.8"/>

  <!-- Mandibles/Chelicerae -->
  <path d="M10 13q-1 2-0.5 4" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 13q1 2 0.5 4" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="9.5" cy="17" r="0.8" fill="#3a2a2a"/>
  <circle cx="14.5" cy="17" r="0.8" fill="#3a2a2a"/>

  <!-- Leg hints -->
  <path d="M6 10l-3 3" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M6 12l-4 1" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M18 10l3 3" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M18 12l4 1" stroke="#1a1a1a" stroke-width="1"/>

</svg>