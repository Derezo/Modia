<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

  <!-- Shadow -->
  <ellipse cx="12" cy="21" rx="9" ry="2" fill="#1a1a20" opacity="0.3"/>

  <!-- Very large brutish head -->
  <ellipse cx="12" cy="11" rx="9" ry="8" fill="#3a4a3a"/>
  <ellipse cx="12" cy="10.5" rx="8.5" ry="7.5" fill="#4a5a4a"/>
  <ellipse cx="12" cy="10" rx="7.5" ry="6.5" fill="#5a6a5a"/>

  <!-- Very heavy brow -->
  <path d="M4 7q8-4 16 0" fill="#3a4a3a"/>
  <path d="M5 7.5q7-3.5 14 0" fill="#4a5a4a"/>

  <!-- Tiny angry eyes deep under brow -->
  <circle cx="8" cy="10" r="1" fill="#2a2a2a"/>
  <circle cx="16" cy="10" r="1" fill="#2a2a2a"/>
  <circle cx="8" cy="10" r="0.5" fill="#aa4400"/>
  <circle cx="16" cy="10" r="0.5" fill="#aa4400"/>

  <!-- Huge nose -->
  <ellipse cx="12" cy="13" rx="2.5" ry="2" fill="#3a4a3a"/>
  <ellipse cx="12" cy="12.8" rx="2" ry="1.5" fill="#4a5a4a"/>
  <circle cx="10.5" cy="13.5" r="0.6" fill="#3a4a3a"/>
  <circle cx="13.5" cy="13.5" r="0.6" fill="#3a4a3a"/>

  <!-- Large tusks -->
  <path d="M7 16l-2 4" stroke="#e0d8c8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M17 16l2 4" stroke="#e0d8c8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M7.3 16.3l-1.6 3.2" stroke="#f0e8d8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M16.7 16.3l1.6 3.2" stroke="#f0e8d8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Warts -->
  <circle cx="6" cy="12" r="0.8" fill="#3a4a3a"/>
  <circle cx="18" cy="11" r="0.6" fill="#3a4a3a"/>

</svg>