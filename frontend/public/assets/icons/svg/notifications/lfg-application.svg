  <path class="stroke" d="M4 18.5c0 1 .75 1.5 1.5 1.5"/>
  <!-- List lines -->
  <path class="stroke" d="M8 8h6"/>
  <path class="stroke" d="M8 12h6"/>
  <!-- List line details -->
  <path class="stroke" d="M8 10h4M8 14h3" style="stroke-width: 1;"/>
  <!-- Quill pen -->
  <path class="stroke metallic" d="M17 3l4-1-1 4-3 3-2-2 2-4z"/>
  <path class="stroke" d="M15 7l-1 4"/>
  <!-- Quill feather detail -->
