  <path d="M12 6l2 4h4l-3.2 2.8 1.2 4-4-2.4-4 2.4 1.2-4L6 10h4z" fill="#daa520"/>

  <!-- Star bright center (light gold) -->
  <path d="M12 7l1.5 3h3l-2.4 2.1 0.9 3-3-1.8-3 1.8 0.9-3L7.5 10h3z" fill="#ffd700"/>

  <!-- Star highlight -->
