  <!-- Left laurel leaves -->
  <g fill="#8b6914">
    <ellipse cx="5" cy="16" rx="1.5" ry="3" transform="rotate(-20 5 16)"/>
    <ellipse cx="6" cy="13" rx="1.3" ry="2.5" transform="rotate(-25 6 13)"/>
    <ellipse cx="7" cy="10" rx="1.2" ry="2.2" transform="rotate(-30 7 10)"/>
    <ellipse cx="8" cy="7.5" rx="1" ry="2" transform="rotate(-35 8 7.5)"/>
  </g>
  <g fill="#daa520">
    <ellipse cx="5.3" cy="15.8" rx="1" ry="2.2" transform="rotate(-20 5.3 15.8)"/>
    <ellipse cx="6.3" cy="12.8" rx="0.9" ry="1.8" transform="rotate(-25 6.3 12.8)"/>
    <ellipse cx="7.3" cy="9.8" rx="0.8" ry="1.5" transform="rotate(-30 7.3 9.8)"/>
    <ellipse cx="8.2" cy="7.5" rx="0.6" ry="1.3" transform="rotate(-35 8.2 7.5)"/>
  </g>

  <!-- Right laurel branch (gold) -->
  <path d="M20 19c0-5-2-9-5-13" fill="none" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right laurel leaves -->
  <g fill="#8b6914">
    <ellipse cx="19" cy="16" rx="1.5" ry="3" transform="rotate(20 19 16)"/>
    <ellipse cx="18" cy="13" rx="1.3" ry="2.5" transform="rotate(25 18 13)"/>
    <ellipse cx="17" cy="10" rx="1.2" ry="2.2" transform="rotate(30 17 10)"/>
    <ellipse cx="16" cy="7.5" rx="1" ry="2" transform="rotate(35 16 7.5)"/>
  </g>
  <g fill="#daa520">
    <ellipse cx="18.7" cy="15.8" rx="1" ry="2.2" transform="rotate(20 18.7 15.8)"/>
    <ellipse cx="17.7" cy="12.8" rx="0.9" ry="1.8" transform="rotate(25 17.7 12.8)"/>
    <ellipse cx="16.7" cy="9.8" rx="0.8" ry="1.5" transform="rotate(30 16.7 9.8)"/>
    <ellipse cx="15.8" cy="7.5" rx="0.6" ry="1.3" transform="rotate(35 15.8 7.5)"/>
  </g>

  <!-- Center star (dark gold base) -->
  <path d="M12 5l2.5 5h5l-4 3.5 1.5 5-5-3-5 3 1.5-5-4-3.5h5z" fill="#8b6914"/>

