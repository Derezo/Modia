  <!-- Ribbon ends (gold) -->
  <path d="M3 21l1.5 1 1-1.5z" fill="#8b6914"/>
  <path d="M3.5 21.2l1 0.6 0.5-1z" fill="#ffd700"/>
  <path d="M21 21l-1.5 1-1-1.5z" fill="#8b6914"/>
  <path d="M20.5 21.2l-1 0.6-0.5-1z" fill="#ffd700"/>

  <!-- Star rim detail -->
  <path d="M12 6l2 4h4l-3.2 2.8 1.2 4-4-2.4-4 2.4 1.2-4L6 10h4z" fill="none" stroke="#b8860b" stroke-width="0.4"/>
