<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="22" rx="7" ry="1.5" fill="#3d2a00" opacity="0.3"/>

  <!-- Left laurel branch (gold) -->
