<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Wax seal - system notification (official/important) -->
  <!-- Seal base -->
  <circle class="stroke metallic" cx="12" cy="12" r="8"/>
  <!-- Inner seal ring -->
  <circle class="stroke" cx="12" cy="12" r="5"/>
  <!-- Royal/system emblem -->
  <path class="stroke metallic" d="M12 7l1.5 2.5h3l-2 2 1 3-3.5-2-3.5 2 1-3-2-2h3z"/>
  <!-- Seal edge texture -->
  <path class="stroke" d="M5 9c-.5.5-.5 1 0 1.5M19 9c.5.5.5 1 0 1.5M5 14c-.5-.5-.5-1 0-1.5M19 14c.5-.5.5-1 0-1.5" style="stroke-width: 1;"/>
  <!-- Wax drip details -->
  <path class="stroke" d="M8 19c0 1 .5 1.5 1 2M16 19c0 1-.5 1.5-1 2" style="stroke-width: 1;"/>
  <!-- Center dot -->
  <circle cx="12" cy="12" r="0.75" fill="currentColor"/>
</svg>
