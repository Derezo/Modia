<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="13" cy="21" rx="7" ry="2" fill="#2a1515" opacity="0.3"/>

  <!-- Wax seal base (dark red/brown) -->
  <circle cx="12" cy="12" r="9" fill="#662222"/>

  <!-- Wax seal mid layer (medium red) -->
  <circle cx="12" cy="12" r="8" fill="#884444"/>

  <!-- Wax seal bright area (lighter red) -->
  <circle cx="11" cy="11" r="6.5" fill="#aa5555"/>

  <!-- Wax highlight -->
  <circle cx="9" cy="9" r="3.5" fill="#cc6666" opacity="0.5"/>

  <!-- Top edge highlight -->
  <circle cx="8" cy="7" r="1.5" fill="#dd8888" opacity="0.4"/>

  <!-- Inner seal ring (gold) -->
  <circle cx="12" cy="12" r="5.5" fill="none" stroke="#8b6914" stroke-width="1"/>
  <circle cx="12" cy="12" r="5" fill="none" stroke="#daa520" stroke-width="0.6"/>

  <!-- Royal/system emblem - crown star (gold) -->
  <path d="M12 7l1.8 3h3.5l-2.5 2.3 1.2 3.7-4-2.5-4 2.5 1.2-3.7-2.5-2.3h3.5z" fill="#8b6914"/>
  <path d="M12 8l1.4 2.4h2.8l-2 1.8 0.9 3-3.1-2-3.1 2 0.9-3-2-1.8h2.8z" fill="#daa520"/>
  <path d="M12 9l1 1.8h2l-1.4 1.3 0.6 2.1-2.2-1.4-2.2 1.4 0.6-2.1-1.4-1.3h2z" fill="#ffd700"/>

  <!-- Emblem highlight -->
  <path d="M11.5 9.5l0.8 1.3h1.5" fill="none" stroke="#ffe44d" stroke-width="0.5" opacity="0.6"/>

  <!-- Seal edge texture (wax drips) -->
  <g fill="#662222">
    <ellipse cx="4.5" cy="10" rx="1" ry="1.5" transform="rotate(-20 4.5 10)"/>
    <ellipse cx="19.5" cy="10" rx="1" ry="1.5" transform="rotate(20 19.5 10)"/>
    <ellipse cx="5" cy="14" rx="0.8" ry="1.3" transform="rotate(-10 5 14)"/>
    <ellipse cx="19" cy="14" rx="0.8" ry="1.3" transform="rotate(10 19 14)"/>
  </g>
  <g fill="#884444">
    <ellipse cx="4.7" cy="10" rx="0.6" ry="1" transform="rotate(-20 4.7 10)"/>
    <ellipse cx="19.3" cy="10" rx="0.6" ry="1" transform="rotate(20 19.3 10)"/>
  </g>

  <!-- Bottom wax drip details -->
  <path d="M8 19c0 1.5 0.8 2 1.5 2.5" fill="none" stroke="#662222" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 19c0 1.5-0.8 2-1.5 2.5" fill="none" stroke="#662222" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8.3 19.2c0 1.2 0.6 1.6 1.2 2" fill="none" stroke="#884444" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M15.7 19.2c0 1.2-0.6 1.6-1.2 2" fill="none" stroke="#884444" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Seal rim detail -->
  <circle cx="12" cy="12" r="8" fill="none" stroke="#551111" stroke-width="0.4"/>
</svg>
