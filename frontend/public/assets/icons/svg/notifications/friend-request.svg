<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="13" cy="21" rx="6" ry="1.5" fill="#1a2f1a" opacity="0.3"/>

  <!-- Shield base (dark gold) -->
  <path d="M12 2l8 3v6c0 5-3 8-8 10-5-2-8-5-8-10V5l8-3z" fill="#8b6914"/>

  <!-- Shield mid layer (gold) -->
  <path d="M12 3l7 2.5v5.5c0 4.5-2.5 7.5-7 9.5-4.5-2-7-5-7-9.5V5.5L12 3z" fill="#daa520"/>

  <!-- Shield bright area (light gold) -->
  <path d="M12 4l6 2v5c0 4-2 6.5-6 8.5-4-2-6-4.5-6-8.5V6l6-2z" fill="#ffd700"/>

  <!-- Shield highlight -->
  <path d="M9 5.5l3-1 2 0.8v4c0 2-1 3.5-2 4.5" fill="#ffe44d" opacity="0.5"/>

  <!-- Question mark (dark green for contrast) -->
  <g fill="none" stroke="#2d5530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 9c0-1.5 1-2.5 2-2.5s2 1 2 2c0 1.5-2 1.5-2 3"/>
    <circle cx="12" cy="15" r="0.1" stroke-width="3"/>
  </g>

  <!-- Question mark highlight (medium green) -->
  <g fill="none" stroke="#448844" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <path d="M10.5 8.5c0-1 0.8-2 1.5-2"/>
  </g>

  <!-- Shield rivets (dark gold) -->
  <circle cx="7" cy="6.5" r="1" fill="#8b6914"/>
  <circle cx="17" cy="6.5" r="1" fill="#8b6914"/>
  <circle cx="7" cy="6.5" r="0.6" fill="#ffd700"/>
  <circle cx="17" cy="6.5" r="0.6" fill="#ffd700"/>

  <!-- Shield rim detail -->
  <path d="M12 3l7 2.5v5.5c0 4.5-2.5 7.5-7 9.5-4.5-2-7-5-7-9.5V5.5L12 3z" fill="none" stroke="#b8860b" stroke-width="0.5"/>
</svg>
