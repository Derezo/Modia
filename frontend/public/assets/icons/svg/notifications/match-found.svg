<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="8" ry="2" fill="#2a1515" opacity="0.3"/>

  <!-- Arena base ellipse (dark) -->
  <ellipse cx="12" cy="18" rx="9" ry="3" fill="#662222"/>
  <ellipse cx="12" cy="18" rx="8" ry="2.5" fill="#884444"/>
  <ellipse cx="12" cy="18" rx="7" ry="2" fill="#aa5555"/>

  <!-- Left pillar (gold) -->
  <rect x="2" y="8" width="3" height="10" fill="#8b6914"/>
  <rect x="2.5" y="8" width="2" height="10" fill="#daa520"/>
  <rect x="3" y="8" width="1" height="10" fill="#ffd700" opacity="0.5"/>

  <!-- Right pillar (gold) -->
  <rect x="19" y="8" width="3" height="10" fill="#8b6914"/>
  <rect x="19.5" y="8" width="2" height="10" fill="#daa520"/>
  <rect x="20" y="8" width="1" height="10" fill="#ffd700" opacity="0.5"/>

  <!-- Main arch (red gradient) -->
  <path d="M2 9c0-5 4.5-7 10-7s10 2 10 7" fill="#662222"/>
  <path d="M3 9c0-4.5 4-6 9-6s9 1.5 9 6" fill="#884444"/>
  <path d="M4 9c0-4 3.5-5 8-5s8 1 8 5" fill="#aa5555"/>

  <!-- Arch highlight -->
  <path d="M6 7c0-2 2.5-3 6-3s6 1 6 3" fill="#cc6666" opacity="0.4"/>

  <!-- Inner pillars (gold detail) -->
  <rect x="5" y="9" width="2" height="9" fill="#8b6914"/>
  <rect x="5.3" y="9" width="1.4" height="9" fill="#daa520"/>
  <rect x="17" y="9" width="2" height="9" fill="#8b6914"/>
  <rect x="17.3" y="9" width="1.4" height="9" fill="#daa520"/>

  <!-- Center gate arch (darker opening) -->
  <path d="M9 18v-6c0-2.5 1.5-4 3-4s3 1.5 3 4v6" fill="#331111"/>
  <path d="M10 18v-5.5c0-2 1-3 2-3s2 1 2 3v5.5" fill="#221111"/>

  <!-- Gate bars (gold) -->
  <rect x="10.5" y="10" width="0.8" height="8" fill="#8b6914"/>
  <rect x="12.7" y="10" width="0.8" height="8" fill="#8b6914"/>

  <!-- Arch keystone (gold) -->
  <path d="M10 8h4l-0.5 2h-3z" fill="#8b6914"/>
  <path d="M10.5 8.5h3l-0.3 1h-2.4z" fill="#daa520"/>
  <path d="M11 9h2" fill="none" stroke="#ffd700" stroke-width="0.5"/>

  <!-- Arena floor (lighter) -->
  <ellipse cx="12" cy="16" rx="4" ry="1.5" fill="#884444"/>
  <ellipse cx="12" cy="16" rx="3" ry="1" fill="#aa5555"/>

  <!-- Decorative elements (gold rivets) -->
  <circle cx="3.5" cy="9" r="1" fill="#8b6914"/>
  <circle cx="3.5" cy="9" r="0.6" fill="#ffd700"/>
  <circle cx="20.5" cy="9" r="1" fill="#8b6914"/>
  <circle cx="20.5" cy="9" r="0.6" fill="#ffd700"/>
  <circle cx="12" cy="4" r="1.2" fill="#8b6914"/>
  <circle cx="12" cy="4" r="0.7" fill="#ffd700"/>

  <!-- Rim details -->
  <path d="M3 9c0-4.5 4-6 9-6s9 1.5 9 6" fill="none" stroke="#551111" stroke-width="0.5"/>
</svg>
