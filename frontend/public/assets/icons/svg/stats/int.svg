  <path d="M22 4c-2-1-5-1-10 1v16c5-2 8-2 10-1V4z" fill="#3d2850"/>

  <!-- Mid layer - book pages -->
  <path d="M3 5c2-0.8 4.5-0.8 9 0.8v14.5c-4.5-1.6-7-1.6-9-0.8V5z" fill="#6b4488"/>
  <path d="M21 5c-2-0.8-4.5-0.8-9 0.8v14.5c4.5-1.6 7-1.6 9-0.8V5z" fill="#6b4488"/>

