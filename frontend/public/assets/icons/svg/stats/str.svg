<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metallic { fill: currentColor; fill-opacity: 0.15; }
  </style>
  <!-- Sword - strength symbol -->
  <path class="stroke metallic" d="M14.5 3L21 9.5l-2 2-6.5-6.5z"/>
  <!-- Blade -->
  <path class="stroke" d="M12.5 5.5L5 13l-2 8 8-2 7.5-7.5"/>
  <!-- Cross guard -->
  <path class="stroke" d="M9 9l-3 3M12 6l3 3"/>
  <!-- Blade edge detail -->
  <path class="stroke" d="M7 15l4-4" style="stroke-width: 1;"/>
  <!-- Pommel -->
