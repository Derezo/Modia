<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="12" cy="21" rx="5" ry="1.5" fill="#5a2d2d" opacity="0.25"/>

  <!-- Base layer (darkest) - sword silhouette -->
  <path d="M12 2l2 1v10l3 3v2l-3-1v3h-4v-3l-3 1v-2l3-3V3l2-1z" fill="#5a2d2d"/>

  <!-- Mid layer - main sword body -->
  <path d="M12 3l1.5 0.8v9.2l2.5 2.5v1l-2.5-0.8v2.3h-3v-2.3l-2.5 0.8v-1l2.5-2.5V3.8L12 3z" fill="#8b4444"/>

  <!-- Bright layer - blade face -->
  <path d="M12 4l1 0.5v8l2 2v0.5l-2-0.5v2h-2v-2l-2 0.5v-0.5l2-2v-8L12 4z" fill="#b05555"/>

  <!-- Crossguard base (dark) -->
  <path d="M6 12h12v2H6z" fill="#5a2d2d"/>

  <!-- Crossguard mid -->
  <path d="M7 12.3h10v1.4H7z" fill="#8b4444"/>

  <!-- Crossguard highlight -->
  <path d="M8 12.5h8v0.8H8z" fill="#b05555"/>

  <!-- Blade highlight (left edge) -->
  <path d="M11 5v7.5" fill="none" stroke="#cc7777" stroke-width="0.8" opacity="0.5"/>

  <!-- Top highlight -->
  <ellipse cx="11" cy="5" rx="1" ry="1.5" fill="#cc7777" opacity="0.5"/>

  <!-- Pommel (bottom) -->
  <circle cx="12" cy="19" r="1.5" fill="#5a2d2d"/>
  <circle cx="12" cy="19" r="1" fill="#8b4444"/>
  <circle cx="11.5" cy="18.5" r="0.4" fill="#cc7777" opacity="0.5"/>

  <!-- Edge detail stroke -->
  <path d="M12 2l2 1v10l3 3v2l-3-1v3h-4v-3l-3 1v-2l3-3V3l2-1z" fill="none" stroke="#5a2d2d" stroke-width="0.4"/>
</svg>
