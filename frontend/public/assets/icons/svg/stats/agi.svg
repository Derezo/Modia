<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Drop shadow -->
  <ellipse cx="11" cy="21" rx="6" ry="1.5" fill="#2d5530" opacity="0.25"/>

  <!-- Base layer (darkest) - boot silhouette -->
  <path d="M4 20h10l2-3v-4l-2-1v-2l4-3v-2l-6 4v4l-2 1v2l-4 1z" fill="#2d5530"/>

  <!-- Mid layer - boot body -->
  <path d="M5 19.5h9l1.8-2.8v-3.5l-1.8-0.9v-2.2l3.5-2.6v-1.2l-5 3.5v3.8l-1.8 0.9v2l-3.5 0.8z" fill="#448844"/>

  <!-- Bright layer - boot face -->
  <path d="M6 19h8l1.5-2.5v-3l-1.5-0.8v-2l3-2.2v-0.8l-4 3v3.5l-1.5 0.8v1.8l-3 0.5z" fill="#66aa66"/>

  <!-- Sole highlight -->
  <path d="M5.5 19.5h8.5" fill="none" stroke="#88cc88" stroke-width="1" opacity="0.6"/>

  <!-- Wing base (dark) -->
  <path d="M16 8c2-1 5-2 6-1s0 3-2 5l-3-2z" fill="#2d5530"/>

  <!-- Wing mid -->
  <path d="M16.5 8.5c1.5-0.8 4-1.5 5-0.8s0 2.5-1.5 4l-2.5-1.7z" fill="#448844"/>

  <!-- Wing bright -->
  <path d="M17 9c1.2-0.6 3-1 4-0.5s0 2-1 3l-2-1.3z" fill="#66aa66"/>

  <!-- Wing highlight -->
  <ellipse cx="19" cy="9" rx="1.5" ry="0.8" fill="#88cc88" opacity="0.5"/>

  <!-- Speed lines -->
  <path d="M1 10h3M1 13h4M1 16h3" fill="none" stroke="#66aa66" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Boot top highlight -->
  <ellipse cx="14" cy="8" rx="1" ry="1.5" fill="#88cc88" opacity="0.5"/>

  <!-- Boot shine -->
  <path d="M8 15v2" fill="none" stroke="#88cc88" stroke-width="0.6" opacity="0.5"/>

  <!-- Edge detail stroke -->
  <path d="M4 20h10l2-3v-4l-2-1v-2l4-3v-2l-6 4v4l-2 1v2l-4 1z" fill="none" stroke="#2d5530" stroke-width="0.4"/>
</svg>
